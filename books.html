<style>

</style>

<div class="wrap">

  <header class="page">
    <h1>독서 처방 — 칠살격(七殺格)</h1>
    <p>위기를 먹고 사는 격(格)을 위한 독서 목록. 요약을 누르면 전체 내용이 펼쳐집니다.</p>
  </header>
  <div id="root"></div>
  <p class="disc">표지 이미지는 Google Books에서 자동으로 불러오며, 불러오지 못하면 제목 표지로 대체됩니다. 추천 사유는 명리(命理) 관점의 해설로 참고용입니다.</p>
</div>
<script>
const SECTIONS = [
 { title:"1. 동기를 키우는 책 (動機)", intro:"칠살격의 본성 — 위기 앞에서 오히려 선명해지는 구조 — 을 언어로 확인시켜 주는 책들.", books:[
   {ko:"안티프래질", en:"Antifragile · Nassim Nicholas Taleb", desc:"충격을 받을수록 강해지는 구조를 이론으로 정리한 책. 칠살의 본성이 왜 작동하는지를 언어로 설명해준다. 자신이 왜 위기 앞에서 오히려 선명해지는지 이해하게 된다."},
   {ko:"편집광만이 살아남는다", en:"Only the Paranoid Survive · Andrew Grove", desc:"위기를 먹고 사는 칠살의 경전. 인텔이 전략적 변곡점을 어떻게 통과했는지의 기록이다. 편집증은 결함이 아니라 이 격의 생존 도구라는 것을 확인시켜 준다."},
   {ko:"하드씽", en:"The Hard Thing About Hard Things · Ben Horowitz", desc:"정답 없는 고통의 한복판에서 결정하는 법. 칠살격이 실제로 살아가는 풍경이 이 책에 그대로 있다. 위로가 아니라 실전 기록이기 때문에 더 가치 있다."},
   {ko:"블랙 스완", en:"The Black Swan · Nassim Nicholas Taleb", desc:"꼬리에 숨은 거대한 위험을 보는 법. 칠살은 남들이 안 보는 곳을 본다는 강점이 있는데, 이 책은 그 본능을 이론으로 다듬어 준다."},
   {ko:"리프트오프", en:"Liftoff · Eric Berger", desc:"파산 직전까지 갔던 스페이스엑스 초창기의 기록. 벼랑 끝에서 쏘아 올리는 법. 신약한 칠살격이 자기 격의 가능성을 가장 직접적으로 확인할 수 있는 서사다."},
   {ko:"손자병법 (孫子兵法)", en:"The Art of War · 손무(孫武)", desc:"싸우지 않고 이기는 것이 으뜸이라는 역설. 칠살이 칼을 아끼는 법을 배우는 전략의 원전. 힘을 쏟는 것보다 힘을 아끼는 것이 더 높은 경지임을 이 명조는 일찍 알아야 한다."},
   {ko:"한비자 (韓非子)", en:"Han Feizi · 한비(韓非)", desc:"법·술·세. 인정에 기대지 않고 권력을 운용하는 법을 이천 년 전에 다 적어 놓았다. 칠살의 병법서. 단, 이 책은 동기이면서 동시에 경고이기도 하다 — 한비자 본인의 결말을 잊지 말 것."},
   {ko:"군주론", en:"The Prince · Niccolò Machiavelli", desc:"권력은 어떻게 잡고 어떻게 잃는가. 한비자의 서양 짝. 칠살격이 세상을 읽는 언어를 얻는다."},
   {ko:"스트레스 테스트", en:"Stress Test · Timothy Geithner", desc:"금융 위기를 직접 수습한 사람의 회고. 압박 속 의사결정의 실전 기록. 칠살격은 이런 책에서 자기 격의 쓸모를 확인한다."},
   {ko:"대마불사", en:"Too Big to Fail · Andrew Ross Sorkin", desc:"금융 시스템이 무너지던 며칠의 기록. 위기의 한복판을 미리 걸어보는 책. 칠살은 실전 전에 이런 지형을 머릿속에 그려두는 것이 유리하다."},
   {ko:"타이탄", en:"Titan · Ron Chernow", desc:"록펠러의 냉혹한 야망. 권력 의지가 어디까지 가는지의 표본. 동기이자 동시에 그 끝을 보여주는 책이기도 하다."},
   {ko:"전쟁론", en:"On War · Carl von Clausewitz", desc:"전장의 안개와 마찰. 계획이 현실과 부딪힐 때 무슨 일이 생기는지에 대한 가장 정직한 책. 칠살격이 자신의 결단이 왜 예상과 다르게 흘러가는지를 이해하게 된다."},
   {ko:"글로벌 카타스트로피", en:"Global Catastrophes and Trends · Vaclav Smil", desc:"인류를 위협하는 진짜 위험의 목록. 칠살의 시야로 본 세계. 거시적 위험을 읽는 눈을 기른다."},
   {ko:"헝거 게임", en:"The Hunger Games · Suzanne Collins", desc:"생존 게임의 서사. 가볍게 읽어도 칠살은 알아본다. 이 격의 직관이 서사 안에서 자연스럽게 반응한다."},
 ]},
 { title:"2. 약점을 메우는 책 (補完) ★ 더 중요하다", intro:"신약한 칠살격의 가장 큰 위험은 자신도 모르게 칼에 베이는 것이다. 제어되지 않은 칠살은 외부를 향하기 전에 먼저 내부를 무너뜨린다. 이 보완 처방은 동기보다 더 힘주어 읽어야 한다.", books:[
   {ko:"명상록", en:"Meditations · Marcus Aurelius", desc:"가장 큰 권력을 쥔 사람이 매일 밤 자신을 다스리려고 쓴 일기. 이 명조에 이보다 맞는 약이 없다. 로마 황제가 황제의 자리에서 매일 자신을 경계했다는 사실 자체가 처방이다. 칠살격은 이 책을 책상에 두고 반복해서 읽어야 한다. 한 번 읽는 책이 아니다."},
   {ko:"숨결이 바람 될 때", en:"When Breath Becomes Air · Paul Kalanithi", desc:"칠살에게 가장 필요한 건 멈춤이다. 죽음 앞에서 삶을 다시 보는 의사의 기록. 압박과 결단만 알던 사람이 처음으로 속도를 늦추게 되는 책. 이 명조가 가장 읽기 불편해할 책이고, 그래서 가장 필요한 책이다."},
   {ko:"죽음의 수용소에서", en:"Man's Search for Meaning · Viktor Frankl", desc:"모든 것을 빼앗긴 수용소에서 찾아낸 의미. 고통을 힘으로 바꾸는 다른 길을 보여준다. 칠살격은 고통을 투지로 바꾸는 데는 능하지만, 고통에서 의미를 찾는 데는 서툴다. 이 책이 그 빈자리를 채운다."},
   {ko:"1984", en:"1984 · George Orwell", desc:"힘이 인간을 어떻게 망가뜨리는가. 칼을 쥔 자가 읽어야 할 경고. 권력 의지가 어디서 뒤틀리는지를 가장 선명하게 보여주는 소설이다."},
   {ko:"제3제국의 흥망", en:"The Rise and Fall of the Third Reich · William L. Shirer", desc:"제어되지 않은 권력 의지의 결말. 칠살이 두려워해야 할 거울. 이 책을 읽고 나서 자신의 결단 방식을 다시 점검하는 것이 이 처방의 목적이다."},
   {ko:"앵무새 죽이기", en:"To Kill a Mockingbird · Harper Lee", desc:"강함이 약자를 향할 때와 지킬 때의 차이를 보여준다. 칠살의 방향을 잡는 책. 이 명조의 힘이 어디를 향해야 하는지를 조용하지만 단단하게 말한다."},
 ]},
 { title:"3. 지금 대운에 읽으면 좋은 책 — 계유(癸酉) 편인격(偏印格) 대운", intro:"평생 엔진은 칠살격이지만 지금 이 대운은 편인격(偏印格) 시기다. 계유(癸酉) 대운은 금수(金水)가 겹치며 인성의 기운이 두터워지는 국면이다. 칠살의 결단과 행동 본능이 잠시 내면으로 향하고, 사유·통찰·학습의 회로가 열린다. 행동보다 사유가 먼저인 드문 국면이니, 이 대운이 주는 편인의 기운을 낭비하지 말라.", books:[
   {ko:"가난한 찰리의 연감", en:"Poor Charlie's Almanack · Charlie Munger", desc:"여러 학문을 격자처럼 엮는 멍거의 사고법. 편인의 다학제 직관에 깊이를 더한다. 칠살격이 평생 쓸 사고의 뼈대를 이 대운에 세울 수 있다.", tag:"동기"},
   {ko:"사피엔스 / 호모 데우스", en:"Sapiens / Homo Deus · Yuval Noah Harari", desc:"인류를 통째로 다시 보는 거대 서사. 편인이 가장 사랑할 책. 칠살의 시야에 역사적 종 단위의 깊이가 더해진다.", tag:"동기"},
   {ko:"이기적 유전자", en:"The Selfish Gene · Richard Dawkins", desc:"생명을 유전자의 눈으로 뒤집어 본다. 관점을 바꾸는 통찰. 편인 대운에 이런 관점 전복이 가장 잘 소화된다.", tag:"동기"},
   {ko:"제로 투 원", en:"Zero to One · Peter Thiel", desc:"남이 안 가는 길에 답이 있다는 역발상. 편인의 본능이 투자와 창업의 언어로 번역된 책이다.", tag:"동기"},
   {ko:"인과추론의 과학", en:"The Book of Why · Judea Pearl", desc:"상관관계 너머의 인과를 묻는 법. 세상을 보는 틀 자체를 바꾸는 책. 편인 대운에 이 훈련을 해두면 칠살격의 판단력이 다음 단계로 올라간다.", tag:"동기"},
   {ko:"과학혁명의 구조", en:"The Structure of Scientific Revolutions · Thomas Kuhn", desc:"패러다임이라는 말이 여기서 나왔다. 세상을 보는 틀 자체가 통째로 갈아엎히는 순간을 다룬다. 편인의 관점 전복에 가장 잘 맞는 책 중 하나다.", tag:"동기"},
   {ko:"괴델, 에셔, 바흐", en:"Gödel, Escher, Bach · Douglas Hofstadter", desc:"수학과 그림과 음악을 엮어 의식의 수수께끼를 파고든다. 편인의 머리를 위한 잔칫상. 이 대운에 이 책을 읽지 않으면 언제 읽겠는가.", tag:"동기"},
   {ko:"장자 (莊子)", en:"Zhuangzi · 장주(莊周)", desc:"반복독서의 왕. 젊어서는 자유를, 중년에는 집착을, 늙어서는 죽음을 읽는다. 읽을 때마다 다른 책이 되는 편인의 평생 거울. 이 대운에 처음 펼치고, 이후 대운마다 다시 펴라.", tag:"동기"},
   {ko:"싯다르타", en:"Siddhartha · Hermann Hesse", desc:"구도의 길을 그린 소설. 편인이 평생 곁에 둘 책. 칠살격이 행동 사이의 고요를 배우는 데 이 소설이 뜻밖의 역할을 한다.", tag:"동기"},
   {ko:"죽음의 부정", en:"The Denial of Death · Ernest Becker", desc:"문명이란 죽음의 공포를 부정하려는 몸부림이라는 주장. 편인의 깊이와 닿는다. 칠살격이 자신의 권력 의지 아래에 무엇이 있는지를 들여다보게 된다.", tag:"동기"},
   {ko:"코스모스", en:"Cosmos · Carl Sagan", desc:"칼 세이건이 우주의 시점에서 인간을 내려다본 책. 칠살격의 긴장을 잠시 내려놓게 하는 거대한 관조. 편인 대운에 이 시선이 필요하다.", tag:"동기"},
   {ko:"투자에 대한 생각", en:"The Most Important Thing · Howard Marks", desc:"남과 같은 생각으로는 남보다 나은 결과가 없다. 2차적 사고의 투자론. 편인의 역발상 본능을 실전에 연결한다.", tag:"동기"},
   {ko:"라이프 3.0 / 슈퍼인텔리전스", en:"Life 3.0 (Max Tegmark) / Superintelligence (Nick Bostrom)", desc:"아직 오지 않은 미래를 미리 사유하는 책. 편인 대운에 이런 장기 사유를 해두면 칠살격의 전략적 시야가 넓어진다.", tag:"동기"},
   {ko:"시킹 위즈덤", en:"Seeking Wisdom · Peter Bevelin", desc:"멍거의 지혜를 체계로 정리한 책. 편인의 사색에 뼈대를 더한다. 『가난한 찰리의 연감』과 함께 읽으면 좋다.", tag:"동기"},
   {ko:"주역 (周易)", en:"I Ching · 작자 미상", desc:"잘못 읽으면 점치는 책, 잘 읽으면 변화의 문법. 세상이 움직이는 결을 상(象)으로 읽는 법을 가르친다. 편인 대운에 이 책을 처음 펼치는 것이 맞다.", tag:"동기"},
   {ko:"원칙", en:"Principles · Ray Dalio", desc:"직관을 검증 가능한 원칙으로 묶는 법. 편인의 공상을 현실로 내리는 닻. 이 대운에 이 책을 읽지 않으면 좋은 생각들이 생각으로만 끝난다.", tag:"보완"},
   {ko:"현명한 투자자", en:"The Intelligent Investor · Benjamin Graham", desc:"편인의 변덕에 필요한 안전마진과 규율. 발을 땅에 붙이는 책. 칠살격의 결단 본능과 편인의 직관이 이 책의 규율과 만나면 비로소 실전이 된다.", tag:"보완"},
   {ko:"팩트풀니스", en:"Factfulness · Hans Rosling", desc:"머릿속 그림 말고 데이터를 보라. 고립된 사유를 세상과 잇는 책. 편인 대운에 자신의 직관이 얼마나 자주 틀리는지를 확인하는 훈련이 필요하다.", tag:"보완"},
   {ko:"측정의 기술", en:"How to Measure Anything · Douglas Hubbard", desc:"막연한 직관을 숫자로 바꾸는 훈련. 편인이 가장 약한 영역을 직접 건드린다. 불편하게 읽힐수록 더 필요한 약이다.", tag:"보완"},
 ]},
 { title:"4. 어떤 격이든 먼저 읽으면 좋은 5권", intro:"이 다섯 권은 격을 가리지 않는다. 모든 사유의 바닥이 되는 책들이다.", books:[
   {ko:"사피엔스", en:"Sapiens · Yuval Noah Harari", desc:"내가 속한 종(種)의 내력을 아는 일. 모든 사유의 바닥. 이 책을 읽기 전과 후에 세상이 다르게 보인다."},
   {ko:"역사의 교훈", en:"The Lessons of History · Will & Ariel Durant", desc:"짧지만 무겁다. 인간이 반복하는 것들의 목록. 칠살격이 역사에서 자신의 격을 확인하는 책이기도 하다."},
   {ko:"가난한 찰리의 연감", en:"Poor Charlie's Almanack · Charlie Munger", desc:"여러 학문을 한데 엮어 보는 법. 어떤 격이든 사고가 넓어진다. 이 명조에는 평생 곁에 둘 책이다."},

];

function firstSentence(t){ const m=t.match(/^[^.!?]*[.!?]/); return m?m[0].trim():t; }
const root=document.getElementById('root');
SECTIONS.forEach(sec=>{
  const s=document.createElement('section'); s.className='section';
  s.innerHTML='<h2>'+sec.title+'</h2>'+(sec.intro?'<div class="intro">'+sec.intro+'</div>':'')+'<div class="grid"></div>';
  const grid=s.querySelector('.grid');
  sec.books.forEach(b=>{
    const card=document.createElement('div'); card.className='book';
    const q='intitle:'+(b.en.split('·')[0].split('/')[0].trim());
    card.innerHTML=
      '<div class="cover"><img alt="'+b.ko+' 표지" loading="lazy"><div class="fb">'+b.ko+'</div></div>'+
      '<div class="meta">'+
        (b.tag?'<span style="font-size:10px;font-weight:700;color:'+(b.tag==='보완'?'#b45309':'#15803d')+'">['+b.tag+']</span> ':'')+
        '<p class="ko">'+b.ko+'</p>'+
        '<p class="en">'+b.en+'</p>'+
        '<p class="sum">'+firstSentence(b.desc)+'</p>'+
        '<span class="toggle">▾ 자세히 보기</span>'+
        '<p class="full">'+b.desc+'</p>'+
      '</div>';
    card.addEventListener('click',()=>{
      card.classList.toggle('open');
      card.querySelector('.toggle').textContent=card.classList.contains('open')?'▴ 접기':'▾ 자세히 보기';
    });
    card.dataset.q=q;
    grid.appendChild(card);
  });
  root.appendChild(s);
});

// 표지 lazy 로드 (Google Books) + 실패 시 제목 표지 폴백
const io=new IntersectionObserver((ents,obs)=>{
  ents.forEach(e=>{ if(!e.isIntersecting)return; obs.unobserve(e.target); loadCover(e.target); });
},{rootMargin:'200px'});
document.querySelectorAll('.book').forEach(c=>io.observe(c));
async function loadCover(card){
  const img=card.querySelector('.cover img'), fb=card.querySelector('.cover .fb');
  try{
    const r=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=1&q='+encodeURIComponent(card.dataset.q));
    const d=await r.json();
    const links=d.items&&d.items[0]&&d.items[0].volumeInfo&&d.items[0].volumeInfo.imageLinks;
    const url=links&&(links.thumbnail||links.smallThumbnail);
    if(url){ img.onload=()=>{img.style.display='block';fb.style.display='none';}; img.src=url.replace('http://','https://'); }
  }catch(e){ /* 폴백(제목 표지) 유지 */ }
}
