<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>수특 그림 모음 — 나만 보기</title>
<!-- 수능특강 그림은 EBS 저작물이라 이 페이지에는 그림도 목록도 없다. 로그인한 주인 계정일 때만 /api/ebs/ 에서 받아 그린다(worker/ebs.js). -->
<style>
:root { --bg:#f7f8fa; --card:#fff; --text:#1f2430; --dim:#5b6475; --mute:#8a93a5; --line:#e3e7ee; --accent:#16a34a; --accent-soft:#e8f6ee; --warn:#e11d48; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,sans-serif; line-height:1.6; }
main { max-width:1080px; margin:0 auto; padding:28px 16px 80px; }
a { color:var(--accent); }
.top { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.top a { font-size:13px; padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); text-decoration:none; color:var(--dim); }
h1 { font-size:1.7em; margin:0 0 4px; }
.lead { color:var(--dim); margin:0 0 18px; font-size:.95em; }
.tabs, .chips { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 10px; }
.tabs button, .chips button { font:inherit; font-size:14px; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--dim); cursor:pointer; }
.tabs button[aria-pressed="true"], .chips button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.chips button { font-size:13px; padding:5px 12px; }
.bar { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:6px 0 16px; color:var(--dim); font-size:13px; }
.bar .meter { flex:1; min-width:140px; height:6px; background:var(--line); border-radius:6px; overflow:hidden; }
.bar .meter i { display:block; height:100%; background:var(--accent); width:0; }
.msg { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; text-align:center; color:var(--dim); }
.msg b { color:var(--text); }
.msg .go { display:inline-block; margin-top:12px; padding:9px 18px; border-radius:10px; background:#fee500; color:#191919; text-decoration:none; font-weight:600; }
details.ch { background:var(--card); border:1px solid var(--line); border-radius:14px; margin:0 0 10px; }
details.ch > summary { list-style:none; cursor:pointer; padding:14px 16px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
details.ch > summary::-webkit-details-marker { display:none; }
details.ch > summary::before { content:'▸'; color:var(--mute); }
details.ch[open] > summary::before { content:'▾'; }
summary .no { font-weight:700; color:var(--accent); }
summary .tt { font-weight:600; }
summary .ct { color:var(--mute); font-size:13px; }
summary .nt { margin-left:auto; font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; padding:0 14px 16px; }
.fig { position:relative; border:1px solid var(--line); border-radius:10px; background:#fff; padding:6px; cursor:zoom-in; display:flex; flex-direction:column; gap:4px; text-align:left; font:inherit; color:inherit; }
.fig img { width:100%; height:120px; object-fit:contain; background:#fff; }
.fig .lb { font-size:12px; color:var(--dim); }
.fig .lb small { color:var(--mute); }
.fig.seen { opacity:.55; }
.fig.seen::after { content:'✓'; position:absolute; top:6px; right:8px; color:var(--accent); font-weight:700; }
.empty { color:var(--mute); font-size:13px; padding:0 16px 16px; }
.box { position:fixed; inset:0; background:rgba(15,18,25,.92); display:none; flex-direction:column; z-index:50; }
.box.on { display:flex; }
.box .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:12px; min-height:0; }
.box img { width:100%; height:100%; object-fit:contain; }
.box .ctl { display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; padding:10px 12px 16px; color:#dfe5f0; font-size:14px; }
.box .ctl button { font:inherit; padding:8px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; cursor:pointer; }
.box .ctl button.seen-on { background:var(--accent); border-color:var(--accent); }
.box .info { width:100%; text-align:center; color:#c5cdda; font-size:13px; }
.foot { margin-top:26px; color:var(--mute); font-size:12px; }
</style>
</head>
<body>
<main>
  <nav class="top"><a href="../index.html">↑ 통합 허브</a><a href="../aboutSuneungBio1/index.html">생명과학Ⅰ 노트</a><a href="../aboutSuneungPhysics1/index.html">물리Ⅰ 노트</a></nav>
  <h1>🔒 수특 그림 모음</h1>
  <p class="lead">2027 수능특강의 그림·그래프·자료만 장별로 모았어요. EBS 연계 문항은 교재 자료를 바꿔서 내니, 그림을 한 번씩 눈에 익혀 두세요. <b>내 계정으로 로그인했을 때만</b> 보입니다.</p>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="chips"></div>
  <div class="bar"><span id="count"></span><span class="meter"><i id="meter"></i></span></div>
  <div id="out"></div>
  <p class="foot">그림을 누르면 크게 보고 ← → 로 넘깁니다. ‘✓ 봤어요’는 이 브라우저에만 기억돼요. 그림 출처: EBS 2027학년도 수능특강(개인 학습용).</p>
</main>
<div class="box" id="box" role="dialog" aria-modal="true" aria-label="그림 크게 보기">
  <div class="stage"><img id="big" alt=""></div>
  <div class="ctl"><div class="info" id="info"></div><button id="prev">← 이전</button><button id="seen">✓ 봤어요</button><button id="next">다음 →</button><button id="close">닫기 (Esc)</button></div>
</div>
<script>
(function () {
  var SET = '2027-sutk';
  var SUBS = [
    { id: 'bio1', name: '생명과학Ⅰ', notes: '../aboutSuneungBio1/chapters/', map: { 1: '01-life', 2: '02-metabolism', 3: '02-metabolism', 4: '03-neuron-muscle', 5: '04-nervous-homeostasis', 6: '04-nervous-homeostasis', 7: '05-defense', 8: '06-cell-division', 9: '07-human-genetics', 10: '07-human-genetics', 11: '08-ecosystem', 12: '08-ecosystem' } },
    { id: 'physics1', name: '물리Ⅰ', notes: '../aboutSuneungPhysics1/chapters/', map: { 1: '01-forces', 2: '01-forces', 3: '02-energy-heat', 4: '02-energy-heat', 5: '03-spacetime', 6: '04-matter', 7: '05-electromagnetism', 8: '06-waves', 9: '07-duality' } },
  ];
  var KINDS = ['전체', '개념', '2점', '3점', '안 본 것'];
  var $ = function (id) { return document.getElementById(id); };
  var seen = {};
  try { seen = JSON.parse(localStorage.getItem('sn:ebs:seen') || '{}') || {}; } catch (e) { seen = {}; }
  function save() { try { localStorage.setItem('sn:ebs:seen', JSON.stringify(seen)); } catch (e) {} }
  var sub = SUBS[0], kind = '전체', data = {}, list = [], cur = -1;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var key = function (f) { return SET + '/' + sub.id + '/' + f.id; };
  var src = function (f) { return '/api/ebs/' + SET + '/' + sub.id + '/' + f.id + '.webp'; };
  var label = function (f) { return 'p.' + f.page + ' · ' + f.kind + (f.num ? ' ' + f.num + '번' : ''); };

  function tabs() {
    $('tabs').innerHTML = SUBS.map(function (s) { return '<button type="button" data-sub="' + s.id + '" aria-pressed="' + (s === sub) + '">' + s.name + '</button>'; }).join('');
    $('chips').innerHTML = KINDS.map(function (k) { return '<button type="button" data-kind="' + k + '" aria-pressed="' + (k === kind) + '">' + k + '</button>'; }).join('');
  }
  function show(msg) { $('out').innerHTML = '<div class="msg">' + msg + '</div>'; $('count').textContent = ''; $('meter').style.width = '0'; }
  function pass(f) { return kind === '전체' || (kind === '안 본 것' ? !seen[key(f)] : f.kind === kind); }

  function render() {
    var idx = data[sub.id];
    var all = idx.chapters.reduce(function (n, c) { return n + c.figs.length; }, 0);
    var done = idx.chapters.reduce(function (n, c) { return n + c.figs.filter(function (f) { return seen[key(f)]; }).length; }, 0);
    $('count').textContent = sub.name + ' — 본 그림 ' + done + ' / ' + all;
    $('meter').style.width = (all ? done / all * 100 : 0) + '%';
    var open = {};
    document.querySelectorAll('details.ch[open]').forEach(function (d) { open[d.dataset.n] = 1; });
    $('out').innerHTML = idx.chapters.map(function (c) {
      var figs = c.figs.filter(pass);
      var have = c.figs.filter(function (f) { return seen[key(f)]; }).length;
      var note = sub.map[c.n] ? '<a class="nt" href="' + sub.notes + sub.map[c.n] + '.html">노트 →</a>' : '';
      return '<details class="ch" data-n="' + c.n + '"' + (open[c.n] ? ' open' : '') + '><summary><span class="no">' + String(c.n).padStart(2, '0') + '</span><span class="tt">' + esc(c.title) + '</span><span class="ct">' + figs.length + '장 · 본 것 ' + have + '/' + c.figs.length + '</span>' + note + '</summary><div class="grid" data-n="' + c.n + '"></div></details>';
    }).join('');
    document.querySelectorAll('details.ch').forEach(function (d) {
      if (d.open) fill(d);
      d.addEventListener('toggle', function () { if (d.open) fill(d); });
    });
  }
  // 펼친 장만 그림을 불러온다
  function fill(d) {
    var g = d.querySelector('.grid');
    if (g.dataset.done) return;
    g.dataset.done = '1';
    var c = data[sub.id].chapters.filter(function (x) { return String(x.n) === d.dataset.n; })[0];
    var figs = c.figs.filter(pass);
    g.innerHTML = figs.length ? figs.map(function (f) {
      return '<button type="button" class="fig' + (seen[key(f)] ? ' seen' : '') + '" data-id="' + f.id + '"><img decoding="async" src="' + src(f) + '" alt="' + esc(label(f)) + '" width="' + f.w + '" height="' + f.h + '"><span class="lb">' + esc(label(f)) + (f.cap ? ' <small>' + esc(f.cap) + '</small>' : '') + '</span></button>';
    }).join('') : '<p class="empty">이 조건에 맞는 그림이 없어요.</p>';
  }

  function openAt(i) {
    cur = i;
    var f = list[i];
    $('big').src = src(f);
    $('big').alt = label(f);
    $('info').textContent = (i + 1) + ' / ' + list.length + ' · ' + label(f) + (f.code ? ' · [' + f.code + ']' : '') + (f.cap ? ' · ' + f.cap : '');
    $('seen').className = seen[key(f)] ? 'seen-on' : '';
    $('box').classList.add('on');
  }
  function closeBox() { $('box').classList.remove('on'); cur = -1; render(); }
  function step(d) { if (cur < 0) return; openAt((cur + d + list.length) % list.length); }
  function toggleSeen() {
    if (cur < 0) return;
    var k = key(list[cur]);
    if (seen[k]) delete seen[k]; else seen[k] = Date.now();
    save();
    $('seen').className = seen[k] ? 'seen-on' : '';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.sub) { sub = SUBS.filter(function (s) { return s.id === t.dataset.sub; })[0]; history.replaceState(null, '', '#' + sub.id); tabs(); load(); }
    else if (t.dataset.kind) { kind = t.dataset.kind; tabs(); if (data[sub.id]) render(); }
    else if (t.classList.contains('fig')) {
      var n = t.closest('details').dataset.n;
      list = data[sub.id].chapters.filter(function (x) { return String(x.n) === n; })[0].figs.filter(pass);
      openAt(list.map(function (f) { return f.id; }).indexOf(t.dataset.id));
    }
  });
  $('prev').onclick = function () { step(-1); };
  $('next').onclick = function () { step(1); };
  $('close').onclick = closeBox;
  $('seen').onclick = toggleSeen;
  document.addEventListener('keydown', function (e) {
    if (cur < 0) return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'Escape') closeBox();
    else if (e.key === ' ') { e.preventDefault(); toggleSeen(); }
  });
  var sx = null;
  $('box').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  $('box').addEventListener('touchend', function (e) { if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); sx = null; });

  function load() {
    if (data[sub.id]) { render(); return; }
    show('불러오는 중…');
    fetch('/api/ebs/' + SET + '/' + sub.id + '/index.json', { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) return show('<b>로그인이 필요해요.</b><br>이 모음은 내 계정에서만 열립니다.<br><a class="go" href="/api/auth/kakao/login?next=' + encodeURIComponent('/suneung-ebs/#' + sub.id) + '">카카오로 로그인</a>');
      if (r.status === 403) return show('<b>주인 계정만 볼 수 있는 페이지예요.</b><br>교재 그림은 EBS 저작물이라 공개하지 않습니다.');
      if (!r.ok) return show('아직 이 과목 그림이 없어요.');
      return r.json().then(function (j) { data[sub.id] = j; render(); });
    }).catch(function () { show('불러오지 못했어요. 잠시 뒤 새로 고침해 주세요.'); });
  }
  var h = location.hash.slice(1);
  sub = SUBS.filter(function (s) { return s.id === h; })[0] || SUBS[0];
  tabs();
  load();
})();
</script>
</body>
</html>
