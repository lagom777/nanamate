<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(245, 158, 11, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#f59e0b"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 물리학 핵심요약</text>
    <text x="145" y="20" fill="#f59e0b" font-size="12" font-weight="800">PART 05</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">광학 — 전반사와 광통신</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Total Internal Reflection, Optical Fibers &amp; Dispersion</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#f59e0b" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
          <text x="83" y="34" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">전반사의 조건</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">임계각과 전반사 원리</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#fbbf24" font-size="12" font-weight="700">⚡ 전반사(TIR) 2대 필수 조건</text>
                  <text x="12" y="46" fill="#ffffff" font-size="11.5" font-weight="700">1. 밀한 매질 ⟶ 소한 매질 (n₁ &gt; n₂)</text>
                  <text x="12" y="66" fill="#ffffff" font-size="11.5" font-weight="700">2. 입사각 &gt; 임계각 θ_c (i &gt; θ_c)</text>
                  <text x="12" y="86" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="700">임계각 공식: sinθ_c = n₂ / n₁</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="126" fill="#34d399" font-size="12" font-weight="700">빛의 분산 (프리즘)</text>
                  <text x="12" y="148" fill="#cbd5e1" font-size="11">진동수 높을수록(보라색) 굴절률 n 큼 ⟶ 굴절각 큼</text>
                  <text x="12" y="168" fill="#e2e8f0" font-size="11">굴절각: 빨강 &lt; 주황 &lt; 노랑 &lt; 초록 &lt; 파랑 &lt; 보라</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
          <text x="83" y="34" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">광섬유 구조</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">코어와 클래딩의 굴절률 비교</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
                  <text x="12" y="24" fill="#fcd34d" font-size="12" font-weight="700">광섬유(Optical Fiber) 핵심 원리</text>
                  <text x="12" y="47" fill="#ffffff" font-size="12" font-weight="800">중심 코어(Core) 굴절률 &gt; 클래딩(Cladding)</text>
                  <text x="12" y="68" fill="#e2e8f0" font-size="11.5">코어 안에서 빛이 연속적인 <tspan fill="#f59e0b" font-weight="700">전반사</tspan>로 전송됨</text>
                  <text x="12" y="87" fill="#94a3b8" font-size="10.5">광신호는 에너지 손실이 매우 적어 대용량 장거리 전송</text>

                  <rect x="0" y="105" width="280" height="87" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="128" fill="#38bdf8" font-size="12" font-weight="700">전자기파 스펙트럼 분류</text>
                  <text x="12" y="150" fill="#cbd5e1" font-size="10.5">감마선 &gt; X선 &gt; 자외선 &gt; 가시광선 &gt; 적외선 &gt; 마이크로파 &gt; 라디오파</text>
                  <text x="12" y="170" fill="#34d399" font-size="11">왼쪽으로 갈수록: 진동수 f↑, 에너지 E↑ / 파장 λ↓</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
          <text x="83" y="34" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">수능 실전 개념</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">볼록렌즈 상과 굴절률 판별</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="700">렌즈 방정식 공식</text>
                  <text x="12" y="48" fill="#ffffff" font-size="13" font-family="monospace" font-weight="700">1 / a + 1 / b = 1 / f</text>
                  <text x="12" y="70" fill="#cbd5e1" font-size="11">a: 물체 거리 / b: 상 거리 / f: 초점 거리</text>
                  <text x="12" y="86" fill="#fcd34d" font-size="11">배율 m = |b / a| = 상의 크기 / 물체의 크기</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="126" fill="#34d399" font-size="12" font-weight="700">🎯 수능 굴절각 비교 팁</text>
                  <text x="12" y="148" fill="#cbd5e1" font-size="11">법선에 더 가까운 매질 = <tspan fill="#34d399" font-weight="700">밀한 매질 (n 큼)</tspan></text>
                  <text x="12" y="168" fill="#cbd5e1" font-size="11">법선에서 더 멀리 꺾인 매질 = <tspan fill="#f43f5e" font-weight="700">소한 매질 (n 작음)</tspan></text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="156" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="118.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#전반사조건(n₁>n₂)</text>
        
        <rect x="208" y="565" width="189" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="302.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#임계각sinθ_c=n₂/n₁</text>
        
        <rect x="409" y="565" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="481.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#광섬유(코어>클래딩)</text>
        
        <rect x="566" y="565" width="167" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="649.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#빛의분산(보라굴절률최대)</text>
        
        <rect x="745" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="801.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#전자기파스펙트럼</text>
        
        <rect x="869" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="908.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#렌즈방정식</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Physics Core Summary</text>
</svg>