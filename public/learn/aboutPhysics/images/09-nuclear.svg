<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(236, 72, 153, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#ec4899"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 물리학 핵심요약</text>
    <text x="145" y="20" fill="#ec4899" font-size="12" font-weight="800">PART 09</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">원자핵 — 핵반응과 질량결손</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Nuclear Fission, Fusion, Mass Defect &amp; Fundamental Forces</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#ec4899" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
          <text x="83" y="34" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">질량 결손과 핵에너지</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">결합 에너지 공식: ΔE = Δm · c²</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#0f172a" stroke="#be185d" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#f472b6" font-size="12" font-weight="700">질량 결손(Mass Defect) 공식</text>
                  <text x="12" y="48" fill="#ffffff" font-size="14" font-family="monospace" font-weight="800">ΔE = Δm · c²</text>
                  <text x="12" y="70" fill="#cbd5e1" font-size="11">Δm = (개별 핵자 질량 합) - (합쳐진 원자핵 질량)</text>
                  <text x="12" y="86" fill="#fcd34d" font-size="11">핵자당 결합 에너지가 클수록 원자핵이 안정함 (철 Fe가 최대)</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="126" fill="#38bdf8" font-size="12" font-weight="700">핵반응식 보존 법칙 (수능 풀이 1초컷)</text>
                  <text x="12" y="148" fill="#cbd5e1" font-size="11.5">1. <tspan fill="#38bdf8" font-weight="700">전하량(원자번호 Z) 보존</tspan>: 반응 전후 아래 숫자 합 동일</text>
                  <text x="12" y="168" fill="#cbd5e1" font-size="11.5">2. <tspan fill="#34d399" font-weight="700">질량수(A) 보존</tspan>: 반응 전후 위 숫자 합 동일</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
          <text x="83" y="34" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">핵분열 vs 핵융합</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">우라늄 연쇄반응과 태양의 핵융합</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
                  <text x="12" y="24" fill="#fbcfe8" font-size="12" font-weight="700">핵분열 (Nuclear Fission)</text>
                  <text x="12" y="47" fill="#cbd5e1" font-size="11">²³⁵U + ¹n ⟶ ⁹²Kr + ¹⁴¹Ba + 3 ¹n + 200 MeV</text>
                  <text x="12" y="67" fill="#cbd5e1" font-size="11">느린 중성자에 의해 연쇄반응 일어남</text>
                  <text x="12" y="84" fill="#94a3b8" font-size="10.5">원자로 제어: 감속재(물/흑연), 제어봉(붕소/카드뮴)</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="126" fill="#f59e0b" font-size="12" font-weight="700">핵융합 (Nuclear Fusion)</text>
                  <text x="12" y="148" fill="#cbd5e1" font-size="11">²H + ³H ⟶ ⁴He + ¹n + 17.6 MeV (태양 에너지원)</text>
                  <text x="12" y="168" fill="#34d399" font-size="11">초고온 플라스마 상태(1억도 이상) 필요 (토카막 ITER)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
          <text x="83" y="34" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">자연의 4대 상호작용</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">기본 상호작용과 매개 입자</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="700">자연의 4대 기본 힘 세기 순서</text>
                  <text x="12" y="47" fill="#cbd5e1" font-size="11">강한 상호작용(강력) &gt; 전자기력 &gt; 약력 &gt; 중력</text>
                  <text x="12" y="67" fill="#ffffff" font-size="11">강력: 양성자·중성자를 묶음 (글루온 매개)</text>
                  <text x="12" y="86" fill="#cbd5e1" font-size="10.5">약력: 베타 붕괴 매개 (W/Z 보손)  /  전자기력: 광자</text>

                  <rect x="0" y="105" width="280" height="87" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="128" fill="#f43f5e" font-size="12" font-weight="700">방사성 붕괴와 반감기</text>
                  <text x="12" y="150" fill="#e2e8f0" font-size="11.5">N(t) = N₀ · (½)^(t / T)</text>
                  <text x="12" y="170" fill="#cbd5e1" font-size="11">α붕괴(⁴He방출), β⁻붕괴(중성자⟶양성자+전자)</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="112.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#질량결손ΔE=Δmc²</text>
        
        <rect x="197" y="565" width="123" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="258.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#전하량·질량수보존</text>
        
        <rect x="332" y="565" width="134" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="399.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#우라늄핵분열연쇄반응</text>
        
        <rect x="478" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="517.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#수소핵융합</text>
        
        <rect x="569" y="565" width="244" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="691.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#자연의4대힘(강력>전자기>약력>중력)</text>
        
        <rect x="825" y="565" width="57" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="853.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#반감기</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Physics Core Summary</text>
</svg>