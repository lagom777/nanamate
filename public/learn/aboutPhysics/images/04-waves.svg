<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(16, 185, 129, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 물리학 핵심요약</text>
    <text x="145" y="20" fill="#10b981" font-size="12" font-weight="800">PART 04</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">파동과 소리 — 굴절과 간섭</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Wave Properties, Snell's Law &amp; Interference</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#10b981" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
          <text x="83" y="34" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">파동의 기본 요소</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">파동의 속력 공식: v = f λ</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="90" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#34d399" font-size="12" font-weight="700">파동 속력 기본 공식</text>
                  <text x="12" y="48" fill="#ffffff" font-size="14" font-family="monospace" font-weight="800">v = f · λ = λ / T</text>
                  <text x="12" y="70" fill="#cbd5e1" font-size="11">v: 속력 / f: 진동수 (Hz) / λ: 파장 (m) / T: 주기 (1/f)</text>
                  <text x="12" y="86" fill="#fcd34d" font-size="11" font-weight="700">매질이 바뀌어도 <tspan fill="#38bdf8">진동수 f는 절대 불변!</tspan></text>

                  <rect x="0" y="100" width="280" height="92" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="124" fill="#38bdf8" font-size="12" font-weight="700">횡파 vs 종파</text>
                  <text x="12" y="146" fill="#cbd5e1" font-size="11.5">횡파: 매질 진동 ⊥ 파동 진행 (빛, 전자기파, S파)</text>
                  <text x="12" y="166" fill="#cbd5e1" font-size="11.5">종파: 매질 진동 ∥ 파동 진행 (소리/음파, 초음파, P파)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
          <text x="83" y="34" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">파동의 굴절 법칙</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">스넬의 법칙과 매질의 굴절률</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
                  <text x="12" y="24" fill="#6ee7b7" font-size="12" font-weight="700">스넬의 법칙 (굴절률 n)</text>
                  <text x="12" y="48" fill="#ffffff" font-size="13" font-family="monospace" font-weight="800">n₁ sinθ₁ = n₂ sinθ₂</text>
                  <text x="12" y="70" fill="#fcd34d" font-size="12" font-family="monospace">n₂ / n₁ = v₁ / v₂ = λ₁ / λ₂ = sinθ₁ / sinθ₂</text>
                  <text x="12" y="88" fill="#cbd5e1" font-size="10.5">굴절률 클수록(n↑): 속력 느림(v↓), 파장 짧음(λ↓), 각도 작음(θ↓)</text>

                  <rect x="0" y="105" width="280" height="87" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="128" fill="#f59e0b" font-size="12" font-weight="700">소리의 굴절 (낮말새 밤말쥐)</text>
                  <text x="12" y="150" fill="#cbd5e1" font-size="11">온도 높을수록 음속 빠름: v = 331 + 0.6T</text>
                  <text x="12" y="168" fill="#38bdf8" font-size="11">낮(지표 고온 ⟶ 위로 휨) / 밤(상공 고온 ⟶ 아래로 휨)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
          <text x="83" y="34" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">간섭과 정상파</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">경로차와 보강·상쇄 간섭 조건</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#34d399" font-size="12" font-weight="700">🎯 이중 슬릿 간섭 경로차 ΔL</text>
                  <text x="12" y="47" fill="#ffffff" font-size="12" font-family="monospace">보강 간섭(밝음): ΔL = m · λ (m = 0, 1, 2…)</text>
                  <text x="12" y="68" fill="#ffffff" font-size="12" font-family="monospace">상쇄 간섭(어두움): ΔL = (m + ½) · λ</text>
                  <text x="12" y="86" fill="#94a3b8" font-size="10.5">무늬 간격 Δx = Lλ / d (슬릿 간격 d, 스크린 거리 L)</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="126" fill="#38bdf8" font-size="12" font-weight="700">정상파와 도플러 효과</text>
                  <text x="12" y="148" fill="#cbd5e1" font-size="11">정상파: 마디(변위=0, 진폭0)와 배(진폭최대)</text>
                  <text x="12" y="168" fill="#e2e8f0" font-size="11">도플러 효과: 음원 접근 시 파장 압축 ⟶ 고음(f↑)</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="96.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#파동공식v=fλ</text>
        
        <rect x="164" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="209.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#진동수f불변</text>
        
        <rect x="266" y="565" width="244" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="388.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#스넬의법칙n₁sinθ₁=n₂sinθ₂</text>
        
        <rect x="522" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="572.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#경로차보강상쇄</text>
        
        <rect x="635" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="691.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#무늬간격Lλ/d</text>
        
        <rect x="759" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="798.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#도플러효과</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Physics Core Summary</text>
</svg>