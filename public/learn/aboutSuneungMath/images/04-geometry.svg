<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(16, 185, 129, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 수학 핵심요약</text>
    <text x="135" y="20" fill="#10b981" font-size="12" font-weight="800">PART 04</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">기하 — 도형과 좌표기하</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Geometry, Distance &amp; Equations of Circles</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#10b981" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
          <text x="83" y="34" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">피타고라스와 삼각비</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">직각삼각형 &amp; 특수각 비율</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <!-- Triangle sketch -->
                  <polygon points="20,100 120,100 120,30" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
                  <rect x="108" y="88" width="12" height="12" fill="none" stroke="#10b981" stroke-width="1.5"/>
                  <text x="65" y="116" fill="#6ee7b7" font-size="12" font-weight="700">a</text>
                  <text x="128" y="70" fill="#6ee7b7" font-size="12" font-weight="700">b</text>
                  <text x="60" y="55" fill="#f59e0b" font-size="13" font-weight="800">c</text>
                  <text x="150" y="65" fill="#ffffff" font-size="13" font-weight="700">a² + b² = c²</text>
                  
                  <rect x="0" y="125" width="280" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="147" fill="#f59e0b" font-size="11.5" font-weight="700">⚡ 특수각 세 변의 길이 비율</text>
                  <text x="12" y="167" fill="#e2e8f0" font-size="11">30°-60°-90°: <tspan fill="#38bdf8" font-weight="700">1 : √3 : 2</tspan></text>
                  <text x="12" y="184" fill="#e2e8f0" font-size="11">45°-45°-90°: <tspan fill="#38bdf8" font-weight="700">1 : 1 : √2</tspan></text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
          <text x="83" y="34" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">좌표평면의 기하</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">점과 직선 사이의 거리 공식</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#34d399" font-size="12" font-weight="700">점 (x₁, y₁)과 ax + by + c = 0 사이 거리 d</text>
                  <g transform="translate(15, 38)">
                    <rect x="0" y="0" width="250" height="42" rx="6" fill="#0f172a"/>
                    <text x="125" y="26" fill="#fef08a" font-size="14" font-family="monospace" font-weight="800" text-anchor="middle">d = |ax₁ + by₁ + c| / √(a² + b²)</text>
                  </g>

                  <rect x="0" y="102" width="280" height="88" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="126" fill="#38bdf8" font-size="12" font-weight="700">직선의 평행과 수직 조건</text>
                  <text x="12" y="148" fill="#cbd5e1" font-size="11.5">평행: m₁ = m₂ (기울기 같음)</text>
                  <text x="12" y="168" fill="#f43f5e" font-size="12" font-weight="700">수직: m₁ × m₂ = -1 (기울기의 곱이 -1)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
          <text x="83" y="34" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">원의 방정식</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">원의 성질과 접선의 방정식</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="88" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#6ee7b7" font-size="12" font-weight="700">중심 (a, b), 반지름 r인 원의 방정식</text>
                  <text x="12" y="48" fill="#f1f5f9" font-size="13" font-family="monospace" font-weight="700">(x - a)² + (y - b)² = r²</text>
                  <text x="12" y="70" fill="#94a3b8" font-size="11">원과 직선의 위치관계: 중심거리 d와 r 비교</text>

                  <rect x="0" y="98" width="280" height="92" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="122" fill="#f59e0b" font-size="12" font-weight="700">🎯 원 위의 점 (x₁, y₁)에서의 접선 공식</text>
                  <text x="12" y="145" fill="#fde68a" font-size="12" font-family="monospace" font-weight="700">x₁x + y₁y = r² (중심이 원점일 때)</text>
                  <text x="12" y="168" fill="#cbd5e1" font-size="11">기울기 m인 접선: y = mx ± r√(m² + 1)</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="90.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#피타고라스정리</text>
        
        <rect x="153" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="198.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#특수각삼각비</text>
        
        <rect x="255" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="300.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#점과직선거리</text>
        
        <rect x="357" y="565" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="429.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#수직조건m₁m₂=-1</text>
        
        <rect x="514" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="553.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#원의방정식</text>
        
        <rect x="605" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="650.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#접선의방정식</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Math Core Summary</text>
</svg>