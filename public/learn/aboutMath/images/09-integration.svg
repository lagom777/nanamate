<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(168, 85, 247, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#a855f7"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 수학 핵심요약</text>
    <text x="135" y="20" fill="#a855f7" font-size="12" font-weight="800">PART 09</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">적분과 통계</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Definite Integral, Area, Probability &amp; Normal Distribution</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#a855f7" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
          <text x="83" y="34" fill="#d8b4fe" font-size="11" font-weight="700" text-anchor="middle">정적분의 기본정리</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">미적분학 기본정리와 넓이</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="90" rx="8" fill="#0f172a" stroke="#9333ea" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#c084fc" font-size="12" font-weight="700">미적분학의 기본정리 (FTC)</text>
                  <text x="12" y="47" fill="#ffffff" font-size="12" font-family="monospace">∫[a→b] f(x) dx = [F(x)]ₐᵇ = F(b) - F(a)</text>
                  <text x="12" y="69" fill="#e2e8f0" font-size="11.5">d/dx ∫[a→x] f(t) dt = f(x)</text>
                  <text x="12" y="85" fill="#94a3b8" font-size="10.5">정적분으로 정의된 함수: 양변 x미분 + x=a 대입</text>

                  <rect x="0" y="100" width="280" height="92" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="124" fill="#38bdf8" font-size="12" font-weight="700">곡선 사이의 넓이 S</text>
                  <text x="12" y="146" fill="#ffffff" font-size="11.5" font-family="monospace">S = ∫[a→b] |f(x) - g(x)| dx</text>
                  <text x="12" y="167" fill="#fcd34d" font-size="11.5" font-weight="700">이차곡선과 직선 넓이 공식:</text>
                  <text x="12" y="184" fill="#fde68a" font-size="11.5" font-family="monospace">S = |a| / 6 · (β - α)³ (수능 시간단축 필수!)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
          <text x="83" y="34" fill="#d8b4fe" font-size="11" font-weight="700" text-anchor="middle">확률의 4대 카운팅</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">순열, 조합, 중복순열, 중복조합</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#34d399" font-size="12" font-weight="700">경우의 수 4총사 공식 비교</text>
                  <text x="12" y="47" fill="#cbd5e1" font-size="11">순열(순서O): <tspan fill="#34d399" font-weight="700">ₙPᵣ = n! / (n - r)!</tspan></text>
                  <text x="12" y="67" fill="#cbd5e1" font-size="11">조합(순서X): <tspan fill="#38bdf8" font-weight="700">ₙCᵣ = n! / (r!(n - r)!)</tspan></text>
                  <text x="12" y="87" fill="#cbd5e1" font-size="11">중복순열: ₙΠᵣ = nʳ  /  중복조합: <tspan fill="#f59e0b" font-weight="700">ₙHᵣ = ₙ₊ᵣ₋₁Cᵣ</tspan></text>

                  <rect x="0" y="105" width="280" height="87" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="128" fill="#f43f5e" font-size="12" font-weight="700">조건부확률과 독립</text>
                  <text x="12" y="150" fill="#e2e8f0" font-size="11.5">P(B|A) = P(A ∩ B) / P(A)</text>
                  <text x="12" y="170" fill="#cbd5e1" font-size="11">독립 사건 판정: <tspan fill="#38bdf8" font-weight="700">P(A ∩ B) = P(A) · P(B)</tspan></text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
          <text x="83" y="34" fill="#d8b4fe" font-size="11" font-weight="700" text-anchor="middle">수능 표준점수 원리</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">정규분포 곡선과 표준화 Z</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="98" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#d8b4fe" font-size="12" font-weight="700">정규분포 N(m, σ²) 표준화 공식</text>
                  <g transform="translate(10, 36)">
                    <rect x="0" y="0" width="260" height="36" rx="6" fill="#0f172a"/>
                    <text x="130" y="24" fill="#fef08a" font-size="15" font-family="monospace" font-weight="800" text-anchor="middle">Z = (X - m) / σ</text>
                  </g>
                  <text x="12" y="88" fill="#cbd5e1" font-size="11">수능 표준점수: 국·수 = 20(Z) + 100 , 탐구 = 10(Z) + 50</text>

                  <rect x="0" y="108" width="280" height="84" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="132" fill="#38bdf8" font-size="12" font-weight="700">표본평균의 분포와 신뢰구간</text>
                  <text x="12" y="154" fill="#cbd5e1" font-size="11">X̄ ~ N(m, σ²/n) (표준오차: σ/√n)</text>
                  <text x="12" y="172" fill="#e2e8f0" font-size="11">95% 신뢰구간: <tspan fill="#34d399" font-weight="700">[ X̄ - 1.96·σ/√n , X̄ + 1.96·σ/√n ]</tspan></text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="96.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#미적분학기본정리</text>
        
        <rect x="164" y="565" width="211" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="269.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#이차함수넓이|a|/6(β-α)³</text>
        
        <rect x="387" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="437.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#중복조합ₙHᵣ</text>
        
        <rect x="500" y="565" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="572.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#조건부확률P(B|A)</text>
        
        <rect x="657" y="565" width="156" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="735.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#표준화Z=(X-m)/σ</text>
        
        <rect x="825" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="870.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#수능표준점수</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Math Core Summary</text>
</svg>