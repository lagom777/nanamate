<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(245, 158, 11, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#f59e0b"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 수학 핵심요약</text>
    <text x="135" y="20" fill="#f59e0b" font-size="12" font-weight="800">PART 05</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">삼각함수 — 단위원과 법칙</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Trigonometric Functions, Graphs &amp; Sine/Cosine Rules</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#f59e0b" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
          <text x="83" y="34" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">단위원과 호도법</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">호도법과 삼각함수의 정의</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <!-- Unit circle -->
                  <circle cx="70" cy="70" r="50" fill="none" stroke="#64748b" stroke-width="1.5"/>
                  <line x1="10" y1="70" x2="130" y2="70" stroke="#475569" stroke-width="1"/>
                  <line x1="70" y1="10" x2="70" y2="130" stroke="#475569" stroke-width="1"/>
                  <line x1="70" y1="70" x2="105" y2="35" stroke="#f59e0b" stroke-width="2"/>
                  <circle cx="105" cy="35" r="4" fill="#f59e0b"/>
                  <text x="110" y="30" fill="#fcd34d" font-size="10.5" font-weight="700">(cosθ, sinθ)</text>
                  
                  <text x="145" y="45" fill="#f59e0b" font-size="12" font-weight="700">호도법 (Radian)</text>
                  <text x="145" y="65" fill="#cbd5e1" font-size="11.5">180° = π rad</text>
                  <text x="145" y="85" fill="#cbd5e1" font-size="11.5">호의 길이 l = rθ</text>
                  <text x="145" y="105" fill="#cbd5e1" font-size="11.5">넓이 S = ½r²θ = ½rl</text>

                  <rect x="0" y="136" width="280" height="56" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
                  <text x="140" y="170" fill="#ffffff" font-size="14" font-family="monospace" font-weight="800" text-anchor="middle">sin²θ + cos²θ = 1</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
          <text x="83" y="34" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">그래프와 주기</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">주기함수 개형과 변환</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="88" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#fcd34d" font-size="12" font-weight="700">y = a sin(bx - c) + d</text>
                  <text x="12" y="47" fill="#e2e8f0" font-size="11.5">최댓값: <tspan fill="#34d399" font-weight="700">|a| + d</tspan> , 최솟값: <tspan fill="#f43f5e" font-weight="700">-|a| + d</tspan></text>
                  <text x="12" y="70" fill="#e2e8f0" font-size="11.5">주기 T: <tspan fill="#38bdf8" font-weight="700">2π / |b|</tspan> (tan의 주기는 <tspan fill="#38bdf8" font-weight="700">π / |b|</tspan>)</text>

                  <rect x="0" y="98" width="280" height="94" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="122" fill="#38bdf8" font-size="12" font-weight="700">각의 변환 공식 (얼싸안코)</text>
                  <text x="12" y="144" fill="#cbd5e1" font-size="11">1사(All+), 2사(Sin+), 3사(Tan+), 4사(Cos+)</text>
                  <text x="12" y="164" fill="#cbd5e1" font-size="11">sin(π - θ) = sinθ ,  cos(π - θ) = -cosθ</text>
                  <text x="12" y="182" fill="#cbd5e1" font-size="11">sin(π/2 - θ) = cosθ (짝/홀수 공식)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
          <text x="83" y="34" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">수능 빈출 킬러</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">사인법칙 &amp; 코사인법칙</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#fcd34d" font-size="12" font-weight="700">🎯 사인법칙 (외접원 반지름 R)</text>
                  <text x="12" y="48" fill="#ffffff" font-size="13" font-family="monospace" font-weight="700">a/sinA = b/sinB = c/sinC = 2R</text>
                  <text x="12" y="72" fill="#94a3b8" font-size="11">마주보는 변과 각의 쌍이 주어질 때 사용</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="126" fill="#34d399" font-size="12" font-weight="700">🎯 코사인법칙 (두 변과 끼인각)</text>
                  <text x="12" y="148" fill="#ffffff" font-size="12" font-family="monospace" font-weight="700">a² = b² + c² - 2bc cosA</text>
                  <text x="12" y="172" fill="#38bdf8" font-size="11">삼각형 넓이: S = ½bc sinA</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="57" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="68.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#단위원</text>
        
        <rect x="109" y="565" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="181.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#호도법(π=180°)</text>
        
        <rect x="266" y="565" width="134" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="333.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#주기공식2π/|b|</text>
        
        <rect x="412" y="565" width="68" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="446.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#얼싸안코</text>
        
        <rect x="492" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="548.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#사인법칙(2R)</text>
        
        <rect x="616" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="655.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#코사인법칙</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Math Core Summary</text>
</svg>