<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(244, 63, 94, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#f43f5e"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 수학 핵심요약</text>
    <text x="135" y="20" fill="#f43f5e" font-size="12" font-weight="800">PART 01</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">수와 집합</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Number Systems &amp; Set Theory</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#f43f5e" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#f43f5e" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
          <text x="83" y="34" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">수의 포함 체계</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">수 체계의 확장 (ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ)</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 55)">
                  <!-- Concentric circles for number sets -->
                  <ellipse cx="140" cy="110" rx="135" ry="90" fill="#1e1b4b" fill-opacity="0.4" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,3"/>
                  <text x="235" y="45" fill="#a5b4fc" font-size="12" font-weight="700">ℂ 복소수 (a+bi)</text>
                  
                  <ellipse cx="125" cy="115" rx="105" ry="70" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5"/>
                  <text x="185" y="70" fill="#7dd3fc" font-size="12" font-weight="700">ℝ 실수</text>
                  <text x="185" y="85" fill="#94a3b8" font-size="10">무리수(√2, π, e)</text>
                  
                  <ellipse cx="110" cy="120" rx="75" ry="50" fill="#0f172a" fill-opacity="0.7" stroke="#34d399" stroke-width="1.5"/>
                  <text x="140" y="98" fill="#6ee7b7" font-size="11" font-weight="700">ℚ 유리수 (p/q)</text>
                  
                  <ellipse cx="95" cy="125" rx="50" ry="34" fill="#312e81" fill-opacity="0.7" stroke="#f59e0b" stroke-width="1.5"/>
                  <text x="105" y="118" fill="#fcd34d" font-size="11" font-weight="700">ℤ 정수 (0, -n)</text>
                  
                  <circle cx="80" cy="130" r="20" fill="#e11d48" fill-opacity="0.8"/>
                  <text x="80" y="134" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">ℕ 자연수</text>
                </g>
                <text x="25" y="278" fill="#cbd5e1" font-size="12" font-family="monospace">방정식의 해를 구하기 위해 수 체계가 단계별로 확장됨</text>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#f43f5e" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
          <text x="83" y="34" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">집합 연산 &amp; 법칙</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">벤 다이어그램과 드모르간 법칙</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(25, 45)">
                  <!-- Venn Diagram -->
                  <circle cx="100" cy="70" r="55" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="2"/>
                  <circle cx="170" cy="70" r="55" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
                  <text x="65" y="40" fill="#fda4af" font-size="14" font-weight="800">A</text>
                  <text x="205" y="40" fill="#93c5fd" font-size="14" font-weight="800">B</text>
                  <text x="135" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">A ∩ B</text>
                  
                  <!-- Formulas -->
                  <rect x="0" y="140" width="270" height="92" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
                  <text x="12" y="163" fill="#f43f5e" font-size="12" font-weight="700">드모르간 법칙:</text>
                  <text x="12" y="183" fill="#e2e8f0" font-size="12" font-family="monospace">(A ∪ B)ᶜ = Aᶜ ∩ Bᶜ</text>
                  <text x="12" y="202" fill="#e2e8f0" font-size="12" font-family="monospace">(A ∩ B)ᶜ = Aᶜ ∪ Bᶜ</text>
                  <text x="12" y="222" fill="#38bdf8" font-size="11" font-family="monospace">n(A∪B) = n(A) + n(B) - n(A∩B)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#f43f5e" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
          <text x="83" y="34" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">수능 실전 포인트</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">원소의 개수 &amp; 귀류법 증명</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(20, 50)">
                  <rect x="0" y="0" width="280" height="74" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
                  <text x="14" y="24" fill="#fb7185" font-size="12" font-weight="700">⚡ 귀류법 (Proof by Contradiction)</text>
                  <text x="14" y="45" fill="#cbd5e1" font-size="11.5">결론을 부정하여 모순(짝수/기수, 서로소 가정 위배)을</text>
                  <text x="14" y="63" fill="#cbd5e1" font-size="11.5">이끌어내어 참임을 증명 (예: √2 무리수 증명)</text>

                  <rect x="0" y="86" width="280" height="96" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="14" y="110" fill="#38bdf8" font-size="12" font-weight="700">🎯 부분집합 개수 &amp; 필요충분조건</text>
                  <text x="14" y="132" fill="#e2e8f0" font-size="11.5">원소 n개 집합의 부분집합 수: <tspan fill="#f59e0b" font-weight="700">2ⁿ 개</tspan></text>
                  <text x="14" y="152" fill="#e2e8f0" font-size="11.5">진부분집합: 2ⁿ - 1 개</text>
                  <text x="14" y="171" fill="#94a3b8" font-size="11">P ⊂ Q ⟺ p는 q이기 위한 충분조건</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="211" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="145.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#자연수·정수·유리수·실수·복소수</text>
        
        <rect x="263" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="308.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#벤다이어그램</text>
        
        <rect x="365" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="410.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#드모르간법칙</text>
        
        <rect x="467" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="512.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#포함배제원리</text>
        
        <rect x="569" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="614.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#필요충분조건</text>
        
        <rect x="671" y="565" width="57" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="699.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#귀류법</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Math Core Summary</text>
</svg>