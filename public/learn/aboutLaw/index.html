<main><header class="paper-header"><h1><em>법학</em></h1><p class="authors">Vol. 19 · May 2026</p></header>
<div class="scene-3d" id="intro-scene"></div><span class="interact-hint">⚖️ 인터랙티브 3D 시각화</span>
<h2>소개</h2><p>이 사이트에서는 법학의 핵심 개념을 9개 챕터에 걸쳐 3D 인터랙티브로 학습합니다.</p></main></div>
<script>
(function(){
  const c=document.getElementById('intro-scene');if(!c)return;const s=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(50,c.clientWidth/c.clientHeight,0.1,1000);cam.position.set(0,0,8);cam.lookAt(0,0,0);
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setSize(c.clientWidth,c.clientHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));c.appendChild(r.domElement);
  const C=6333946;const post=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,3,10),new THREE.MeshBasicMaterial({color:C}));s.add(post);const beam=new THREE.Mesh(new THREE.BoxGeometry(3,0.12,0.12),new THREE.MeshBasicMaterial({color:C}));beam.position.y=1.3;s.add(beam);[-1.5,1.5].forEach(x=>{const pan=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.05,8,24),new THREE.MeshBasicMaterial({color:C}));pan.rotation.x=Math.PI/2;pan.position.set(x,-0.9,0);beam.add(pan);});
  let md=false,px=0,py=0;c.addEventListener('mousedown',e=>{md=true;px=e.clientX;py=e.clientY;});window.addEventListener('mouseup',()=>md=false);c.addEventListener('mousemove',e=>{if(md){s.rotation.y+=(e.clientX-px)*0.005;s.rotation.x+=(e.clientY-py)*0.005;px=e.clientX;py=e.clientY;}});
  let T=0;function a(){requestAnimationFrame(a);T+=0.016;beam.rotation.z=Math.sin(T)*0.12;s.rotation.y+=0.002;r.render(s,cam);}a();
  window.addEventListener('resize',()=>{cam.aspect=c.clientWidth/c.clientHeight;cam.updateProjectionMatrix();r.setSize(c.clientWidth,c.clientHeight);});
})();
</script>
