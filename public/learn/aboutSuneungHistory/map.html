<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한눈에 보는 영토 변화 — 한국사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#09131F;--bg2:#0E1B2A;--line:#1F3349;--text:#E6EDF5;--muted:#91A5BA;--dim:#5E738B;--acc:#FDE047;
  --fd:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;--fb:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Menlo,monospace}
html,body{background:var(--bg);color:var(--text);margin:0}
body{font-family:var(--fb);font-size:15px;line-height:1.6;padding:22px clamp(16px,3vw,40px) 56px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--fd);font-weight:400;font-size:clamp(28px,3.6vw,40px);margin:0;line-height:1.1}
h1 span{color:var(--acc);transition:color .4s}
.sub{margin:6px 0 0;color:var(--muted);font-size:13px}.sub a{color:var(--acc);text-decoration:none}.sub a:hover{text-decoration:underline}
.board{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg2)}
.stage{position:relative;aspect-ratio:640/660;background:#0A1828}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.info{border-left:1px solid var(--line);padding:24px 26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.yr{font-family:var(--fd);font-size:clamp(34px,4vw,52px);line-height:1;color:var(--acc);transition:color .4s}
.ttl{font-size:22px;font-weight:700;margin:0}
.desc{color:var(--muted);margin:0}
.keys{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.keys li{position:relative;padding-left:16px;font-size:14px}.keys li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--acc)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:10px;border-top:1px dashed var(--line)}
.legend span{display:flex;align-items:center;gap:6px;font-size:13px}.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.links a{font-size:13px;padding:7px 12px;border:1px solid var(--acc);border-radius:10px;color:var(--acc);text-decoration:none}.links a:hover{background:var(--acc);color:var(--bg)}
.ctrl{grid-column:1/-1;border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.btn{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);cursor:pointer;font-size:15px}
.btn:hover{border-color:var(--acc)}.btn.main{background:var(--acc);border-color:var(--acc);color:var(--bg)}
input[type=range]{flex:1;accent-color:var(--acc);height:28px;min-width:0}
.ticks{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.tick{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:7px 6px;border-radius:8px;border:1px solid var(--line);min-width:0;text-align:center;transition:all .25s}
.tick b{font-family:var(--fm);font-size:11.5px;font-weight:500;color:var(--c)}.tick span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick:hover{border-color:var(--c)}.tick[aria-current="true"]{background:color-mix(in srgb,var(--c) 18%,transparent);border-color:var(--c)}
.tick:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.note{color:var(--dim);font-size:12px;font-family:var(--fm)}
@media (max-width:900px){.board{grid-template-columns:1fr}.info{border-left:0;border-top:1px solid var(--line)}
  .ticks{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>한눈에 보는 <span>영토 변화</span></h1>
    <p class="sub"><a href="index.html">← 수능 한국사 노트</a> · <a href="motion.html">🎬 모션 노트</a> · 슬라이더를 끌거나 연도를 눌러 2000년의 지도 변화를 넘겨 보세요 · ← → 키, Space 재생</p>
  </header>
  <section class="board" aria-label="영토 변화 지도">
    <div class="stage"><canvas id="map" role="img" aria-label="영토 변화 지도"></canvas></div>
    <div class="info" aria-live="polite">
      <div class="yr" id="yr"></div>
      <h2 class="ttl" id="ttl"></h2>
      <p class="desc" id="desc"></p>
      <ul class="keys" id="keys"></ul>
      <div class="legend" id="legend"></div>
      <div class="links" id="links"></div>
    </div>
    <div class="ctrl">
      <div class="row">
        <button class="btn" id="prev" aria-label="이전 시기">◀</button>
        <button class="btn main" id="play" aria-label="재생">▶</button>
        <button class="btn" id="next" aria-label="다음 시기">▶▶</button>
        <input type="range" id="slider" min="0" max="10" step="0.01" value="0" aria-label="연도 슬라이더">
      </div>
      <div class="ticks" id="ticks"><button class="tick" data-i="0" style="--c:#F4B544"><b>BC 2세기</b><span>고조선과 부여</span></button><button class="tick" data-i="1" style="--c:#F4B544"><b>1~3세기</b><span>여러 나라의 성장</span></button><button class="tick" data-i="2" style="--c:#4FD1E8"><b>4세기</b><span>백제의 전성기</span></button><button class="tick" data-i="3" style="--c:#4FD1E8"><b>5세기</b><span>고구려의 전성기</span></button><button class="tick" data-i="4" style="--c:#4FD1E8"><b>6세기</b><span>신라의 전성기</span></button><button class="tick" data-i="5" style="--c:#7BE07F"><b>8~9세기</b><span>남북국 시대</span></button><button class="tick" data-i="6" style="--c:#B69CFF"><b>11세기</b><span>고려와 천리장성</span></button><button class="tick" data-i="7" style="--c:#B69CFF"><b>14세기</b><span>공민왕의 영토 수복</span></button><button class="tick" data-i="8" style="--c:#FF9A4D"><b>15세기</b><span>4군 6진, 오늘날 국경의 완성</span></button><button class="tick" data-i="9" style="--c:#A3E635"><b>1945</b><span>38도선 분할</span></button><button class="tick" data-i="10" style="--c:#A3E635"><b>1953</b><span>휴전선(군사 분계선)</span></button></div>
    </div>
  </section>
  <p class="note">경계는 교과서 지도를 단순화한 약도입니다. 정확한 경계는 시기와 학설에 따라 다릅니다. · 2015 개정 교육과정 한국사 범위</p>
</div>
<script>
/* ───────── 공통 도구 ───────── */
const W=960,H=540,TAU=Math.PI*2;
const C={u1:'#F4B544',u2:'#4FD1E8',u3:'#FF7A8A',text:'#E6EDF5',muted:'#91A5BA',dim:'#5E738B',line:'#27405C',panel:'#0E1B2A',
  el:'#6EA8FF',pos:'#FF6B6B',neu:'#AAB6C4',hot:'#FF9A4D',green:'#7BE07F'};
const SANS='"IBM Plex Sans KR",system-ui,sans-serif',MONO='"IBM Plex Mono",Menlo,monospace',SERIF='"Source Serif 4",Georgia,serif',DISP='"Black Han Sans","IBM Plex Sans KR",sans-serif';
const UNITS=[{"k":"1","e":"🪨","name":"선사·고조선","c":"#F4B544"},{"k":"2","e":"⚔️","name":"삼국·가야","c":"#4FD1E8"},{"k":"3","e":"🏯","name":"남북국","c":"#7BE07F"},{"k":"4","e":"🏺","name":"고려","c":"#B69CFF"},{"k":"5","e":"📜","name":"조선 전기","c":"#FF9A4D"},{"k":"6","e":"🌾","name":"조선 후기","c":"#5EEAD4"},{"k":"7","e":"🚂","name":"근대","c":"#FF7A8A"},{"k":"8","e":"✊","name":"일제 강점기","c":"#F472B6"},{"k":"9","e":"🗳️","name":"현대","c":"#A3E635"},{"k":"✦","e":"🧠","name":"암기법","c":"#FDE047"}];
const S=[];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>{k=clamp(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

function fm(s){
  return s.split('`').map((p,i)=>i%2?`<span class="u">${p}</span>`:
    p.replace(/(sin|max|eV)|([A-Za-zθλΦ]+)|_\{([^}]*)\}|_(\S)|\^\{([^}]*)\}|\^(\S)/g,(m,up,w,b1,b2,p1,p2)=>{
      if(up)return up;
      if(w)return `<i>${w}</i>`;
      if(b1!=null||b2!=null)return `<sub>${fm(b1??b2)}</sub>`;
      return `<sup>${fm(p1??p2)}</sup>`;
    })).join('');
}
function T(c,s,x,y,o={}){c.save();c.font=`${o.it?'italic ':''}${o.w||500} ${o.size||18}px ${o.font||SANS}`;c.fillStyle=o.color||C.text;
  c.textAlign=o.align||'left';c.textBaseline=o.base||'middle';if(o.alpha!=null)c.globalAlpha*=o.alpha;c.fillText(s,x,y);c.restore();}
function arrow(c,x1,y1,x2,y2,col,w=3,hd=11){const L=Math.hypot(x2-x1,y2-y1);if(L<2)return;const a=Math.atan2(y2-y1,x2-x1);hd=Math.min(hd,L*.6);
  c.save();c.strokeStyle=c.fillStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-Math.cos(a)*hd*.7,y2-Math.sin(a)*hd*.7);c.stroke();
  c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-hd*Math.cos(a-.42),y2-hd*Math.sin(a-.42));c.lineTo(x2-hd*Math.cos(a+.42),y2-hd*Math.sin(a+.42));c.closePath();c.fill();c.restore();}
function poly(c,pts,col,w=2,o={}){if(pts.length<2)return;c.save();c.strokeStyle=col;c.lineWidth=w;c.lineJoin=c.lineCap='round';if(o.dash)c.setLineDash(o.dash);
  if(o.alpha!=null)c.globalAlpha*=o.alpha;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(o.close)c.closePath();
  if(o.fill){c.fillStyle=o.fill;c.fill();}if(col)c.stroke();c.restore();}
function dot(c,x,y,r,fill,o={}){c.save();if(o.glow){c.shadowColor=o.gc||fill;c.shadowBlur=o.glow;}if(o.alpha!=null)c.globalAlpha*=o.alpha;
  c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);if(fill){c.fillStyle=fill;c.fill();}if(o.stroke){c.strokeStyle=o.stroke;c.lineWidth=o.lw||2;if(o.dash)c.setLineDash(o.dash);c.stroke();}c.restore();}
function box(c,x,y,w,h,r,fill,stroke,lw=2,o={}){c.save();if(o.alpha!=null)c.globalAlpha*=o.alpha;if(o.glow){c.shadowColor=o.gc||fill||stroke;c.shadowBlur=o.glow;}
  c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke();}c.restore();}
function axes(c,x0,y0,w,h,xl,yl,col=C.dim){arrow(c,x0,y0,x0+w,y0,col,1.5,8);arrow(c,x0,y0,x0,y0-h,col,1.5,8);
  T(c,xl,x0+w,y0+17,{size:16,color:C.muted,font:SERIF,it:true,align:'right'});T(c,yl,x0+9,y0-h+4,{size:16,color:C.muted,font:SERIF,it:true});}
function wavy(c,x1,y1,x2,y2,col,lam=16,amp=6,ph=0,w=2.5){const L=Math.hypot(x2-x1,y2-y1);if(L<14)return;const a=Math.atan2(y2-y1,x2-x1);
  c.save();c.translate(x1,y1);c.rotate(a);c.strokeStyle=c.fillStyle=col;c.lineWidth=w;c.beginPath();
  for(let s=0;s<=L-10;s+=1.5){const y=Math.sin(s/lam*TAU-ph)*amp*Math.min(1,s/12,(L-10-s)/12);s?c.lineTo(s,y):c.moveTo(s,y);}c.stroke();
  c.beginPath();c.moveTo(L,0);c.lineTo(L-12,-6);c.lineTo(L-12,6);c.closePath();c.fill();c.restore();}
function wl2rgb(l){if(l<380)return '#A58CFF';if(l>780)return '#B4453A';let r=0,g=0,b=0;
  if(l<440){r=-(l-440)/60;b=1}else if(l<490){g=(l-440)/50;b=1}else if(l<510){g=1;b=-(l-510)/20}else if(l<580){r=(l-510)/70;g=1}else if(l<645){r=1;g=-(l-645)/65}else{r=1}
  const f=l<420?.35+.65*(l-380)/40:l>700?.35+.65*(780-l)/80:1;const q=v=>Math.round(255*Math.pow(v*f,.8));return `rgb(${q(r)},${q(g)},${q(b)})`;}
function label(c,s,x,y,col,o={}){T(c,s,x,y,{size:o.size||15,color:col||C.muted,font:o.font||MONO,align:o.align||'center',w:o.w||500,alpha:o.alpha});}


/* 한국사 모션 노트 장면 엔진 — hist-motion.mjs 가 물리학Ⅰ 모션 노트의 공통 도구 뒤에 붙인다.
   전제: C, UNITS, S, W, H, TAU, SANS, MONO, DISP, clamp, lerp, ease, seg, rnd, T, arrow, poly, dot, box, label 이 이미 정의되어 있다.
   장면은 데이터(SCENES)만 있고, 그리는 일은 템플릿(TPL[type])이 한다. */
const PAL=['#F4B544','#4FD1E8','#FF7A8A','#7BE07F','#B69CFF','#FF9A4D','#5EEAD4','#F472B6'];
const colOf=d=>d.u<0?'#FF7A8A':UNITS[d.u].c;
const TPL={};

/* ── 글자 도구 ── */
function wrap(c,s,maxW,font){c.save();c.font=font;const out=[];
  String(s).split('\n').forEach(par=>{let line='';
    par.split(' ').forEach(wd=>{const test=line?line+' '+wd:wd;
      if(!line||c.measureText(test).width<=maxW)line=test;else{out.push(line);line=wd;}});
    out.push(line);});
  const res=[];out.forEach(l=>{if(c.measureText(l).width<=maxW){res.push(l);return;}let cur='';
    for(const ch of l){if(cur&&c.measureText(cur+ch).width>maxW){res.push(cur);cur=ch;}else cur+=ch;}res.push(cur);});
  c.restore();return res;}
function WT(c,s,x,y,maxW,lh,o={}){const font=`${o.w||500} ${o.size||16}px ${o.font||SANS}`;const ls=wrap(c,s,maxW,font);
  ls.forEach((l,i)=>T(c,l,x,y+i*lh,o));return ls.length;}
function fit(c,s,maxW,size,w=600,font=SANS){c.save();c.font=`${w} ${size}px ${font}`;const m=c.measureText(s).width;c.restore();return m>maxW?Math.max(10,size*maxW/m):size;}
function kicker(c,d,col){label(c,d.kick||UNITS[d.u].name,48,26,C.dim,{size:12,align:'left'});
  if(d.head)T(c,d.head,48,56,{font:DISP,size:27,color:col,w:400});}
function pill(c,s,x,y,col,o={}){c.save();c.font=`${o.w||600} ${o.size||13}px ${SANS}`;const w=c.measureText(s).width+(o.pad||16);c.restore();
  box(c,x-w/2,y-12,w,24,12,o.fill||col+'22',col,1.3,{alpha:o.alpha});T(c,s,x,y+1,{size:o.size||13,w:o.w||600,color:o.tc||C.text,align:'center',alpha:o.alpha});return w;}

/* ── 인트로 ── */
TPL.intro=function(c,t,d){
  label(c,'HISTORY MOTION NOTE',480,44,C.dim,{size:14});
  T(c,'한국사, 움직이며 외우기',480,92,{font:DISP,size:34,align:'center',color:C.text});
  const us=UNITS,n=us.length,per=5;
  us.forEach((u,i)=>{const r=Math.floor(i/per),cc=i%per,x=48+cc*176,y=150+r*170,k=ease(seg(t,.2+i*.18,.8+i*.18));if(k<=0)return;
    const cnt=S.filter(s=>s.u===i).length;
    c.save();c.globalAlpha=k;c.translate(x+80,y+66);c.scale(.9+.1*k,.9+.1*k);c.translate(-80,-66);
    box(c,0,0,160,132,16,'#0E1B2A',u.c+'99',1.8,{glow:6,gc:u.c});box(c,0,0,160,6,3,u.c);
    T(c,u.e,80,48,{size:38,align:'center'});T(c,u.name,80,86,{size:fit(c,u.name,140,17,700),w:700,align:'center'});
    label(c,'장면 '+cnt+'개',80,112,C.dim,{size:12});c.restore();});
  label(c,'아래 막대를 눌러 원하는 장면으로 이동 · ← → 키로 넘기기 · Space 재생/정지',480,516,C.muted,{size:13});
};

/* ── 연표: 사건이 차례로 떠오르는 가로 타임라인 ── */
TPL.timeline=function(c,t,d){
  const ev=d.events,n=ev.length,col=colOf(d);kicker(c,d,col);
  const X0=n>1?120:480,X1=840,Y=d.cy||292,t0=.6,step=Math.max(1,(d.dur-3.2)/n),endT=t0+step*n;
  const newest=t<endT?Math.min(n-1,Math.floor((t-t0)/step)):-1,cyc=t>=endT?Math.floor((t-endT)/1.5)%n:-1,cur=newest>=0?newest:cyc;
  poly(c,[[50,Y],[910,Y]],C.line,4);
  poly(c,[[50,Y],[50+860*(t>=endT?1:clamp((t-t0)/(step*n))),Y]],col,4,{alpha:.9});
  const sp=n>1?(X1-X0)/(n-1):0,cw=Math.min(212,Math.max(132,sp*2-18));
  (d.gaps||[]).forEach((g,i)=>{if(!g)return;const k=seg(t,t0+(i+1)*step,t0+(i+1)*step+.6);if(k<=0)return;pill(c,g,X0+(i+.5)*sp,Y,col,{alpha:k,size:13,fill:'#09131F'});});
  ev.forEach((e,i)=>{const x=X0+i*sp,tt=t0+i*step,k=ease(seg(t,tt,tt+.55));if(k<=0)return;
    const up=i%2===0,on=i===cur,ch=d.cardH||132,yy=(up?Y-62-ch:Y+62)+(1-k)*(up?-14:14);
    c.save();c.globalAlpha=k;
    poly(c,[[x,Y],[x,up?Y-62:Y+62]],on?col:C.line,2);
    box(c,x-cw/2,yy,cw,ch,12,on?col+'22':'#0E1B2A',on?col:C.line,on?2.6:1.5,{glow:on?16:0,gc:col});
    T(c,e.y,x,yy+22,{font:DISP,size:fit(c,e.y,cw-14,21,400,DISP),color:col,align:'center',w:400});
    const nl=WT(c,e.t,x,yy+50,cw-18,19,{size:16,w:700,align:'center'});
    if(e.n)WT(c,e.n,x,yy+50+nl*19+7,cw-20,16,{size:12.5,color:C.muted,align:'center'});
    dot(c,x,Y,on?25:21,on?col:'#10202F',{stroke:col,lw:3,glow:on?22:0});
    T(c,e.e||'•',x,Y+1,{size:on?24:20,align:'center'});
    c.restore();});
  if(d.foot&&t>endT-.5)label(c,d.foot,480,516,C.muted,{size:14,alpha:seg(t,endT-.5,endT+.3)});
};

/* ── 카드: 비교 카드들이 튀어나오고 핵심어가 하나씩 붙는다 ── */

  $('keys').innerHTML=s.keys.map(k=>'<li>'+k+'</li>').join('');
  $('legend').innerHTML=s.regs.filter(r=>r.legend!==false).map(r=>'<span><i style="background:'+r.c+'"></i>'+r.n+'</span>').join('');
  $('links').innerHTML='<a href="chapters/'+CH[s.u].file+'">📖 '+CH[s.u].name+' 파트 노트</a><a href="motion/'+CH[s.u].file+'">🎬 '+CH[s.u].name+' 모션</a>';
  document.querySelectorAll('.tick').forEach((b,j)=>b.setAttribute('aria-current',j===i));
  try{history.replaceState(null,'','#'+s.id)}catch(e){}}
function goTo(i){i=Math.max(0,Math.min(SN.length-1,i));if(reduce){v=i;target=null;}else target=i;hold=0;}
function setPlay(p){playing=p;$('play').textContent=p?'❚❚':'▶';$('play').setAttribute('aria-label',p?'일시정지':'재생');hold=0;}
$('prev').onclick=()=>{setPlay(false);goTo(Math.round(v)-1);};$('next').onclick=()=>{setPlay(false);goTo(Math.round(v)+1);};
$('play').onclick=()=>{if(!playing&&Math.round(v)>=SN.length-1){v=0;target=null;}setPlay(!playing);};
$('slider').addEventListener('input',e=>{setPlay(false);target=null;v=+e.target.value;});
$('slider').addEventListener('change',e=>{goTo(Math.round(+e.target.value));});
$('ticks').addEventListener('click',e=>{const b=e.target.closest('.tick');if(!b)return;setPlay(false);goTo(+b.dataset.i);});
document.addEventListener('keydown',e=>{if(e.target.closest('input[type=range]'))return;
  if(e.key==='ArrowRight'){setPlay(false);goTo(Math.round(v)+1);}else if(e.key==='ArrowLeft'){setPlay(false);goTo(Math.round(v)-1);}
  else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();$('play').click();}});
let drag=null;cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,v};cv.setPointerCapture(e.pointerId);setPlay(false);});
cv.addEventListener('pointermove',e=>{if(!drag)return;target=null;v=Math.max(0,Math.min(SN.length-1,drag.v-(e.clientX-drag.x)/(cv.getBoundingClientRect().width*.5)));});
cv.addEventListener('pointerup',()=>{if(drag){goTo(Math.round(v));drag=null;}});
function frame(now){const dt=last==null?0:Math.min(.05,(now-last)/1000);last=now;
  if(target!=null){const d=target-v;v+=Math.sign(d)*Math.min(Math.abs(d),dt*Math.max(1.4,Math.abs(d)*3));if(Math.abs(target-v)<1e-3){v=target;target=null;}}
  else if(playing){hold+=dt;if(hold>3.2){if(Math.round(v)>=SN.length-1)setPlay(false);else goTo(Math.round(v)+1);}}
  $('slider').value=v;
  const a=Math.floor(v+1e-6),k=v-a,A=SN[a],B=SN[Math.min(SN.length-1,a+1)],kk=ease(k);
  ctx.setTransform(cv.width/MW,0,0,cv.height/MH,0,0);ctx.clearRect(0,0,MW,MH);
  drawTerritory(ctx,TERR[A.id],k>0?TERR[B.id]:null,k>0?kk:0,{x:0,y:0,w:MW,h:MH});
  const cur=SN[Math.round(v)];TS(ctx,cur.y,22,40,{size:30,font:DISP,w:400,align:'left',color:CH[cur.u].c,lw:6});TS(ctx,cur.t,22,74,{size:16,align:'left',lw:5});
  panel(Math.round(v));requestAnimationFrame(frame);}
const h0=SN.findIndex(s=>'#'+s.id===location.hash);if(h0>=0)v=h0;panel(Math.round(v));
requestAnimationFrame(frame);
</script>
</body>
