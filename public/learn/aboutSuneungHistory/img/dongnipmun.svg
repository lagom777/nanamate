<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>독립문 (1897 · 독립 협회 · 영은문을 헐고 그 자리에)</title>
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2ddd2"/>
      <stop offset=".55" stop-color="#c3bcad"/>
      <stop offset="1" stop-color="#8c8576"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeeae1"/>
      <stop offset="1" stop-color="#a59e8f"/>
    </linearGradient>
    <pattern id="blocks" width="16" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.6h16M5 0v7.6M13 0v0" stroke="#7a7466" stroke-width=".6"/>
    </pattern>
    <pattern id="blocks2" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 7.6h16M0 15.6h16M5 0v7.6M13 8v7.6" stroke="#7a7466" stroke-width=".6"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <g id="tg"><circle r="5" fill="#fff" stroke="#3b3a36" stroke-width=".6"/><path d="M-5 0a2.5 2.5 0 0 1 5 0a2.5 2.5 0 0 0 5 0a5 5 0 0 0-10 0z" fill="#c8102e"/><path d="M-5 0a2.5 2.5 0 0 0 5 0a2.5 2.5 0 0 1 5 0a5 5 0 0 1-10 0z" fill="#0047a0"/></g>
  </defs>
  <ellipse cx="100" cy="188" rx="72" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 문 몸 -->
  <path d="M44 70H156V184H44Z" fill="url(#stone)" stroke="#6b6555" stroke-width="1"/>
  <path d="M44 84H156V184H44Z" fill="url(#blocks2)"/>
  <!-- 홍예 -->
  <path d="M78 184V128A22 22 0 0 1 122 128V184Z" fill="#2b2b2b" stroke="#6b6555" stroke-width="1"/>
  <path d="M74 184V128A26 26 0 0 1 126 128V184" fill="none" stroke="#a49d8e" stroke-width="3"/>
  <path d="M96 102h8v8h-8z" fill="url(#cap)" stroke="#6b6555" stroke-width=".7"/>
  <!-- 기둥 장식 -->
  <path d="M48 96h10v84H48ZM142 96h10v84h-10Z" fill="url(#stone)" stroke="#6b6555" stroke-width=".7" opacity=".8"/>
  <!-- 처마 띠와 난간 -->
  <path d="M38 62H162V70H38Z" fill="url(#cap)" stroke="#6b6555" stroke-width=".9"/>
  <path d="M40 54H160V62H40Z" fill="url(#stone)" stroke="#6b6555" stroke-width=".8"/>
  <g fill="#8c8576"><rect x="46" y="56" width="5" height="4"/><rect x="58" y="56" width="5" height="4"/><rect x="70" y="56" width="5" height="4"/><rect x="125" y="56" width="5" height="4"/><rect x="137" y="56" width="5" height="4"/><rect x="149" y="56" width="5" height="4"/></g>
  <path d="M36 50H164V54H36Z" fill="url(#cap)" stroke="#6b6555" stroke-width=".8"/>
  <!-- 현판: 독립문과 양쪽 태극 -->
  <rect x="74" y="72" width="52" height="16" fill="#e9e5db" stroke="#6b6555" stroke-width=".9"/>
  <text x="100" y="84.5" fill="#2b2a26" font-size="11.5" font-weight="800" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">독립문</text>
  <use href="#tg" x="64" y="80"/><use href="#tg" x="136" y="80"/>
  <path d="M44 70V184" stroke="#f3efe7" stroke-width="1" opacity=".55"/>
</svg>
