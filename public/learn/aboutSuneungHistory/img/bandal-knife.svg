<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>반달 돌칼 (청동기, 곡식 이삭 따기)</title>
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa8a0"/>
      <stop offset=".55" stop-color="#6f7d76"/>
      <stop offset="1" stop-color="#46524c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd8d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e5ece8" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="grain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf72"/>
      <stop offset="1" stop-color="#b8892e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <!-- 조 이삭 -->
  <g>
    <path d="M44 176C40 140 36 108 26 70" fill="none" stroke="#a37d33" stroke-width="2"/>
    <path d="M56 178C54 146 54 112 50 78" fill="none" stroke="#a37d33" stroke-width="2"/>
    <path d="M30 70c-6 2-8 12-6 22 2 10 8 14 10 8 2-8-1-26-4-30z" fill="url(#grain)"/>
    <path d="M50 76c-6 4-6 14-3 22 3 8 9 10 10 4 1-8-2-22-7-26z" fill="url(#grain)"/>
    <g fill="#8f6a24" opacity=".6"><circle cx="28" cy="82" r="1"/><circle cx="30" cy="90" r="1"/><circle cx="50" cy="86" r="1"/><circle cx="52" cy="94" r="1"/></g>
    <path d="M40 130c-8-4-14-2-18 4 8 2 14 2 18-4zM55 124c8-4 14-2 18 4-8 2-14 2-18-4z" fill="#7a9a4a"/>
  </g>
  <ellipse cx="116" cy="158" rx="64" ry="8" fill="#000" opacity=".4" filter="url(#soft)"/>
  <!-- 돌칼 몸체: 둥근 등, 곧은 날 -->
  <path d="M52 140C56 98 86 70 118 70C150 70 176 98 182 140Z" fill="url(#slate)" stroke="#33403a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M54 140H180L176 130H58Z" fill="url(#edge)"/>
  <path d="M58 131H177" stroke="#dfe7e2" stroke-width=".9" opacity=".7"/>
  <path d="M64 120C70 98 92 80 118 79" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
  <!-- 끈 구멍 두 개와 손가락 끈 -->
  <circle cx="104" cy="104" r="5.2" fill="#1c2420" stroke="#2a332e"/>
  <circle cx="132" cy="104" r="5.2" fill="#1c2420" stroke="#2a332e"/>
  <path d="M104 104C100 80 106 52 118 50C130 52 136 80 132 104" fill="none" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 104C100 80 106 52 118 50C130 52 136 80 132 104" fill="none" stroke="#c48b4e" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/>
  <g fill="#2f3a35" opacity=".35"><circle cx="80" cy="118" r="1"/><circle cx="150" cy="96" r=".9"/><circle cx="160" cy="122" r="1"/><circle cx="94" cy="92" r=".8"/><circle cx="140" cy="126" r=".9"/></g>
</svg>
