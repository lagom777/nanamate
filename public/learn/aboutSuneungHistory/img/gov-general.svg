<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>조선 총독부 청사 (1926 · 경복궁 앞을 가로막고 세움 · 1995 철거)</title>
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b8b2"/>
      <stop offset="1" stop-color="#7c7b75"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a9a96"/>
      <stop offset=".4" stop-color="#5f6f6b"/>
      <stop offset="1" stop-color="#34403d"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f5a" stop-opacity=".0"/>
      <stop offset="1" stop-color="#4a4f5a" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d636b"/>
      <stop offset="1" stop-color="#33373d"/>
    </linearGradient>
    <pattern id="win" width="10" height="14" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="4" height="8" fill="#2b2f36"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <ellipse cx="100" cy="176" rx="96" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 큰 석조 건물 -->
  <path d="M6 96H194V172H6Z" fill="url(#stone)" stroke="#55544f" stroke-width="1"/>
  <rect x="6" y="100" width="188" height="70" fill="url(#win)" opacity=".9"/>
  <path d="M6 96H194V90H6Z" fill="#9c9b95" stroke="#55544f" stroke-width=".8"/>
  <path d="M6 128H194M6 150H194" stroke="#55544f" stroke-width=".7" opacity=".7"/>
  <!-- 가운데 탑과 돔 -->
  <path d="M64 70H136V172H64Z" fill="url(#stone)" stroke="#55544f" stroke-width="1"/>
  <g fill="#9c9b95" stroke="#55544f" stroke-width=".6"><path d="M70 100h6v72h-6zM84 100h6v72h-6zM110 100h6v72h-6zM124 100h6v72h-6z"/></g>
  <path d="M60 64H140V70H60Z" fill="#9c9b95" stroke="#55544f" stroke-width=".8"/>
  <path d="M74 64V48H126V64Z" fill="url(#stone)" stroke="#55544f" stroke-width=".9"/>
  <g fill="#2b2f36"><rect x="80" y="52" width="6" height="9"/><rect x="97" y="52" width="6" height="9"/><rect x="114" y="52" width="6" height="9"/></g>
  <path d="M76 48C76 30 88 20 100 20C112 20 124 30 124 48Z" fill="url(#dome)" stroke="#2a3330" stroke-width="1"/>
  <path d="M86 46C86 32 92 25 100 24" fill="none" stroke="#c1d0cb" stroke-width="1.2" opacity=".6"/>
  <path d="M96 20V12H104V20Z" fill="url(#dome)" stroke="#2a3330"/><path d="M100 12V4" stroke="#2a3330" stroke-width="1.4"/>
  <path d="M90 172V146A10 10 0 0 1 110 146V172Z" fill="#1f2228"/>
  <!-- 앞에 가려진 경복궁 지붕 -->
  <path d="M30 186C46 180 70 178 100 178C130 178 154 180 170 186L160 172H40Z" fill="url(#roof)" stroke="#23262b" stroke-width=".8"/>
  <path d="M30 186l-4-4M170 186l4-4" stroke="#23262b" stroke-width="2" stroke-linecap="round"/>
  <rect x="0" y="0" width="200" height="200" fill="url(#sky)"/>
</svg>
