<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>앙부일구 (조선 세종 · 솥 모양 해시계 · 시각을 동물 그림으로도 표시)</title>
  <defs>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a457"/>
      <stop offset=".35" stop-color="#e9cd86"/>
      <stop offset=".7" stop-color="#9c7a32"/>
      <stop offset="1" stop-color="#5b4314"/>
    </linearGradient>
    <radialGradient id="bowl" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#f3e3b6"/>
      <stop offset=".7" stop-color="#c39a4e"/>
      <stop offset="1" stop-color="#7d5c1e"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6d0c2"/>
      <stop offset="1" stop-color="#8f897b"/>
    </linearGradient>
    <clipPath id="in"><ellipse cx="100" cy="78" rx="54" ry="19"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <ellipse cx="100" cy="186" rx="76" ry="7" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 십자 모양 받침돌과 물홈 -->
  <path d="M30 166L100 150L170 166L100 182Z" fill="url(#stone)" stroke="#6b6555" stroke-width=".9"/>
  <path d="M30 166V172L100 188L170 172V166L100 182Z" fill="#8a8476" stroke="#6b6555" stroke-width=".8"/>
  <path d="M46 166L100 154L154 166L100 178Z" fill="none" stroke="#5f8fae" stroke-width="2.2" opacity=".85"/>
  <!-- 네 발 -->
  <g fill="url(#cu)" stroke="#4a3610" stroke-width=".8">
    <path d="M62 112L54 162H62L72 116Z"/><path d="M138 112L146 162H138L128 116Z"/>
    <path d="M86 120L84 168H92L94 122Z"/><path d="M114 120L116 168H108L106 122Z"/>
    <path d="M50 160h16v5H50zM134 160h16v5h-16zM80 166h16v5H80zM104 166h16v5h-16z"/>
  </g>
  <!-- 솥 모양 몸통(바깥) -->
  <path d="M44 78C46 104 70 124 100 124C130 124 154 104 156 78Z" fill="url(#cu)" stroke="#4a3610" stroke-width="1"/>
  <path d="M52 96C64 110 82 116 100 116C118 116 136 110 148 96" fill="none" stroke="#4a3610" stroke-width=".8" opacity=".7"/>
  <!-- 안쪽: 시각선(세로)과 절기선(가로) -->
  <ellipse cx="100" cy="78" rx="56" ry="20" fill="url(#cu)" stroke="#4a3610" stroke-width="1"/>
  <ellipse cx="100" cy="78" rx="54" ry="19" fill="url(#bowl)"/>
  <g clip-path="url(#in)" fill="none" stroke="#5b4314" stroke-width=".7" opacity=".85">
    <path d="M52 78Q100 100 148 78M56 74Q100 94 144 74M62 70Q100 88 138 70M70 66Q100 82 130 66"/>
    <path d="M100 59V97M86 60Q84 80 88 96M114 60Q116 80 112 96M72 63Q68 80 76 94M128 63Q132 80 124 94M60 68Q56 80 64 90M140 68Q144 80 136 90"/>
  </g>
  <!-- 영침(그림자 바늘) -->
  <path d="M100 60L122 88" stroke="#3a2a0c" stroke-width="2" stroke-linecap="round"/>
  <path d="M122 88L118 92" stroke="#3a2a0c" stroke-width="1.4"/>
  <path d="M100 79L84 92" stroke="#000" stroke-opacity=".3" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 테두리의 시각 표시(동물 그림 자리) -->
  <g fill="#3a2a0c">
    <circle cx="56" cy="72" r="1.6"/><circle cx="66" cy="65" r="1.6"/><circle cx="80" cy="61" r="1.6"/><circle cx="100" cy="59.4" r="1.6"/><circle cx="120" cy="61" r="1.6"/><circle cx="134" cy="65" r="1.6"/><circle cx="144" cy="72" r="1.6"/>
  </g>
  <path d="M48 76C52 66 76 60 100 60" fill="none" stroke="#fff6d8" stroke-width="1" opacity=".55"/>
</svg>
