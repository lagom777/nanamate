  <rect x="90" y="78" width="20" height="9" fill="#1f2a44" stroke="#d4af37" stroke-width=".9"/>
  <path d="M93 82.5h4M99 80v5M102 82.5h4" stroke="#e8c868" stroke-width=".8"/>
</svg>
