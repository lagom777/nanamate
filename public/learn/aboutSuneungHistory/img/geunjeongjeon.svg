  <rect x="50" y="76" width="100" height="14" fill="url(#lattice)"/>
  <g fill="url(#col)"><path d="M52 76h4v14h-4zM74 76h4v14h-4zM98 76h4v14h-4zM122 76h4v14h-4zM144 76h4v14h-4z"/></g>
  <rect x="46" y="70" width="108" height="6" fill="url(#green)" stroke="#1f3f36" stroke-width=".6"/>
  <g fill="url(#green)" stroke="#1f3f36" stroke-width=".5"><path d="M50 66h8v4h-8zM62 66h8v4h-8zM74 66h8v4h-8zM86 66h8v4h-8zM98 66h8v4h-8zM110 66h8v4h-8zM122 66h8v4h-8zM134 66h8v4h-8zM146 66h8v4h-8z"/></g>
  <!-- 위 지붕 -->
  <path d="M22 62C44 68 70 68 100 68C130 68 156 68 178 62L172 68C150 72 126 72 100 72C74 72 50 72 28 68Z" fill="url(#green)" stroke="#1f3f36" stroke-width=".7"/>
  <path d="M22 62C44 66 70 66 100 66C130 66 156 66 178 62L150 40H50Z" fill="url(#roof)" stroke="#23262b" stroke-width=".9"/>
  <path d="M50 40L66 26H134L150 40Z" fill="url(#roof)" stroke="#23262b" stroke-width=".9"/>
  <g stroke="#23262b" stroke-width=".5" opacity=".7"><path d="M42 62l12-20M60 64l8-22M80 65l4-23M100 66V42M120 65l-4-23M140 64l-8-22M158 62l-12-20"/></g>
  <path d="M62 26H138V22H62Z" fill="#2e3238"/>
  <path d="M62 22c-3-4-3-9 2-11c0 4 1 8 3 11ZM138 22c3-4 3-9-2-11c0 4-1 8-3 11Z" fill="#2e3238"/>
  <path d="M10 106l-4-5M190 106l4-5M22 62l-4-5M178 62l4-5" stroke="#23262b" stroke-width="2" stroke-linecap="round"/>
