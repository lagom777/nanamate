<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>경복궁 근정전 (조선 · 법궁의 정전 · 2층 월대와 중층 지붕)</title>
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d636b"/>
      <stop offset="1" stop-color="#33373d"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3523e"/>
      <stop offset="1" stop-color="#74291c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8c7a"/>
      <stop offset="1" stop-color="#2d5c4f"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd6c6"/>
      <stop offset="1" stop-color="#9b9380"/>
    </linearGradient>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5d52"/>
      <stop offset="1" stop-color="#22362f"/>
    </linearGradient>
    <pattern id="lattice" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#c99a5b"/><path d="M0 2h4M2 0v4" stroke="#7a4e22" stroke-width=".6"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
  <radialGradient id="vg" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="fade"><rect width="200" height="200" fill="url(#vg)"/></mask>
  </defs>
  <g mask="url(#fade)">
  <!-- 뒤의 북악산 -->
  <path d="M0 96C30 70 50 52 74 40C90 32 104 30 120 40C140 52 166 70 200 92V120H0Z" fill="url(#mt)" opacity=".85"/>
  </g>
  <ellipse cx="100" cy="190" rx="92" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 2단 월대와 돌난간, 가운데 계단 -->
  <path d="M8 178H192L196 190H4Z" fill="url(#stone)" stroke="#6b6555" stroke-width=".8"/>
  <path d="M16 166H184V178H16Z" fill="url(#stone)" stroke="#6b6555" stroke-width=".8"/>
  <path d="M28 154H172V166H28Z" fill="url(#stone)" stroke="#6b6555" stroke-width=".8"/>
  <g stroke="#e9e3d6" stroke-width="1.2"><path d="M16 162H184M28 150H172"/></g>
  <g stroke="#8f8773" stroke-width="1"><path d="M20 158v8M36 158v8M52 158v8M68 158v8M132 158v8M148 158v8M164 158v8M180 158v8M32 146v8M48 146v8M64 146v8M136 146v8M152 146v8M168 146v8"/></g>
  <path d="M86 154H114L120 190H80Z" fill="#c4bba6" stroke="#6b6555" stroke-width=".7"/>
  <path d="M85 160H115M84 166H116M83 172H117M82 178H118M81 184H119" stroke="#6b6555" stroke-width=".6"/>
  <path d="M96 154h8v36h-8z" fill="#b3aa94"/>
