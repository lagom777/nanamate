  <rect x="38" y="120" width="124" height="34" fill="url(#lattice)"/>
  <g fill="url(#col)" stroke="#4a1f15" stroke-width=".6"><path d="M40 120h5v34h-5zM60 120h5v34h-5zM80 120h5v34h-5zM115 120h5v34h-5zM135 120h5v34h-5zM155 120h5v34h-5z"/></g>
  <rect x="34" y="112" width="132" height="8" fill="url(#green)" stroke="#1f3f36" stroke-width=".6"/>
  <g fill="#d64b3a"><circle cx="42" cy="116" r="1.1"/><circle cx="62" cy="116" r="1.1"/><circle cx="82" cy="116" r="1.1"/><circle cx="117" cy="116" r="1.1"/><circle cx="137" cy="116" r="1.1"/><circle cx="157" cy="116" r="1.1"/></g>
  <!-- 아래 지붕 -->
  <path d="M10 106C34 112 64 112 100 112C136 112 166 112 190 106L184 112C158 116 130 116 100 116C70 116 42 116 16 112Z" fill="url(#green)" stroke="#1f3f36" stroke-width=".7"/>
  <path d="M10 106C34 110 64 110 100 110C136 110 166 110 190 106L166 90H34Z" fill="url(#roof)" stroke="#23262b" stroke-width=".9"/>
  <g stroke="#23262b" stroke-width=".5" opacity=".7"><path d="M30 106l10-14M48 108l7-16M66 109l5-17M84 110l2-18M100 110V92M116 110l-2-18M134 109l-5-17M152 108l-7-16M170 106l-10-14"/></g>
