<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>경인선 기관차 (1899 · 노량진~제물포 · 최초의 철도)</title>
  <defs>
    <linearGradient id="boiler" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6a62"/>
      <stop offset=".35" stop-color="#2f3a35"/>
      <stop offset="1" stop-color="#161c19"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4741"/>
      <stop offset="1" stop-color="#1c2420"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0d488"/>
      <stop offset="1" stop-color="#9c7a2e"/>
    </linearGradient>
    <radialGradient id="smoke" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d9dee2" stop-opacity=".95"/><stop offset="1" stop-color="#d9dee2" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <g id="wheel"><circle r="13" fill="#2a2a2a" stroke="#0e0e0e" stroke-width="1.2"/><circle r="10" fill="none" stroke="#c43b2c" stroke-width="1.6"/><path d="M-10 0H10M0-10V10M-7-7L7 7M7-7L-7 7" stroke="#c43b2c" stroke-width="1.2"/><circle r="2.4" fill="#d9b25a"/></g>
  </defs>
  <!-- 연기 -->
  <circle cx="48" cy="40" r="14" fill="url(#smoke)"/><circle cx="66" cy="26" r="16" fill="url(#smoke)"/><circle cx="90" cy="18" r="13" fill="url(#smoke)"/><circle cx="112" cy="16" r="10" fill="url(#smoke)"/>
  <!-- 철로 -->
  <path d="M0 168H200" stroke="#7a6a52" stroke-width="3"/>
  <g stroke="#5a4a34" stroke-width="5"><path d="M10 172v4M34 172v4M58 172v4M82 172v4M106 172v4M130 172v4M154 172v4M178 172v4"/></g>
  <path d="M0 172H200" stroke="#9c8c72" stroke-width="2"/>
  <ellipse cx="104" cy="168" rx="88" ry="5" fill="#000" opacity=".35" filter="url(#soft)"/>
  <!-- 운전실 -->
  <path d="M132 70H178V146H132Z" fill="url(#cab)" stroke="#0e1210" stroke-width="1"/>
  <path d="M126 66H184V72H126Z" fill="#1c2420" stroke="#0e1210"/>
  <rect x="142" y="80" width="26" height="22" rx="2" fill="#cfe0e8" stroke="#0e1210"/>
  <path d="M155 80v22" stroke="#0e1210" stroke-width="1"/>
  <!-- 보일러 -->
  <path d="M40 92H132V138H40Z" fill="url(#boiler)" stroke="#0e1210" stroke-width="1"/>
  <ellipse cx="40" cy="115" rx="6" ry="23" fill="#2f3a35" stroke="#0e1210"/>
  <path d="M60 92v46M86 92v46M112 92v46" stroke="url(#brass)" stroke-width="2"/>
  <!-- 굴뚝과 증기 돔 -->
  <path d="M52 92V62H46L50 52H70L74 62H68V92Z" fill="url(#boiler)" stroke="#0e1210" stroke-width="1"/>
  <path d="M90 92C90 80 96 76 102 76C108 76 114 80 114 92Z" fill="url(#brass)" stroke="#5a4414" stroke-width=".9"/>
  <!-- 앞 등불 -->
  <rect x="28" y="96" width="10" height="10" rx="2" fill="url(#brass)" stroke="#5a4414"/>
  <circle cx="33" cy="101" r="3" fill="#fff6c2"/>
  <!-- 바퀴 아래 차대와 배장기 -->
  <path d="M30 138H184V148H30Z" fill="#1c2420" stroke="#0e1210"/>
  <path d="M18 160L30 138H40L36 160Z" fill="#c43b2c" stroke="#5a1a12"/>
  <use href="#wheel" x="60" y="154"/><use href="#wheel" x="96" y="154"/><use href="#wheel" x="132" y="154"/>
  <path d="M60 154H132" stroke="#9aa3a8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="166" cy="158" r="9" fill="#2a2a2a" stroke="#0e0e0e"/><circle cx="166" cy="158" r="2" fill="#d9b25a"/>
  <path d="M40 94H132" stroke="#8fa39a" stroke-width="1" opacity=".6"/>
</svg>
