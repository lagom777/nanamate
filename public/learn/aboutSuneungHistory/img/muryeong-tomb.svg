<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>무령왕릉 (백제 · 중국 남조의 벽돌무덤 양식)</title>
  <defs>
    <radialGradient id="deep" cx=".5" cy=".62" r=".6">
      <stop offset="0" stop-color="#3a2116"/>
      <stop offset=".55" stop-color="#7a4a31"/>
      <stop offset="1" stop-color="#b57a52"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a573a"/>
      <stop offset="1" stop-color="#5c3624"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d2d1e"/>
      <stop offset="1" stop-color="#9a6646"/>
    </linearGradient>
    <radialGradient id="flame" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c0"/>
      <stop offset=".5" stop-color="#ffb84d" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tunnel"><path d="M28 188V108A72 72 0 0 1 172 108V188Z"/></clipPath>
  </defs>
  <!-- 바깥 아치(입구) 안쪽 전체 -->
  <path d="M28 188V108A72 72 0 0 1 172 108V188Z" fill="url(#deep)"/>
  <g clip-path="url(#tunnel)">
    <!-- 벽돌 고리: 입구에서 안쪽으로 줄어드는 아치 -->
    <g fill="none" stroke="#3b2015" stroke-width="1" opacity=".7">
      <path d="M36 188V110A64 64 0 0 1 164 110V188"/>
      <path d="M44 188V112A56 56 0 0 1 156 112V188"/>
      <path d="M52 188V114A48 48 0 0 1 148 114V188"/>
      <path d="M59 188V116A41 41 0 0 1 141 116V188"/>
      <path d="M65 188V118A35 35 0 0 1 135 118V188"/>
      <path d="M70 188V119A30 30 0 0 1 130 119V188"/>
    </g>
    <!-- 벽돌 이음매(방사선) -->
    <g stroke="#3b2015" stroke-width=".8" opacity=".55">
      <path d="M100 38V50M64 48l5 9M136 48l-5 9M40 74l9 5M160 74l-9 5M30 108h10M170 108h-10"/>
      <path d="M82 50l3 8M118 50l-3 8M50 60l7 7M150 60l-7 7M34 90l9 3M166 90l-9 3"/>
      <path d="M100 52v8M76 58l4 7M124 58l-4 7M56 76l7 4M144 76l-7 4M48 100h9M152 100h-9"/>
      <path d="M90 62l2 7M110 62l-2 7M66 70l6 5M134 70l-6 5M54 90l8 2M146 90l-8 2"/>
    </g>
    <!-- 바닥 -->
    <polygon points="28,188 72,160 128,160 172,188" fill="url(#floor)"/>
    <g stroke="#2e1a10" stroke-width=".8" opacity=".6">
      <path d="M60 168h80M48 176h104M38 184h124M86 160l-6 28M114 160l6 28M100 160v28"/>
    </g>
    <!-- 안쪽 벽 -->
    <path d="M72 160V122A28 28 0 0 1 128 122V160Z" fill="url(#back)" stroke="#3b2015"/>
    <g stroke="#2e1a10" stroke-width=".7" opacity=".7">
      <path d="M72 130h56M72 138h56M72 146h56M72 154h56M80 122v8M96 116v14M112 116v14M88 130v8M104 130v8M120 130v8M80 138v8M96 138v8M112 138v8M88 146v8M104 146v8M120 146v8"/>
    </g>
    <!-- 연꽃무늬 벽돌 -->
    <g fill="#d9a06c" opacity=".8">
      <circle cx="88" cy="142" r="3"/><circle cx="112" cy="142" r="3"/><circle cx="100" cy="126" r="3"/>
    </g>
    <g fill="#7a4a31"><circle cx="88" cy="142" r="1.1"/><circle cx="112" cy="142" r="1.1"/><circle cx="100" cy="126" r="1.1"/></g>
    <!-- 등잔을 두던 감실과 불빛 -->
    <path d="M44 132v-10a6 6 0 0 1 12 0v10z" fill="#2a160d" stroke="#3b2015"/>
    <path d="M144 132v-10a6 6 0 0 1 12 0v10z" fill="#2a160d" stroke="#3b2015"/>
    <circle cx="50" cy="126" r="9" fill="url(#flame)"/>
    <circle cx="150" cy="126" r="9" fill="url(#flame)"/>
    <path d="M50 122c2 2 2 5 0 7c-2-2-2-5 0-7z" fill="#fff6d1"/>
    <path d="M150 122c2 2 2 5 0 7c-2-2-2-5 0-7z" fill="#fff6d1"/>
  </g>
  <!-- 입구 테두리 -->
  <path d="M28 188V108A72 72 0 0 1 172 108V188" fill="none" stroke="#c48a5e" stroke-width="4"/>
  <path d="M28 188V108A72 72 0 0 1 172 108V188" fill="none" stroke="#5c3624" stroke-width="1"/>
</svg>
