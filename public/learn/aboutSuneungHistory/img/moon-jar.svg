<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>백자 달항아리 (조선 후기 · 넉넉하고 수수한 흰 항아리)</title>
  <defs>
    <radialGradient id="body" cx=".36" cy=".34" r=".78">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset=".5" stop-color="#f1ebdf"/>
      <stop offset=".82" stop-color="#d6ccb8"/>
      <stop offset="1" stop-color="#a99f8b"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#cdc3ae"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="1.4"/></filter>
    <clipPath id="b"><path d="M80 44C56 50 36 72 36 102C36 132 56 156 80 164C88 167 112 167 120 164C146 156 165 132 164 102C163 72 144 50 120 44Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="176" rx="50" ry="6" fill="#000" opacity=".5" filter="url(#soft)"/>
  <!-- 굽 -->
  <path d="M78 162H122L120 172H80Z" fill="url(#rim)" stroke="#9c927d" stroke-width=".9"/>
  <!-- 몸통: 위아래 반구를 이어 붙인, 살짝 일그러진 둥근 몸 -->
  <path d="M80 44C56 50 36 72 36 102C36 132 56 156 80 164C88 167 112 167 120 164C146 156 165 132 164 102C163 72 144 50 120 44Z" fill="url(#body)" stroke="#a89e8a" stroke-width="1"/>
  <g clip-path="url(#b)">
    <!-- 이어 붙인 자리(가운데 띠) -->
    <path d="M34 104C70 110 130 108 166 100" fill="none" stroke="#c9bfa9" stroke-width="1.2" opacity=".7"/>
    <path d="M34 106C70 112 130 110 166 102" fill="none" stroke="#fff" stroke-width=".8" opacity=".6"/>
    <!-- 은은한 얼룩과 빛 -->
    <ellipse cx="72" cy="78" rx="18" ry="24" fill="#fff" opacity=".55" filter="url(#blur)"/>
    <ellipse cx="128" cy="140" rx="22" ry="10" fill="#c9b99a" opacity=".35" filter="url(#blur)"/>
    <ellipse cx="146" cy="96" rx="8" ry="20" fill="#bfb6a3" opacity=".35" filter="url(#blur)"/>
    <circle cx="112" cy="124" r="3" fill="#d7c7a6" opacity=".6" filter="url(#blur)"/>
  </g>
  <!-- 아가리 -->
  <path d="M80 44V36H120V44Z" fill="url(#rim)" stroke="#a89e8a" stroke-width=".9"/>
  <ellipse cx="100" cy="36" rx="20" ry="4" fill="#efe9dc" stroke="#a89e8a" stroke-width=".9"/>
  <ellipse cx="100" cy="36" rx="15" ry="2.6" fill="#8f8573"/>
</svg>
