    <path d="M80 62V74M90 62V74M100 62V74M110 62V74M120 62V74" stroke-width=".8" opacity=".7"/>
    <path d="M70 62C72 56 76 54 80 58C82 52 88 52 90 58C92 52 98 52 100 58C102 52 108 52 110 58C112 52 118 52 120 58C124 54 128 56 130 62Z" fill="url(#slab)"/>
