    <clipPath id="lid"><path d="M62 102C62 76 80 50 100 46C120 50 138 76 138 102Z"/></clipPath>
    <clipPath id="bowl"><path d="M60 106C62 128 80 142 100 144C120 142 138 128 140 106Z"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
