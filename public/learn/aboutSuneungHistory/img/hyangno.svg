    <path d="M98 32C90 30 82 22 78 12C86 16 92 20 97 27Z"/>
    <path d="M102 32C110 30 118 22 122 12C114 16 108 20 103 27Z"/>
    <path d="M100 26C99 20 101 16 104 14C106 18 104 22 101 26Z"/>
