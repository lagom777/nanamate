<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>백제 금동 대향로 (부여 능산리 · 봉황·산·연꽃·용)</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6df98"/>
      <stop offset=".35" stop-color="#d9ad4f"/>
      <stop offset=".75" stop-color="#9c7428"/>
      <stop offset="1" stop-color="#5f4513"/>
