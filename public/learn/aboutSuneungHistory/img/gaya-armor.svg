<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>가야 판갑옷과 덩이쇠 (철의 나라 가야 · 철을 화폐처럼)</title>
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d949b"/>
      <stop offset=".45" stop-color="#5d646c"/>
      <stop offset="1" stop-color="#2e3338"/>
    </linearGradient>
    <linearGradient id="ingot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6a5c"/>
      <stop offset="1" stop-color="#3b2f27"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="rust"><feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .28  0 0 0 0 .14  0 0 0 2.4 -1.45"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <clipPath id="torso"><path d="M58 52C66 44 80 40 90 46L100 50L110 46C120 40 134 44 142 52L146 86C142 104 138 118 138 132L144 156H56L62 132C62 118 58 104 54 86Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="186" rx="80" ry="7" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 판갑옷 몸통 -->
  <path d="M58 52C66 44 80 40 90 46L100 50L110 46C120 40 134 44 142 52L146 86C142 104 138 118 138 132L144 156H56L62 132C62 118 58 104 54 86Z" fill="url(#iron)" stroke="#1d2125" stroke-width="1.3" stroke-linejoin="round"/>
  <g clip-path="url(#torso)">
    <!-- 가로 철판 띠 -->
    <g fill="none" stroke="#1d2125" stroke-width="1.1">
      <path d="M50 70Q100 78 150 70M50 88Q100 96 150 88M50 106Q100 114 150 106M50 124Q100 132 150 124M50 142Q100 150 150 142"/>
      <path d="M100 50V156" stroke-width="1.4"/>
    </g>
    <g fill="none" stroke="#c9d0d6" stroke-width=".8" opacity=".45">
      <path d="M50 72Q100 80 150 72M50 90Q100 98 150 90M50 108Q100 116 150 108M50 126Q100 134 150 126"/>
    </g>
    <!-- 못(리벳) -->
    <g fill="#c4ccd2" stroke="#1d2125" stroke-width=".5">
      <circle cx="66" cy="74" r="1.6"/><circle cx="82" cy="77" r="1.6"/><circle cx="118" cy="77" r="1.6"/><circle cx="134" cy="74" r="1.6"/>
      <circle cx="66" cy="92" r="1.6"/><circle cx="82" cy="95" r="1.6"/><circle cx="118" cy="95" r="1.6"/><circle cx="134" cy="92" r="1.6"/>
      <circle cx="68" cy="110" r="1.6"/><circle cx="84" cy="113" r="1.6"/><circle cx="116" cy="113" r="1.6"/><circle cx="132" cy="110" r="1.6"/>
      <circle cx="70" cy="128" r="1.6"/><circle cx="86" cy="131" r="1.6"/><circle cx="114" cy="131" r="1.6"/><circle cx="130" cy="128" r="1.6"/>
      <circle cx="97" cy="62" r="1.4"/><circle cx="103" cy="62" r="1.4"/><circle cx="97" cy="140" r="1.4"/><circle cx="103" cy="140" r="1.4"/>
    </g>
    <rect x="40" y="40" width="120" height="120" fill="#000" filter="url(#rust)" opacity=".75"/>
  </g>
  <!-- 목가리개 -->
  <path d="M78 44C86 34 114 34 122 44L114 52C106 46 94 46 86 52Z" fill="url(#iron)" stroke="#1d2125" stroke-width="1"/>
  <path d="M62 54C70 50 80 50 86 54" stroke="#d3d9de" stroke-width="1" opacity=".5" fill="none"/>
  <!-- 덩이쇠 묶음: 양 끝이 넓게 벌어진 납작한 쇳덩이 -->
  <g stroke="#221a15" stroke-width="1" stroke-linejoin="round">
    <path d="M100 178L110 170H160L170 178L160 186H110Z" fill="url(#ingot)"/>
    <path d="M104 166L114 158H164L174 166L164 174H114Z" fill="url(#ingot)"/>
    <path d="M98 154L108 146H158L168 154L158 162H108Z" fill="url(#ingot)"/>
  </g>
  <g fill="#000" filter="url(#rust)" opacity=".7"><path d="M96 144h80v44H96z"/></g>
  <path d="M110 170H160M114 158H164M108 146H158" stroke="#c2ab97" stroke-width=".9" opacity=".6"/>
</svg>
