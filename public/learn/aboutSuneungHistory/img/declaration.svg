<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>기미 독립 선언서와 태극기 (1919 · 3·1 운동 · 민족 대표 33인)</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1e6c9"/>
      <stop offset="1" stop-color="#d3bf92"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c49a5c"/>
      <stop offset="1" stop-color="#6b4a20"/>
    </linearGradient>
    <pattern id="col" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M2 1.6h4M4 1.6v4.6M2.2 3.8h3.6M2.2 6.6l1.3.8M5.8 6.6l-1 .8" fill="none" stroke="#2c2116" stroke-width=".8" stroke-linecap="round"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="aged"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="81"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .34  0 0 0 0 .18  0 0 0 1.5 -.85"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="96" cy="186" rx="84" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 선언서 -->
  <g transform="rotate(-3 80 110)">
    <rect x="18" y="56" width="124" height="124" fill="url(#paper)" stroke="#8a7146" stroke-width="1"/>
    <rect x="18" y="56" width="124" height="124" fill="#000" filter="url(#aged)" opacity=".25"/>
    <g fill="#1f160d" font-size="11" font-weight="900" text-anchor="middle" font-family="'Noto Serif CJK KR','Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif"><text x="128" y="76.0">宣</text><text x="128" y="89.0">言</text><text x="128" y="102.0">書</text></g>
    <rect x="26" y="64" width="90" height="108" fill="url(#col)" opacity=".85"/>
    <g stroke="#6b5532" stroke-width=".5" opacity=".6"><path d="M34 64v108M42 64v108M50 64v108M58 64v108M66 64v108M74 64v108M82 64v108M90 64v108M98 64v108M106 64v108M116 64v108"/></g>
  </g>
  <!-- 휘날리는 태극기 -->
  <path d="M150 20V186" stroke="url(#pole)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="150" cy="18" r="3.4" fill="#e3c27a" stroke="#6b4a20" stroke-width=".7"/>
  <g transform="translate(152 24)">
    <path d="M0 0C14 -4 26 4 40 0C42 14 42 30 40 44C26 48 14 40 0 44Z" fill="#fbfbf8" stroke="#8b8b86" stroke-width=".8"/>
    <path d="M0 0C14 -4 26 4 40 0C42 14 42 30 40 44C26 48 14 40 0 44Z" fill="url(#wave)"/>
    <!-- 태극 -->
    <g transform="translate(20 22) rotate(-34)">
      <circle r="8" fill="#c8102e"/>
      <path d="M-8 0a4 4 0 0 0 8 0a4 4 0 0 1 8 0a8 8 0 0 1-16 0z" fill="#0047a0"/>
    </g>
    <!-- 건곤감리 -->
    <g fill="#1d1d1b">
      <g transform="translate(7 8) rotate(-56)"><rect x="-4" y="-3" width="8" height="1.4"/><rect x="-4" y="-.7" width="8" height="1.4"/><rect x="-4" y="1.6" width="8" height="1.4"/></g>
      <g transform="translate(33 36) rotate(-56)"><rect x="-4" y="-3" width="3.4" height="1.4"/><rect x=".6" y="-3" width="3.4" height="1.4"/><rect x="-4" y="-.7" width="3.4" height="1.4"/><rect x=".6" y="-.7" width="3.4" height="1.4"/><rect x="-4" y="1.6" width="3.4" height="1.4"/><rect x=".6" y="1.6" width="3.4" height="1.4"/></g>
      <g transform="translate(33 8) rotate(56)"><rect x="-4" y="-3" width="3.4" height="1.4"/><rect x=".6" y="-3" width="3.4" height="1.4"/><rect x="-4" y="-.7" width="8" height="1.4"/><rect x="-4" y="1.6" width="3.4" height="1.4"/><rect x=".6" y="1.6" width="3.4" height="1.4"/></g>
      <g transform="translate(7 36) rotate(56)"><rect x="-4" y="-3" width="8" height="1.4"/><rect x="-4" y="-.7" width="3.4" height="1.4"/><rect x=".6" y="-.7" width="3.4" height="1.4"/><rect x="-4" y="1.6" width="8" height="1.4"/></g>
    </g>
