    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <g id="tg"><rect x="-9" y="-6" width="18" height="12" fill="#fbfbf8" stroke="#8b8b86" stroke-width=".5"/><circle r="3.2" fill="#c8102e"/><path d="M-3.2 0a1.6 1.6 0 0 0 3.2 0a1.6 1.6 0 0 1 3.2 0a3.2 3.2 0 0 1-6.4 0z" fill="#0047a0"/><g fill="#1d1d1b"><rect x="-8" y="-5" width="3" height="2.4"/><rect x="5" y="-5" width="3" height="2.4"/><rect x="-8" y="2.6" width="3" height="2.4"/><rect x="5" y="2.6" width="3" height="2.4"/></g></g>
  </defs>
  <ellipse cx="100" cy="188" rx="84" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 줄지은 3층 벽돌집(석고문 양식) -->
  <path d="M24 44H176V184H24Z" fill="url(#brick)" stroke="#3e261c" stroke-width="1"/>
  <path d="M24 44H176V184H24Z" fill="url(#bricks)"/>
