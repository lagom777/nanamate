  <rect x="58" y="144" width="18" height="34" fill="#f2ecdd" stroke="#6b6352" stroke-width=".8"/>
  <g fill="#1f160d" font-size="3.7" font-weight="700" text-anchor="middle" font-family="'Noto Serif CJK KR','Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif"><text x="67" y="150.5">大</text><text x="67" y="154.4">韓</text><text x="67" y="158.3">民</text><text x="67" y="162.2">國</text><text x="67" y="166.1">臨</text><text x="67" y="170.0">時</text><text x="67" y="173.9">政</text><text x="67" y="177.8">府</text></g>
