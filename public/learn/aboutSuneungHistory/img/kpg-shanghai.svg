<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>대한민국 임시 정부 청사 (1919 수립 · 상하이 · 삼권 분립 민주 공화제)</title>
  <defs>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a54"/>
      <stop offset="1" stop-color="#5e3a2c"/>
    </linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d1c0"/>
      <stop offset="1" stop-color="#9d9483"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
