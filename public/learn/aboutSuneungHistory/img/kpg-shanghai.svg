  <g fill="#cfdde6" stroke="#3b2a20" stroke-width="1">
    <rect x="40" y="56" width="22" height="28"/><rect x="89" y="56" width="22" height="28"/><rect x="138" y="56" width="22" height="28"/>
    <rect x="40" y="102" width="22" height="28"/><rect x="138" y="102" width="22" height="28"/>
