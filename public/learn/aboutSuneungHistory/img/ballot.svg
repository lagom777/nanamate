<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>5·10 총선거 (1948 · 우리나라 첫 민주 선거 · 글 모르는 사람을 위한 막대기 기호)</title>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c08a56"/>
      <stop offset=".5" stop-color="#9a6a3c"/>
      <stop offset="1" stop-color="#5c3a1c"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a774"/>
      <stop offset="1" stop-color="#a87444"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ead4"/>
      <stop offset="1" stop-color="#d9c79e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c9a0"/>
      <stop offset="1" stop-color="#c4936a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <!-- 벽보 -->
  <g transform="rotate(-4 60 60)">
    <rect x="18" y="16" width="86" height="78" fill="url(#paper)" stroke="#8a7146" stroke-width="1"/>
    <text x="61" y="40" fill="#a3311f" font-size="15" font-weight="900" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">5·10</text>
    <text x="61" y="56" fill="#1f160d" font-size="11" font-weight="800" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">총선거</text>
    <!-- 후보 기호: 막대기 개수 -->
    <g stroke="#1f160d" stroke-width="2.4" stroke-linecap="round">
      <path d="M30 70v14"/><path d="M48 70v14M54 70v14"/><path d="M70 70v14M76 70v14M82 70v14"/>
    </g>
    <path d="M24 66H98" stroke="#8a7146" stroke-width=".6"/>
  </g>
  <ellipse cx="116" cy="188" rx="70" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 투표함 -->
  <path d="M70 108L86 96H170L154 108Z" fill="url(#woodTop)" stroke="#4a2e15" stroke-width="1"/>
  <path d="M70 108H154V184H70Z" fill="url(#wood)" stroke="#4a2e15" stroke-width="1"/>
  <path d="M154 108L170 96V172L154 184Z" fill="#6e4524" stroke="#4a2e15" stroke-width="1"/>
  <path d="M106 100L126 100L122 103H110Z" fill="#1f130a"/>
  <rect x="104" y="140" width="16" height="14" rx="2" fill="#c9a54a" stroke="#5a4414" stroke-width=".8"/>
  <path d="M112 145v5" stroke="#5a4414" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M74 120H150M74 170H150" stroke="#4a2e15" stroke-width=".8" opacity=".6"/>
  <text x="112" y="132" fill="#f5e6c8" font-size="9" font-weight="800" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">투표함</text>
  <!-- 표를 넣는 손 -->
  <g transform="rotate(-8 118 70)">
    <rect x="108" y="60" width="20" height="30" fill="#fbf7ec" stroke="#8a7146" stroke-width=".8"/>
    <path d="M112 66h12M112 70h8" stroke="#8a7146" stroke-width=".7"/>
    <circle cx="118" cy="80" r="4" fill="none" stroke="#a3311f" stroke-width="1.4"/>
    <path d="M100 44C106 44 110 48 112 54L114 64H128L126 52C124 42 118 36 108 36L96 38Z" fill="url(#skin)" stroke="#8a5a3a" stroke-width=".8"/>
    <path d="M78 30L96 38L100 46L82 42Z" fill="#3b4a66"/>
  </g>
</svg>
