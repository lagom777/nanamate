<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>신라 촌락 문서(민정 문서) · 사람·소·말·나무 수를 3년마다 조사</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe1bd"/>
      <stop offset=".6" stop-color="#ddc79a"/>
      <stop offset="1" stop-color="#b99d6b"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b7f50"/>
      <stop offset=".4" stop-color="#e9d6aa"/>
      <stop offset="1" stop-color="#8a6d40"/>
    </linearGradient>
    <pattern id="col" width="10" height="9" patternUnits="userSpaceOnUse">
      <path d="M3 1.5h4M5 1.5v5M3 4h4M3 6.5l1.5 1M7 6.5l-1 1" fill="none" stroke="#3b2c1a" stroke-width=".8" stroke-linecap="round"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="aged"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="12"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .16  0 0 0 1.8 -.95"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <clipPath id="sheet"><path d="M36 30L150 24L156 160L42 168L44 150L38 140L42 124L36 110L40 90L35 70L39 50Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="182" rx="76" ry="7" fill="#000" opacity=".4" filter="url(#soft)"/>
  <g transform="rotate(-4 100 100)">
    <!-- 종이 -->
    <path d="M36 30L150 24L156 160L42 168L44 150L38 140L42 124L36 110L40 90L35 70L39 50Z" fill="url(#paper)" stroke="#8a6d40" stroke-width="1"/>
    <g clip-path="url(#sheet)">
      <rect x="30" y="20" width="130" height="150" fill="#000" filter="url(#aged)" opacity=".35"/>
      <!-- 세로 글줄 -->
      <g fill="url(#col)" opacity=".85">
        <rect x="128" y="34" width="10" height="120"/><rect x="114" y="34" width="10" height="96"/><rect x="100" y="34" width="10" height="120"/>
        <rect x="86" y="34" width="10" height="70"/><rect x="72" y="34" width="10" height="120"/><rect x="58" y="34" width="10" height="104"/><rect x="44" y="34" width="10" height="84"/>
      </g>
      <!-- 붉게 표시한 숫자 칸 -->
      <g fill="none" stroke="#a5321f" stroke-width="1" opacity=".8">
        <rect x="112" y="98" width="14" height="30"/><rect x="84" y="70" width="14" height="30"/>
      </g>
    </g>
    <!-- 둘둘 만 끝 -->
    <rect x="148" y="20" width="12" height="146" rx="6" fill="url(#roll)" stroke="#7a5d32" stroke-width="1"/>
  </g>
  <!-- 조사 항목 그림: 사람 · 소 · 말 · 뽕나무 -->
  <g transform="translate(36 168)">
    <rect x="0" y="0" width="128" height="22" rx="11" fill="#13263a" stroke="#4FD1E8" stroke-opacity=".6"/>
    <g fill="#e9f4f8">
      <circle cx="16" cy="7" r="3"/><path d="M11 18c0-5 2-7 5-7s5 2 5 7z"/>
      <path d="M38 9h14c2 0 3 1 3 3v2h-2v4h-2v-4h-8v4h-2v-4h-2v-3c-2 0-3-1-3-2h2zM36 8l-2-3M40 8l1-3"/>
      <path d="M70 7l3-3 3 2v2h8c2 0 3 2 3 4v6h-2v-5h-7v5h-2v-6l-3-1-2 2z"/>
      <path d="M104 18v-6M98 12a6 6 0 0 1 12 0c0 3-3 4-6 4s-6-1-6-4z"/>
    </g>
  </g>
</svg>
