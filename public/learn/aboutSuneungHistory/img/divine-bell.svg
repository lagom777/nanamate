<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>성덕 대왕 신종 (통일 신라 · 에밀레종 · 비천상)</title>
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d7069"/>
      <stop offset=".22" stop-color="#9fb4ab"/>
      <stop offset=".5" stop-color="#5b6e66"/>
      <stop offset="1" stop-color="#26302d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a35"/>
      <stop offset="1" stop-color="#4f311b"/>
    </linearGradient>
    <clipPath id="bell"><path d="M64 46C62 80 58 120 46 168H154C142 120 138 80 136 46Z"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <!-- 종을 거는 들보 -->
  <rect x="24" y="10" width="152" height="10" rx="2" fill="url(#beam)" stroke="#2e1c0f"/>
  <path d="M96 20V28H104V20" fill="none" stroke="#3a2a1c" stroke-width="2"/>
  <ellipse cx="100" cy="186" rx="64" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 용뉴(용 고리)와 음통 -->
  <path d="M84 46C80 38 84 28 94 28C102 28 106 34 104 40C110 36 116 38 116 46Z" fill="url(#bronze)" stroke="#1d2523" stroke-width="1"/>
  <path d="M108 46V30H116V46Z" fill="url(#bronze)" stroke="#1d2523" stroke-width="1"/>
  <path d="M108 34H116M108 38H116M108 42H116" stroke="#1d2523" stroke-width=".7"/>
  <circle cx="90" cy="34" r="1.2" fill="#1d2523"/>
  <!-- 종몸 -->
  <path d="M64 46C62 80 58 120 46 168H154C142 120 138 80 136 46Z" fill="url(#bronze)" stroke="#1d2523" stroke-width="1.2"/>
  <g clip-path="url(#bell)">
    <!-- 위 띠(상대)와 아래 띠(하대) -->
    <rect x="40" y="46" width="120" height="10" fill="#7f948b" opacity=".55"/>
    <rect x="40" y="156" width="120" height="12" fill="#7f948b" opacity=".55"/>
    <g fill="none" stroke="#2c3835" stroke-width=".8">
      <path d="M50 51c4-4 8-4 10 0s6 4 10 0 8-4 10 0 6 4 10 0 8-4 10 0 6 4 10 0 8-4 10 0 6 4 10 0"/>
      <path d="M44 162c4-4 8-4 10 0s6 4 10 0 8-4 10 0 6 4 10 0 8-4 10 0 6 4 10 0 8-4 10 0 6 4 10 0 8-4 10 0"/>
    </g>
    <!-- 유곽과 유두(젖꼭지 9개씩) -->
    <g>
      <rect x="66" y="58" width="22" height="22" fill="none" stroke="#2c3835" stroke-width="1"/>
      <rect x="112" y="58" width="22" height="22" fill="none" stroke="#2c3835" stroke-width="1"/>
      <g fill="#a8bcb2" stroke="#2c3835" stroke-width=".5">
        <circle cx="71" cy="63" r="2"/><circle cx="77" cy="63" r="2"/><circle cx="83" cy="63" r="2"/><circle cx="71" cy="69" r="2"/><circle cx="77" cy="69" r="2"/><circle cx="83" cy="69" r="2"/><circle cx="71" cy="75" r="2"/><circle cx="77" cy="75" r="2"/><circle cx="83" cy="75" r="2"/>
        <circle cx="117" cy="63" r="2"/><circle cx="123" cy="63" r="2"/><circle cx="129" cy="63" r="2"/><circle cx="117" cy="69" r="2"/><circle cx="123" cy="69" r="2"/><circle cx="129" cy="69" r="2"/><circle cx="117" cy="75" r="2"/><circle cx="123" cy="75" r="2"/><circle cx="129" cy="75" r="2"/>
      </g>
    </g>
    <!-- 비천상: 무릎 꿇고 향로를 받든 천인과 휘날리는 옷자락 -->
    <g fill="none" stroke="#c4d6cd" stroke-width="1.1" stroke-linecap="round" opacity=".85">
      <circle cx="84" cy="102" r="3.4"/>
      <path d="M84 106C82 112 82 118 86 122C80 124 76 128 76 132M86 122C92 122 96 126 96 132M82 110L90 104M90 104l3-2 1 3z"/>
      <path d="M78 108C70 104 64 108 60 116C66 112 72 112 76 116M90 112C100 108 110 112 118 104C112 114 102 118 92 118"/>
      <path d="M86 128C98 128 110 124 124 118"/>
    </g>
    <!-- 당좌(종 치는 자리): 연꽃 -->
    <circle cx="126" cy="132" r="10" fill="none" stroke="#2c3835" stroke-width="1"/>
    <g fill="none" stroke="#c4d6cd" stroke-width=".9" opacity=".8"><circle cx="126" cy="132" r="3"/><path d="M126 123v4M126 137v4M117 132h4M131 132h4M120 126l3 3M132 138l-3-3M132 126l-3 3M120 138l3-3"/></g>
    <path d="M70 50C70 90 66 130 56 166" stroke="#d9ebe2" stroke-opacity=".35" stroke-width="5" fill="none"/>
  </g>
  <!-- 종 입술 -->
  <path d="M46 168H154L156 172H44Z" fill="#3a4743" stroke="#1d2523" stroke-width=".8"/>
</svg>
