<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>석굴암 본존불 (통일 신라 · 김대성 · 인공 석굴)</title>
  <defs>
    <radialGradient id="cave" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#4a5260"/>
      <stop offset="1" stop-color="#1b2028"/>
    </radialGradient>
    <linearGradient id="granite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4efe5"/>
      <stop offset=".5" stop-color="#d8cfbf"/>
      <stop offset="1" stop-color="#9c917e"/>
    </linearGradient>
    <radialGradient id="face" cx=".42" cy=".4" r=".7">
      <stop offset="0" stop-color="#f7f2e9"/>
      <stop offset="1" stop-color="#bdb19c"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#cfc6b4"/>
      <stop offset="1" stop-color="#8f8673"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <pattern id="curl" width="3.4" height="3.4" patternUnits="userSpaceOnUse"><circle cx="1.7" cy="1.7" r="1.25" fill="#6f6656"/><circle cx="1.3" cy="1.3" r=".45" fill="#e9e2d4"/></pattern>
  </defs>
  <!-- 돔 천장의 석굴 -->
  <path d="M10 190V96A90 82 0 0 1 190 96V190Z" fill="url(#cave)"/>
  <g fill="none" stroke="#6b7484" stroke-width=".9" opacity=".55">
    <path d="M24 190V100A76 70 0 0 1 176 100V190"/>
    <path d="M100 14V40M60 22l8 22M140 22l-8 22M30 48l16 16M170 48l-16 16M14 90h20M186 90h-20"/>
  </g>
  <!-- 광배(연꽃 무늬 원판) -->
  <circle cx="100" cy="58" r="31" fill="url(#halo)" stroke="#7f7664" stroke-width="1"/>
  <g fill="none" stroke="#857b67" stroke-width=".8" opacity=".8">
    <circle cx="100" cy="58" r="24"/>
    <path d="M100 34c3 4 3 8 0 10c-3-2-3-6 0-10zM117 41c0 5-2 8-6 9c-1-4 1-7 6-9zM124 58c-4 3-8 3-10 0c2-3 6-3 10 0zM117 75c-5 0-8-2-9-6c4-1 7 1 9 6zM83 41c0 5 2 8 6 9c1-4-1-7-6-9zM76 58c4 3 8 3 10 0c-2-3-6-3-10 0zM83 75c5 0 8-2 9-6c-4-1-7 1-9 6z"/>
  </g>
  <ellipse cx="100" cy="182" rx="66" ry="6" fill="#000" opacity=".5" filter="url(#soft)"/>
  <!-- 대좌 -->
  <path d="M50 170H150L156 184H44Z" fill="url(#granite)" stroke="#6e6555" stroke-width=".9"/>
  <path d="M56 156H144L150 170H50Z" fill="url(#granite)" stroke="#6e6555" stroke-width=".9"/>
  <g fill="none" stroke="#7b725f" stroke-width=".9">
    <path d="M58 156c4-8 10-8 12 0c4-8 10-8 12 0c4-8 10-8 12 0c4-8 10-8 12 0c4-8 10-8 12 0c4-8 10-8 12 0c4-8 10-8 12 0"/>
  </g>
  <!-- 결가부좌한 다리 -->
  <path d="M54 152C56 138 74 132 100 132C126 132 144 138 146 152C134 158 66 158 54 152Z" fill="url(#granite)" stroke="#6e6555" stroke-width="1"/>
  <path d="M64 146C80 140 120 140 136 146" fill="none" stroke="#8f8571" stroke-width=".9"/>
  <!-- 몸과 법의 (오른쪽 어깨를 드러냄) -->
  <path d="M72 88C80 82 120 82 128 88C134 100 132 120 126 136H74C68 120 66 100 72 88Z" fill="url(#granite)" stroke="#6e6555" stroke-width="1"/>
  <path d="M72 88C84 92 100 104 112 134" fill="none" stroke="#857b67" stroke-width="1"/>
  <g fill="none" stroke="#9b917d" stroke-width=".8">
    <path d="M76 96C86 100 96 110 104 132M76 106C84 110 90 118 96 132M80 118C84 122 86 128 88 134"/>
  </g>
  <!-- 오른손: 무릎 위에서 땅을 가리킴(항마촉지인) -->
  <path d="M124 90C134 100 136 120 134 136C134 142 136 146 138 150L132 152C128 146 126 140 126 134C126 120 122 104 118 96Z" fill="url(#granite)" stroke="#6e6555" stroke-width=".9"/>
  <path d="M132 150v4M135 149v5M138 149v4" stroke="#6e6555" stroke-width=".8"/>
  <!-- 왼손: 배꼽 앞에 손바닥을 위로 -->
  <path d="M82 134C88 128 102 128 108 134C100 138 90 138 82 134Z" fill="#e4dccd" stroke="#6e6555" stroke-width=".8"/>
  <!-- 목의 세 줄(삼도) -->
  <path d="M93 80C97 82 103 82 107 80M92 84C97 86 103 86 108 84" fill="none" stroke="#8a806b" stroke-width=".8"/>
  <!-- 머리: 육계와 나발 -->
  <ellipse cx="100" cy="62" rx="13" ry="16" fill="url(#face)" stroke="#7b725f" stroke-width=".9"/>
  <path d="M87 58C87 46 92 41 100 41C108 41 113 46 113 58C110 52 105 50 100 50C95 50 90 52 87 58Z" fill="url(#curl)" stroke="#5f5747" stroke-width=".6"/>
  <ellipse cx="100" cy="41" rx="7.5" ry="5.5" fill="url(#curl)" stroke="#5f5747" stroke-width=".6"/>
  <path d="M86 60c-2 2-2 8 0 12M114 60c2 2 2 8 0 12" fill="none" stroke="#a69a85" stroke-width="1.6"/>
  <!-- 고요히 감은 눈과 미소 -->
  <g fill="none" stroke="#6b6252" stroke-width=".9" stroke-linecap="round">
    <path d="M92 61c2 1.6 4 1.6 6 0M102 61c2 1.6 4 1.6 6 0"/>
    <path d="M100 63v5"/>
    <path d="M96 71c2 1.2 6 1.2 8 0"/>
  </g>
  <circle cx="100" cy="56" r="1" fill="#8c826e"/>
</svg>
