<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>거중기 (조선 정조 · 정약용 · 도르래로 무거운 돌을 들어 올림)</title>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c08a56"/>
      <stop offset="1" stop-color="#7a4e28"/>
    </linearGradient>
    <linearGradient id="woodH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99464"/>
      <stop offset="1" stop-color="#7a4e28"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3cdbd"/>
      <stop offset="1" stop-color="#8b8473"/>
    </linearGradient>
    <radialGradient id="pulley" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#e2b77d"/>
      <stop offset="1" stop-color="#7a4e28"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <g id="wheel"><circle r="5" fill="url(#pulley)" stroke="#4a2e15" stroke-width=".8"/><circle r="1.4" fill="#4a2e15"/></g>
  </defs>
  <ellipse cx="100" cy="188" rx="90" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 땅 -->
  <path d="M6 182H194" stroke="#6b5a40" stroke-width="2"/>
  <!-- 양쪽 기둥(A자 틀)과 위 가로대 -->
  <g stroke="#4a2e15" stroke-width=".9" stroke-linejoin="round">
    <path d="M34 182L48 30H56L44 182Z" fill="url(#wood)"/>
    <path d="M70 182L56 30H48L62 182Z" fill="url(#wood)"/>
    <path d="M166 182L152 30H144L156 182Z" fill="url(#wood)"/>
    <path d="M130 182L144 30H152L138 182Z" fill="url(#wood)"/>
    <path d="M40 24H160V34H40Z" fill="url(#woodH)"/>
    <path d="M44 120H64V126H44ZM136 120H156V126H136Z" fill="url(#woodH)"/>
  </g>
  <!-- 위 도르래 뭉치 -->
  <path d="M78 34H122V46H78Z" fill="url(#woodH)" stroke="#4a2e15" stroke-width=".9"/>
  <use href="#wheel" x="84" y="40"/><use href="#wheel" x="95" y="40"/><use href="#wheel" x="106" y="40"/><use href="#wheel" x="117" y="40"/>
  <!-- 아래 도르래 뭉치 -->
  <path d="M78 104H122V116H78Z" fill="url(#woodH)" stroke="#4a2e15" stroke-width=".9"/>
  <use href="#wheel" x="84" y="110"/><use href="#wheel" x="95" y="110"/><use href="#wheel" x="106" y="110"/><use href="#wheel" x="117" y="110"/>
  <!-- 여러 겹으로 감긴 밧줄 -->
  <g stroke="#d8c08a" stroke-width="1.3" fill="none">
    <path d="M80 40V110M89 40V110M91 40V110M100 40V110M102 40V110M111 40V110M113 40V110M121 40V110"/>
    <path d="M80 40C70 42 64 70 58 122M121 40C130 42 136 70 142 122"/>
  </g>
  <!-- 양쪽 물레(녹로) -->
  <g stroke="#4a2e15" stroke-width=".9">
    <circle cx="54" cy="123" r="9" fill="url(#pulley)"/>
    <circle cx="146" cy="123" r="9" fill="url(#pulley)"/>
    <path d="M54 114V132M45 123H63M146 114V132M137 123H155" stroke-width="2"/>
  </g>
  <!-- 들어 올리는 돌 -->
  <path d="M100 116V132" stroke="#d8c08a" stroke-width="1.6"/>
  <path d="M86 132H114L110 138H90Z" fill="url(#woodH)" stroke="#4a2e15" stroke-width=".8"/>
  <path d="M78 140L122 138L126 166L74 168Z" fill="url(#stone)" stroke="#5f5847" stroke-width="1"/>
  <path d="M78 140L122 138L126 144L76 146Z" fill="#e8e3d6" opacity=".55"/>
  <path d="M88 138L84 168M112 138L116 166" stroke="#d8c08a" stroke-width="1.4"/>
</svg>
