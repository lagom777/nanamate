<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>독립신문 (1896 · 서재필 · 최초의 민간 신문 · 한글판과 영문판)</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ead4"/>
      <stop offset="1" stop-color="#d9c79e"/>
    </linearGradient>
    <pattern id="col" width="7" height="8" patternUnits="userSpaceOnUse">
      <path d="M1.5 1.5h3M3 1.5v2.4M1.6 4.4h3M2 6.4h2.4v1.2" fill="none" stroke="#2a2218" stroke-width=".7" stroke-linecap="round"/>
    </pattern>
    <pattern id="eng" width="40" height="4" patternUnits="userSpaceOnUse">
      <path d="M1 2h8M11 2h5M18 2h10M30 2h8" stroke="#3a3328" stroke-width=".9"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="aged"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="71"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .34  0 0 0 0 .18  0 0 0 1.5 -.85"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <ellipse cx="100" cy="188" rx="84" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 뒤: 영문판 -->
  <g transform="rotate(7 150 100)">
    <rect x="104" y="30" width="80" height="140" fill="url(#paper)" stroke="#8a7146" stroke-width=".9"/>
    <text x="144" y="46" fill="#1f1a12" font-size="8.5" font-weight="700" text-anchor="middle" font-family="Georgia,'Times New Roman',serif">THE INDEPENDENT</text>
    <path d="M110 50H178" stroke="#1f1a12" stroke-width=".7"/>
    <rect x="110" y="56" width="68" height="104" fill="url(#eng)" opacity=".7"/>
  </g>
  <!-- 앞: 한글판 -->
  <g transform="rotate(-4 80 104)">
    <rect x="20" y="22" width="112" height="156" fill="url(#paper)" stroke="#8a7146" stroke-width="1"/>
    <rect x="20" y="22" width="112" height="156" fill="#000" filter="url(#aged)" opacity=".25"/>
    <text x="76" y="48" fill="#1f1a12" font-size="21" font-weight="900" text-anchor="middle" font-family="'Noto Serif CJK KR','Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif" letter-spacing="1">독닙신문</text>
    <path d="M26 56H126M26 59H126" stroke="#1f1a12" stroke-width=".8"/>
    <g fill="#1f1a12" font-size="5" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="40" y="54">건양 원년</text><text x="112" y="54">뎨일호</text></g>
    <!-- 세로 글줄 (한글 · 띄어쓰기) -->
    <rect x="28" y="64" width="96" height="106" fill="url(#col)" opacity=".85"/>
    <g stroke="#6b5532" stroke-width=".5" opacity=".7"><path d="M52 64v106M76 64v106M100 64v106"/></g>
  </g>
</svg>
