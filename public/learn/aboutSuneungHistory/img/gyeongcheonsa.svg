<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>경천사지 10층 석탑 (고려 · 대리석 · 원나라 영향 · 국립중앙박물관)</title>
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f5f0"/>
      <stop offset=".5" stop-color="#d9d6cb"/>
      <stop offset="1" stop-color="#9c9a90"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecebe4"/>
      <stop offset="1" stop-color="#a9a69b"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <!-- 한 층: 몸돌과 기와지붕 모양 지붕돌 -->
    <g id="st">
      <rect x="-10" y="-9" width="20" height="9" fill="url(#m)" stroke="#6f6c62" stroke-width=".6"/>
      <path d="M-14-9H14L11-12H-11Z" fill="url(#r)" stroke="#6f6c62" stroke-width=".6"/>
      <path d="M-14-9l-2-1.6M14-9l2-1.6" stroke="#6f6c62" stroke-width=".9"/>
      <path d="M-4-7v5M0-7v5M4-7v5" stroke="#9a978c" stroke-width=".6"/>
    </g>
  </defs>
  <ellipse cx="100" cy="188" rx="62" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <g stroke="#6f6c62" stroke-width=".7" stroke-linejoin="round">
    <!-- 아(亞)자 모양 기단 3단 -->
    <path d="M52 178H148L152 188H48Z" fill="url(#r)"/>
    <path d="M58 166H70V162H130V166H142V178H58Z" fill="url(#m)"/>
    <path d="M64 154H74V150H126V154H136V166H64Z" fill="url(#m)"/>
    <path d="M70 142H78V138H122V142H130V154H70Z" fill="url(#m)"/>
    <g fill="none" stroke="#a19e93" stroke-width=".6"><path d="M62 170h76M68 158h64M74 146h52"/></g>
    <g fill="#a7a498"><circle cx="84" cy="172" r="1.6"/><circle cx="100" cy="172" r="1.6"/><circle cx="116" cy="172" r="1.6"/><circle cx="90" cy="160" r="1.4"/><circle cx="110" cy="160" r="1.4"/><circle cx="100" cy="147" r="1.3"/></g>
    <!-- 아래 3층: 아자 평면이라 옆으로 튀어나온 몸돌 -->
    <path d="M74 138H126V124H74Z" fill="url(#m)"/><path d="M70 124H130L125 119H75Z" fill="url(#r)"/>
    <path d="M77 119H123V106H77Z" fill="url(#m)"/><path d="M73 106H127L122 101H78Z" fill="url(#r)"/>
    <path d="M80 101H120V89H80Z" fill="url(#m)"/><path d="M76 89H124L119 84H81Z" fill="url(#r)"/>
    <g fill="none" stroke="#a19e93" stroke-width=".6"><path d="M86 124v14M100 124v14M114 124v14M88 106v13M100 106v13M112 106v13M90 89v12M100 89v12M110 89v12"/></g>
    <g fill="#b3b0a5"><circle cx="93" cy="131" r="1.8"/><circle cx="107" cy="131" r="1.8"/><circle cx="94" cy="113" r="1.6"/><circle cx="106" cy="113" r="1.6"/><circle cx="95" cy="95" r="1.4"/><circle cx="105" cy="95" r="1.4"/></g>
  </g>
  <!-- 위 7층: 네모 평면 -->
  <use href="#st" transform="translate(100 84) scale(1.3)"/>
  <use href="#st" transform="translate(100 72) scale(1.22)"/>
  <use href="#st" transform="translate(100 61) scale(1.14)"/>
  <use href="#st" transform="translate(100 51) scale(1.06)"/>
  <use href="#st" transform="translate(100 42) scale(.98)"/>
  <use href="#st" transform="translate(100 34) scale(.9)"/>
  <use href="#st" transform="translate(100 27) scale(.82)"/>
  <!-- 상륜 -->
  <path d="M98 17V8h4v9z" fill="url(#m)" stroke="#6f6c62" stroke-width=".6"/>
  <ellipse cx="100" cy="12" rx="4" ry="1.4" fill="url(#r)" stroke="#6f6c62" stroke-width=".5"/>
  <path d="M100 8V3" stroke="#6f6c62" stroke-width="1"/>
</svg>
