<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>조선왕조실록 (조선 · 왕이 죽은 뒤 실록청에서 편찬 · 사고에 보관)</title>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b25a"/>
      <stop offset="1" stop-color="#9c7425"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e6cb"/>
      <stop offset="1" stop-color="#cbb98f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe3c6"/>
      <stop offset="1" stop-color="#d9c79c"/>
    </linearGradient>
    <pattern id="glyph" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M2 1.6h4M4 1.6v4.6M2.2 3.8h3.6M2.2 6.6l1.3.8M5.8 6.6l-1 .8" fill="none" stroke="#2c2116" stroke-width=".8" stroke-linecap="round"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <!-- 실로 꿰맨 책 한 권 (다섯 구멍 매기) -->
    <g id="book">
      <path d="M0 0H88V12H0Z" fill="url(#edge)" stroke="#8a7146" stroke-width=".8"/>
      <path d="M0 0H88L94-6H6Z" fill="url(#cover)" stroke="#6b4f1a" stroke-width=".8"/>
      <path d="M88 0L94-6V6L88 12Z" fill="#8a6620" stroke="#6b4f1a" stroke-width=".8"/>
      <path d="M2 3H86M2 6H86M2 9H86" stroke="#b8a578" stroke-width=".5"/>
      <g fill="#5a3d12"><circle cx="8" cy="-3" r=".9"/><circle cx="26" cy="-3" r=".9"/><circle cx="46" cy="-3" r=".9"/><circle cx="66" cy="-3" r=".9"/><circle cx="84" cy="-3" r=".9"/></g>
    </g>
  </defs>
  <ellipse cx="100" cy="182" rx="82" ry="7" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 쌓은 책 -->
  <use href="#book" transform="translate(34 132)"/>
  <use href="#book" transform="translate(30 116)"/>
  <use href="#book" transform="translate(36 100)"/>
  <use href="#book" transform="translate(32 84)"/>
  <!-- 맨 위 책 표지의 제목 띠 -->
  <path d="M60 82l6-6h10l-6 6z" fill="#f3ead2" stroke="#8a7146" stroke-width=".5"/>
  <!-- 앞에 펼친 한 권 -->
  <g transform="rotate(-6 128 150)">
    <path d="M128 132C120 128 104 128 92 130V174C104 172 120 172 128 176Z" fill="url(#page)" stroke="#8a7146" stroke-width=".9"/>
    <path d="M128 132C136 128 152 128 164 130V174C152 172 136 172 128 176Z" fill="url(#page)" stroke="#8a7146" stroke-width=".9"/>
    <rect x="96" y="136" width="28" height="34" fill="url(#glyph)" opacity=".8"/>
    <rect x="132" y="136" width="28" height="34" fill="url(#glyph)" opacity=".8"/>
    <rect x="148" y="140" width="9" height="9" fill="none" stroke="#b33a26" stroke-width="1.1"/>
    <path d="M128 132V176" stroke="#7a6038" stroke-width="1.1"/>
  </g>
</svg>
