<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>측우기와 측우대 (조선 세종 · 강우량을 전국에서 측정)</title>
  <defs>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f8a80"/>
      <stop offset=".25" stop-color="#b5c9c0"/>
      <stop offset=".55" stop-color="#6b8279"/>
      <stop offset="1" stop-color="#2c3a35"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d4c7"/>
      <stop offset="1" stop-color="#8e887a"/>
    </linearGradient>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece8dd"/>
      <stop offset="1" stop-color="#bdb6a6"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe7ff"/>
      <stop offset="1" stop-color="#4fa3d9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="31"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .24  0 0 0 0 .2  0 0 0 .45 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <!-- 빗방울 -->
  <g fill="url(#drop)">
    <path d="M60 22c3 5 5 8 5 11a5 5 0 0 1-10 0c0-3 2-6 5-11z"/><path d="M140 14c3 5 5 8 5 11a5 5 0 0 1-10 0c0-3 2-6 5-11z"/>
    <path d="M100 8c2.4 4 4 6.4 4 8.8a4 4 0 0 1-8 0c0-2.4 1.6-4.8 4-8.8z"/><path d="M164 46c2.4 4 4 6.4 4 8.8a4 4 0 0 1-8 0c0-2.4 1.6-4.8 4-8.8z"/>
    <path d="M36 54c2.4 4 4 6.4 4 8.8a4 4 0 0 1-8 0c0-2.4 1.6-4.8 4-8.8z"/>
  </g>
  <ellipse cx="100" cy="188" rx="70" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 측우대: 화강암 받침 -->
  <path d="M56 116H144L150 124H50Z" fill="url(#stoneTop)" stroke="#6b6555" stroke-width=".9"/>
  <path d="M50 124H150V182H50Z" fill="url(#stone)" stroke="#6b6555" stroke-width=".9"/>
  <path d="M50 124H150V182H50Z" fill="#999" filter="url(#grain)"/>
  <!-- 받침에 새긴 글자 '測雨臺' 자리 -->
  <g fill="none" stroke="#4f4a3e" stroke-width="1.3" stroke-linecap="round">
    <path d="M94 134h12M100 131v10M95 138l10 0M96 144h8v8h-8zM96 148h8M94 158h12M100 156v12M96 162h8M95 168h10"/>
  </g>
  <!-- 측우기: 구리 원통 세 마디 -->
  <path d="M84 60H116V116H84Z" fill="url(#cu)" stroke="#1f2a26" stroke-width="1"/>
  <ellipse cx="100" cy="60" rx="16" ry="4" fill="#24312d" stroke="#1f2a26"/>
  <ellipse cx="100" cy="60" rx="16" ry="4" fill="none" stroke="#c6d8cf" stroke-width="1" opacity=".7"/>
  <path d="M84 78Q100 82 116 78M84 98Q100 102 116 98" fill="none" stroke="#1f2a26" stroke-width="1.6"/>
  <path d="M84 79Q100 83 116 79M84 99Q100 103 116 99" fill="none" stroke="#c6d8cf" stroke-width=".7" opacity=".6"/>
  <!-- 깊이를 재는 자(주척) -->
  <g transform="rotate(14 150 96)">
    <rect x="144" y="56" width="10" height="70" fill="#d8b77a" stroke="#6b4f20" stroke-width=".8"/>
    <path d="M144 62h4M144 68h6M144 74h4M144 80h6M144 86h4M144 92h6M144 98h4M144 104h6M144 110h4M144 116h6M144 122h4" stroke="#6b4f20" stroke-width=".7"/>
  </g>
</svg>
