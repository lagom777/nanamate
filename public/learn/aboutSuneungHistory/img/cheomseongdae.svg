<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>첨성대 (신라 선덕 여왕 · 천문 관측)</title>
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3d6bb"/>
      <stop offset=".45" stop-color="#c9b794"/>
      <stop offset="1" stop-color="#857353"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbbd9f"/>
      <stop offset="1" stop-color="#8e7f62"/>
    </linearGradient>
    <pattern id="course" width="200" height="4.3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4.1" x2="200" y2="4.1" stroke="#6b5a3e" stroke-width=".6" stroke-opacity=".75"/>
    </pattern>
    <pattern id="joint" width="11" height="8.6" patternUnits="userSpaceOnUse">
      <line x1="2" y1="0" x2="2" y2="4.3" stroke="#6b5a3e" stroke-width=".5" stroke-opacity=".6"/>
      <line x1="7.5" y1="4.3" x2="7.5" y2="8.6" stroke="#6b5a3e" stroke-width=".5" stroke-opacity=".6"/>
    </pattern>
    <clipPath id="body"><path d="M55 160C57 126 72 96 79 72C81 62 81 55 81 50H119C119 55 119 62 121 72C128 96 143 126 145 160Z"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <radialGradient id="star"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- 밤하늘 별 -->
  <g fill="url(#star)"><circle cx="40" cy="34" r="3"/><circle cx="160" cy="24" r="3.6"/><circle cx="150" cy="58" r="2.4"/><circle cx="30" cy="78" r="2.2"/><circle cx="172" cy="96" r="2"/></g>
  <ellipse cx="100" cy="186" rx="80" ry="7" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 기단 두 층 -->
  <polygon points="42,174 158,174 164,186 36,186" fill="url(#base)" stroke="#6b5a3e" stroke-width=".8"/>
  <polygon points="50,164 150,164 156,174 44,174" fill="url(#base)" stroke="#6b5a3e" stroke-width=".8"/>
  <path d="M42 174H158M50 164H150" stroke="#f1e7d2" stroke-width=".8" opacity=".6"/>
  <!-- 몸통: 27단 술병 모양 -->
  <path d="M55 160C57 126 72 96 79 72C81 62 81 55 81 50H119C119 55 119 62 121 72C128 96 143 126 145 160Z" fill="url(#stone)" stroke="#6b5a3e" stroke-width="1"/>
  <g clip-path="url(#body)">
    <rect x="50" y="48" width="100" height="114" fill="url(#course)"/>
    <rect x="50" y="48" width="100" height="114" fill="url(#joint)"/>
    <rect x="50" y="48" width="100" height="114" fill="#fff" opacity=".06"/>
    <path d="M126 50C126 70 132 92 140 116C146 132 149 146 150 160" stroke="#000" stroke-opacity=".16" stroke-width="16" fill="none"/>
  </g>
  <rect x="56" y="158" width="88" height="6" fill="url(#base)" stroke="#6b5a3e" stroke-width=".7"/>
  <!-- 남쪽 창 -->
  <rect x="91" y="102" width="18" height="16" fill="#2a2116" stroke="#6b5a3e" stroke-width="1"/>
  <path d="M91 102h18" stroke="#efe3cb" stroke-width=".8" opacity=".6"/>
  <!-- 꼭대기 정(井)자 틀 -->
  <rect x="72" y="42" width="56" height="8" fill="url(#base)" stroke="#6b5a3e" stroke-width=".9"/>
  <rect x="68" y="35" width="64" height="7" fill="url(#base)" stroke="#6b5a3e" stroke-width=".9"/>
  <path d="M80 35v7M120 35v7M84 42v8M116 42v8" stroke="#6b5a3e" stroke-width=".8"/>
  <path d="M68 35h64" stroke="#f6eddc" stroke-width=".8" opacity=".7"/>
</svg>
