<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>비파형 동검 (청동기 · 고조선의 세력 범위)</title>
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb89a"/>
      <stop offset=".46" stop-color="#5f8b6c"/>
      <stop offset=".54" stop-color="#4a7258"/>
      <stop offset="1" stop-color="#2f4d3a"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7e2c7"/>
      <stop offset="1" stop-color="#5c8a69"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d9f84"/>
      <stop offset="1" stop-color="#34503e"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="rust"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .48  0 0 0 0 .33  0 0 0 0 .2  0 0 0 2.4 -1.35"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <ellipse cx="104" cy="186" rx="34" ry="5" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 검몸: 아래가 비파처럼 둥글게 부풀고 가운데에 돌기 -->
  <path id="blade" d="M100 14C103 30 106 46 108 62C110 74 113 84 118 92L127 97L119 103C117 110 120 118 127 126C134 135 133 149 114 154L106 156H94L86 154C67 149 66 135 73 126C80 118 83 110 81 103L73 97L82 92C87 84 90 74 92 62C94 46 97 30 100 14Z" fill="url(#bronze)" stroke="#203628" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M100 14C103 30 106 46 108 62C110 74 113 84 118 92L127 97L119 103C117 110 120 118 127 126C134 135 133 149 114 154L106 156H94L86 154C67 149 66 135 73 126C80 118 83 110 81 103L73 97L82 92C87 84 90 74 92 62C94 46 97 30 100 14Z" fill="#000" filter="url(#rust)" opacity=".9"/>
  <!-- 등대(가운데 줄기)와 마디 -->
  <path d="M100 18L103 60L104 96L107 101L104 106L104 152H96L96 106L93 101L96 96L97 60Z" fill="url(#spine)" opacity=".9"/>
  <path d="M98 22L99.5 150" stroke="#e8f5e8" stroke-width=".8" opacity=".55"/>
  <!-- 날 가장자리 빛 -->
  <path d="M95 30C93 50 91 70 88 84" fill="none" stroke="#d9efda" stroke-width="1" opacity=".55"/>
  <path d="M78 120C72 128 71 138 74 144" fill="none" stroke="#d9efda" stroke-width="1" opacity=".5"/>
  <!-- 슴베와 손잡이 -->
  <rect x="96" y="156" width="8" height="10" fill="#2f4d3a"/>
  <path d="M84 166H116L112 182H88Z" fill="url(#hilt)" stroke="#1f3327" stroke-width="1"/>
  <path d="M88 170H112M89 175H111" stroke="#a9c6ad" stroke-width=".8" opacity=".6"/>
</svg>
