<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>빗살무늬 토기 (신석기, 서울 암사동)</title>
  <defs>
    <clipPath id="body"><path d="M60 36L140 36C147 60 149 86 141 112C133 140 117 162 100 184C83 162 67 140 59 112C51 86 53 60 60 36Z"/></clipPath>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a38c74"/>
      <stop offset=".35" stop-color="#8f7864"/>
      <stop offset=".75" stop-color="#6b5646"/>
      <stop offset="1" stop-color="#4a3a2f"/>
    </linearGradient>
    <radialGradient id="shine" cx=".35" cy=".3" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c08e"/>
      <stop offset="1" stop-color="#a88b5a"/>
    </linearGradient>
    <pattern id="dash" width="5" height="14" patternUnits="userSpaceOnUse">
      <line x1=".8" y1="1" x2="3.6" y2="13" stroke="#3a2c22" stroke-width="1.2" stroke-linecap="round"/>
    </pattern>
    <pattern id="herring" width="7" height="16" patternUnits="userSpaceOnUse">
      <line x1=".6" y1="1" x2="6" y2="7" stroke="#3a2c22" stroke-width="1.1" stroke-linecap="round"/>
      <line x1="6" y1="9" x2=".6" y2="15" stroke="#3a2c22" stroke-width="1.1" stroke-linecap="round"/>
    </pattern>
    <pattern id="slant" width="6" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <line x1="3" y1="0" x2="3" y2="12" stroke="#3a2c22" stroke-width="1.1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <ellipse cx="100" cy="184" rx="58" ry="9" fill="#000" opacity=".4" filter="url(#soft)"/>
  <g clip-path="url(#body)">
    <rect x="40" y="20" width="120" height="170" fill="url(#clay)"/>
    <g opacity=".62">
      <rect x="40" y="42" width="120" height="16" fill="url(#dash)"/>
      <rect x="40" y="64" width="120" height="48" fill="url(#herring)"/>
      <rect x="40" y="118" width="120" height="70" fill="url(#slant)"/>
    </g>
    <g stroke="#3a2c22" stroke-opacity=".35" stroke-width=".8" fill="none">
      <path d="M52 60Q100 64 148 60"/><path d="M50 114Q100 120 150 114"/>
    </g>
    <rect x="40" y="20" width="120" height="170" fill="url(#shine)"/>
    <path d="M128 40C138 70 138 108 112 160" stroke="#000" stroke-opacity=".18" stroke-width="10" fill="none"/>
  </g>
  <path d="M60 36L140 36C147 60 149 86 141 112C133 140 117 162 100 184C83 162 67 140 59 112C51 86 53 60 60 36Z" fill="none" stroke="#3b2e25" stroke-width="1.4"/>
  <!-- 아가리 -->
  <ellipse cx="100" cy="36" rx="40" ry="7" fill="#2a2019"/>
  <ellipse cx="100" cy="36" rx="40" ry="7" fill="none" stroke="#b39a80" stroke-width="2.4"/>
  <path d="M64 37Q100 46 136 37" fill="none" stroke="#5a463a" stroke-width="1.2" opacity=".7"/>
  <!-- 깨진 자리 -->
  <path d="M120 30l6 3-2 4z" fill="#2a2019"/>
  <!-- 모래에 꽂아 세운다 -->
  <path d="M48 189C64 179 86 176 100 177C116 176 138 180 154 189C134 195 68 195 48 189Z" fill="url(#sand)"/>
  <g fill="#7a6040" opacity=".5"><circle cx="66" cy="187" r=".9"/><circle cx="82" cy="182" r=".8"/><circle cx="118" cy="182" r=".9"/><circle cx="136" cy="187" r=".8"/><circle cx="100" cy="189" r=".9"/></g>
  <path d="M62 184C78 178 92 177 100 177C112 177 128 179 140 184" fill="none" stroke="#f2deb4" stroke-opacity=".6" stroke-width="1.2"/>
</svg>
