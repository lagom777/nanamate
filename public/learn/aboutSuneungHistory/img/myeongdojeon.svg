<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>명도전과 반량전 (철기 · 중국과의 교역)</title>
  <defs>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cbf96"/>
      <stop offset=".5" stop-color="#6c9474"/>
      <stop offset="1" stop-color="#3e5f48"/>
    </linearGradient>
    <linearGradient id="cu2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a46c"/>
      <stop offset="1" stop-color="#6f5f33"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="rust"><feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .18  0 0 0 2.2 -1.25"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <ellipse cx="100" cy="178" rx="78" ry="8" fill="#000" opacity=".4" filter="url(#soft)"/>
  <!-- 명도전 1: 칼 모양 돈 -->
  <g transform="rotate(-30 100 100)">
    <g id="knife">
      <path d="M24 92C50 84 92 82 128 86L132 100C96 98 56 100 26 108Z" fill="url(#cu)" stroke="#27402f" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M128 86L162 88L162 98L132 100Z" fill="url(#cu)" stroke="#27402f" stroke-width="1.2"/>
      <path d="M136 90H160M136 94H160" stroke="#27402f" stroke-width=".9" opacity=".7"/>
      <circle cx="172" cy="93" r="9" fill="none" stroke="#3e5f48" stroke-width="5"/>
      <circle cx="172" cy="93" r="9" fill="none" stroke="#a9cba3" stroke-width="1" opacity=".6"/>
      <!-- 明 자 -->
      <g fill="none" stroke="#27402f" stroke-width="1.6" stroke-linecap="round">
        <rect x="70" y="90" width="7" height="8"/><path d="M84 89v10M84 89h7v10M84 93h7M84 96h7"/>
      </g>
      <path d="M28 104C56 97 96 95 130 97" stroke="#d6ebd2" stroke-width=".9" opacity=".5"/>
    </g>
    <path d="M24 92C50 84 92 82 128 86L132 100C96 98 56 100 26 108Z" fill="#000" filter="url(#rust)" opacity=".8"/>
  </g>
  <!-- 명도전 2 -->
  <g transform="translate(6 34) rotate(-14 100 100)" opacity=".96">
    <use href="#knife"/>
  </g>
  <!-- 반량전: 둥근 돈, 네모 구멍 -->
  <g transform="translate(150 150)">
    <circle r="24" fill="url(#cu2)" stroke="#4a3f20" stroke-width="1.3"/>
    <circle r="20" fill="none" stroke="#4a3f20" stroke-width=".8" opacity=".6"/>
    <rect x="-6" y="-6" width="12" height="12" fill="#0e1b2a" stroke="#4a3f20" stroke-width="1.2"/>
    <g stroke="#4a3f20" stroke-width="1.4" fill="none" stroke-linecap="round"><path d="M-15-4h5M-12.5-6v9M-15 2h5M10-5h5M12.5-6v10M10 0h5"/></g>
    <circle r="24" fill="#000" filter="url(#rust)" opacity=".7"/>
  </g>
</svg>
