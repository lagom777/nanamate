<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>사발통문 (1893 · 동학 농민 운동 · 주모자를 감추려 이름을 둥글게 적음)</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe1bd"/>
      <stop offset="1" stop-color="#cdb380"/>
    </linearGradient>
    <pattern id="col" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M2.5 1.5h4M4.5 1.5v5M2.5 4h4M2.5 7l1.5 1M6.5 7l-1 1" fill="none" stroke="#2c2116" stroke-width=".8" stroke-linecap="round"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="aged"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="61"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .16  0 0 0 1.7 -.95"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <g id="name"><path d="M0-30v-14M-2.4-33h4.8M-2.4-38h4.8M-1.6-42l1.6 1.6 1.6-1.6" fill="none" stroke="#1f160d" stroke-width="1" stroke-linecap="round"/></g>
  </defs>
  <ellipse cx="100" cy="186" rx="84" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <g transform="rotate(-3 100 100)">
    <path d="M16 22L184 18L186 176L18 180Z" fill="url(#paper)" stroke="#8a6d40" stroke-width="1"/>
    <path d="M16 22L184 18L186 176L18 180Z" fill="#000" filter="url(#aged)" opacity=".3"/>
    <!-- 오른쪽: 결의 내용 글줄 -->
    <rect x="128" y="30" width="48" height="136" fill="url(#col)" opacity=".85"/>
    <g stroke="#6b5532" stroke-width=".5" opacity=".6"><path d="M137 30v136M146 30v136M155 30v136M164 30v136"/></g>
    <!-- 왼쪽: 사발을 엎어 그린 원 둘레에 이름을 빙 둘러 적음 -->
    <circle cx="70" cy="100" r="26" fill="none" stroke="#1f160d" stroke-width="1.2"/>
    <g transform="translate(70 100)">
      <use href="#name" transform="rotate(0)"/><use href="#name" transform="rotate(18)"/><use href="#name" transform="rotate(36)"/><use href="#name" transform="rotate(54)"/><use href="#name" transform="rotate(72)"/>
      <use href="#name" transform="rotate(90)"/><use href="#name" transform="rotate(108)"/><use href="#name" transform="rotate(126)"/><use href="#name" transform="rotate(144)"/><use href="#name" transform="rotate(162)"/>
      <use href="#name" transform="rotate(180)"/><use href="#name" transform="rotate(198)"/><use href="#name" transform="rotate(216)"/><use href="#name" transform="rotate(234)"/><use href="#name" transform="rotate(252)"/>
      <use href="#name" transform="rotate(270)"/><use href="#name" transform="rotate(288)"/><use href="#name" transform="rotate(306)"/><use href="#name" transform="rotate(324)"/><use href="#name" transform="rotate(342)"/>
    </g>
    <circle cx="70" cy="100" r="5" fill="#a5321f" opacity=".75"/>
    <!-- 사발 -->
    <g transform="translate(46 138)">
      <path d="M0 18C2 30 14 36 24 36C34 36 46 30 48 18Z" fill="#f2f0ea" stroke="#7d7768" stroke-width=".9"/>
      <ellipse cx="24" cy="18" rx="24" ry="5" fill="#e7e3d8" stroke="#7d7768" stroke-width=".9"/>
      <path d="M18 36h12v3H18z" fill="#d9d4c7" stroke="#7d7768" stroke-width=".7"/>
    </g>
  </g>
</svg>
