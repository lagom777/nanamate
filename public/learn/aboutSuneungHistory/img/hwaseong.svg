<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>수원 화성 장안문과 옹성 (조선 정조 · 벽돌과 거중기 사용)</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d1c0"/>
      <stop offset="1" stop-color="#9c9481"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8a86"/>
      <stop offset="1" stop-color="#5f5c58"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d636b"/>
      <stop offset="1" stop-color="#33373d"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8c7a"/>
      <stop offset="1" stop-color="#2d5c4f"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3523e"/>
      <stop offset="1" stop-color="#74291c"/>
    </linearGradient>
    <pattern id="stones" width="12" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 6.5h12M3 0v6.5M9 0v0" stroke="#7d7563" stroke-width=".6"/>
    </pattern>
    <pattern id="bricks" width="6" height="3" patternUnits="userSpaceOnUse">
      <path d="M0 2.8h6M1.5 0v2.8M4.5 0v0" stroke="#3f3d3a" stroke-width=".4"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <ellipse cx="100" cy="190" rx="94" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 양쪽 성벽과 벽돌 여장 -->
  <path d="M0 120H200V184H0Z" fill="url(#wall)"/>
  <path d="M0 120H200V184H0Z" fill="url(#stones)"/>
  <path d="M0 108H200V120H0Z" fill="url(#brick)"/>
  <path d="M0 108H200V120H0Z" fill="url(#bricks)"/>
  <g fill="#1d1f22"><rect x="8" y="112" width="4" height="4"/><rect x="24" y="112" width="4" height="4"/><rect x="40" y="112" width="4" height="4"/><rect x="156" y="112" width="4" height="4"/><rect x="172" y="112" width="4" height="4"/><rect x="188" y="112" width="4" height="4"/></g>
  <path d="M0 104h8v4H0zM16 104h12v4H16zM36 104h12v4H36zM152 104h12v4h-12zM172 104h12v4h-12zM192 104h8v4h-8z" fill="url(#brick)"/>
  <!-- 문루 2층 -->
  <rect x="56" y="70" width="88" height="32" fill="#e6d7b8"/>
  <g fill="url(#col)"><path d="M58 70h4v32h-4zM78 70h4v32h-4zM98 70h4v32h-4zM118 70h4v32h-4zM138 70h4v32h-4z"/></g>
  <rect x="52" y="64" width="96" height="6" fill="url(#green)" stroke="#1f3f36" stroke-width=".5"/>
  <path d="M30 60C50 64 74 64 100 64C126 64 150 64 170 60L164 66C144 68 124 68 100 68C76 68 56 68 36 66Z" fill="url(#green)" stroke="#1f3f36" stroke-width=".6"/>
  <path d="M30 60C50 62 74 62 100 62C126 62 150 62 170 60L148 44H52Z" fill="url(#roof)" stroke="#23262b" stroke-width=".8"/>
  <rect x="62" y="34" width="76" height="10" fill="#e6d7b8"/>
  <g fill="url(#col)"><path d="M64 34h3v10h-3zM98.5 34h3v10h-3zM133 34h3v10h-3z"/></g>
  <path d="M40 32C56 36 76 36 100 36C124 36 144 36 160 32L154 36C138 38 120 38 100 38C80 38 62 38 46 36Z" fill="url(#green)" stroke="#1f3f36" stroke-width=".6"/>
  <path d="M40 32C56 34 76 34 100 34C124 34 144 34 160 32L140 18H60Z" fill="url(#roof)" stroke="#23262b" stroke-width=".8"/>
  <path d="M66 18H134V14H66Z" fill="#2e3238"/>
  <path d="M30 60l-4-5M170 60l4-5M40 32l-4-5M160 32l4-5" stroke="#23262b" stroke-width="2" stroke-linecap="round"/>
  <!-- 성문 홍예 -->
  <path d="M50 102H150V184H50Z" fill="url(#wall)" stroke="#6b6450" stroke-width=".8"/>
  <path d="M50 102H150V184H50Z" fill="url(#stones)"/>
  <path d="M82 184V144A18 18 0 0 1 118 144V184Z" fill="#2a1d14" stroke="#6b6450" stroke-width="1.2"/>
  <path d="M86 184V145A14 14 0 0 1 114 145V184" fill="none" stroke="#8a5a35" stroke-width="2"/>
  <!-- 옹성: 문 앞을 반달처럼 감싼 벽 -->
  <path d="M30 184V152C30 140 60 132 100 132C140 132 170 140 170 152V184Z" fill="url(#wall)" stroke="#6b6450" stroke-width="1"/>
  <path d="M30 184V152C30 140 60 132 100 132C140 132 170 140 170 152V184Z" fill="url(#stones)"/>
  <path d="M30 152C30 140 60 132 100 132C140 132 170 140 170 152V144C170 132 140 124 100 124C60 124 30 132 30 144Z" fill="url(#brick)"/>
  <path d="M30 152C30 140 60 132 100 132C140 132 170 140 170 152V144C170 132 140 124 100 124C60 124 30 132 30 144Z" fill="url(#bricks)"/>
  <path d="M88 184V160A12 12 0 0 1 112 160V184Z" fill="#2a1d14" stroke="#6b6450"/>
  <path d="M30 144C30 132 60 124 100 124C140 124 170 132 170 144" fill="none" stroke="#e8e2d4" stroke-width=".8" opacity=".6"/>
</svg>
