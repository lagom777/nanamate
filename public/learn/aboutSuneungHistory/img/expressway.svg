<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>경부 고속 국도 (1970 개통 · 서울~부산 428km · 경제 개발 5개년 계획)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb0d8"/>
      <stop offset="1" stop-color="#e2eef6"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6f75"/>
      <stop offset="1" stop-color="#3d4146"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9a54"/>
      <stop offset="1" stop-color="#3f6b34"/>
    </linearGradient>
    <radialGradient id="vg" cx=".5" cy=".5" r=".5"><stop offset=".62" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="fade"><rect width="200" height="200" fill="url(#vg)"/></mask>
    <g id="car"><path d="M-12 0V-5L-8-11H8L12-5V0Z" fill="currentColor" stroke="#1d1f22" stroke-width=".7"/><path d="M-6-10H6L9-6H-9Z" fill="#cfe0ea"/><circle cx="-7" cy="0" r="2.6" fill="#1d1f22"/><circle cx="7" cy="0" r="2.6" fill="#1d1f22"/></g>
  </defs>
  <g mask="url(#fade)">
    <rect width="200" height="200" fill="url(#sky)"/>
    <!-- 산 -->
    <path d="M0 100L30 74L56 92L86 66L116 90L144 70L176 92L200 80V200H0Z" fill="#8fb27a"/>
    <path d="M0 116C40 100 70 112 100 104C130 96 160 108 200 98V200H0Z" fill="url(#hill)"/>
    <!-- 굽이도는 고속 도로 -->
    <path d="M60 200C80 160 92 140 98 120C102 108 104 102 106 96L114 96C114 102 116 108 118 120C124 140 140 160 170 200Z" fill="url(#road)"/>
    <path d="M114 200C112 160 110 140 109 120C108.6 108 109 102 110 96" fill="none" stroke="#f2d04a" stroke-width="1.6"/>
    <path d="M86 200C94 160 100 140 103 120M144 200C130 160 122 140 116 120" fill="none" stroke="#f5f5f2" stroke-width="1" stroke-dasharray="6 6"/>
    <!-- 차 -->
    <use href="#car" transform="translate(92 176)" style="color:#c43b2c"/>
    <use href="#car" transform="translate(130 160) scale(.7)" style="color:#e9e6dc"/>
    <use href="#car" transform="translate(106 128) scale(.42)" style="color:#2f5a8a"/>
  </g>
  <!-- 도로 표지판 -->
  <path d="M36 166V96" stroke="#7d8287" stroke-width="2.6"/>
  <rect x="8" y="54" width="66" height="50" rx="3" fill="#1f6b45" stroke="#f5f5f2" stroke-width="1.4"/>
  <g fill="#fff" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="800" text-anchor="middle">
    <text x="41" y="69" font-size="10">서울 ↔ 부산</text>
    <text x="41" y="84" font-size="11">428 km</text>
    <text x="41" y="98" font-size="8" fill="#ffe08a">1970 개통</text>
  </g>
</svg>
