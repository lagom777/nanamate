<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>조선어 학회와 『조선말 큰사전』 원고 (1942 조선어 학회 사건 · 1947 첫 권)</title>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f5a8a"/>
      <stop offset="1" stop-color="#173452"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c3d60"/>
      <stop offset="1" stop-color="#0f2236"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ead6"/>
      <stop offset="1" stop-color="#cdbf9c"/>
    </linearGradient>
    <pattern id="grid" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect x=".5" y=".5" width="6" height="6" fill="none" stroke="#c0503a" stroke-width=".45"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <ellipse cx="100" cy="186" rx="84" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 원고지 두 장 -->
  <g transform="rotate(-10 70 120)">
    <rect x="18" y="62" width="92" height="112" fill="#f6efdc" stroke="#a88f60" stroke-width=".8"/>
    <rect x="22" y="66" width="84" height="104" fill="url(#grid)"/>
  </g>
  <g transform="rotate(-3 76 118)">
    <rect x="26" y="60" width="92" height="114" fill="#fbf5e5" stroke="#a88f60" stroke-width=".8"/>
    <rect x="30" y="64" width="84" height="106" fill="url(#grid)"/>
    <g font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="5.6" fill="#24314a" font-weight="500">
      <text x="31.2" y="69.4">가</text><text x="38.2" y="69.4">갸</text><text x="45.2" y="69.4">거</text><text x="52.2" y="69.4">겨</text><text x="59.2" y="69.4">고</text><text x="66.2" y="69.4">교</text><text x="73.2" y="69.4">구</text>
      <text x="31.2" y="83.4">말</text><text x="38.2" y="83.4">모</text><text x="45.2" y="83.4">이</text>
      <text x="31.2" y="97.4">한</text><text x="38.2" y="97.4">글</text><text x="45.2" y="97.4">맞</text><text x="52.2" y="97.4">춤</text><text x="59.2" y="97.4">법</text>
      <text x="31.2" y="111.4">표</text><text x="38.2" y="111.4">준</text><text x="45.2" y="111.4">말</text>
    </g>
    <path d="M60 128c6-3 14 2 20-2M60 140c8-2 12 3 22 0M60 152c6-3 12 2 18 0" fill="none" stroke="#24314a" stroke-width=".9"/>
  </g>
  <!-- 세워 둔 큰사전 -->
  <g>
    <path d="M118 30H172V178H118Z" fill="url(#cover)" stroke="#0b1a2a" stroke-width="1"/>
    <path d="M112 34H118V182H112Z" fill="url(#spine)" stroke="#0b1a2a" stroke-width=".8"/>
    <path d="M172 30L176 34V182L172 178Z" fill="url(#pages)" stroke="#8a7a58" stroke-width=".6"/>
    <path d="M118 178H172L176 182H112Z" fill="url(#pages)" stroke="#8a7a58" stroke-width=".6"/>
    <rect x="124" y="40" width="42" height="64" fill="none" stroke="#d9b25a" stroke-width="1"/>
    <g font-family="'Noto Serif CJK KR','Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif" font-weight="800" fill="#f0d27a" text-anchor="middle">
      <text x="145" y="62" font-size="11">조선말</text>
      <text x="145" y="80" font-size="13">큰사전</text>
    </g>
    <text x="145" y="96" font-size="5.5" fill="#d9b25a" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">조선어 학회</text>
    <path d="M120 32V176" stroke="#5a86b8" stroke-width=".8" opacity=".6"/>
  </g>
</svg>
