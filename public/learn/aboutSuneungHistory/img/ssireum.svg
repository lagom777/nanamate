<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <title>김홍도 「씨름」 (조선 후기 풍속화 · 서민의 생활)</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c2"/>
      <stop offset="1" stop-color="#d9c294"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="aged"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="33"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .34  0 0 0 0 .18  0 0 0 1.5 -.85"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <!-- 구경꾼: 갓 쓴 사람 -->
    <g id="gat">
      <path d="M-9 14C-9 6-5 3 0 3C5 3 9 6 9 14Z" fill="#f4ecd9" stroke="#2a2016" stroke-width=".9"/>
      <circle cx="0" cy="-1" r="4" fill="#e8c9a2" stroke="#2a2016" stroke-width=".7"/>
      <ellipse cx="0" cy="-4" rx="8" ry="1.8" fill="#2a2016"/>
      <path d="M-3-4v-4h6v4" fill="#2a2016"/>
    </g>
    <!-- 구경꾼: 상투 튼 사람 -->
    <g id="top">
      <path d="M-9 14C-9 6-5 3 0 3C5 3 9 6 9 14Z" fill="#e9e1cc" stroke="#2a2016" stroke-width=".9"/>
      <circle cx="0" cy="-1" r="4" fill="#e8c9a2" stroke="#2a2016" stroke-width=".7"/>
      <path d="M-4-2C-4-6 4-6 4-2Z" fill="#2a2016"/><circle cx="0" cy="-6.4" r="1.6" fill="#2a2016"/>
    </g>
  </defs>
  <ellipse cx="100" cy="190" rx="86" ry="6" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- 화첩 한 면 -->
  <rect x="12" y="14" width="176" height="172" fill="url(#paper)" stroke="#8a7146" stroke-width="1.2"/>
  <rect x="12" y="14" width="176" height="172" fill="#000" filter="url(#aged)" opacity=".28"/>
  <rect x="18" y="20" width="164" height="160" fill="none" stroke="#a88f60" stroke-width=".8"/>
  <!-- 위쪽 구경꾼 무리 -->
  <use href="#gat" x="40" y="40"/><use href="#top" x="58" y="36"/><use href="#gat" x="76" y="38"/><use href="#gat" x="96" y="34"/><use href="#top" x="114" y="36"/><use href="#gat" x="132" y="38"/><use href="#gat" x="150" y="42"/>
  <use href="#top" x="48" y="56"/><use href="#gat" x="66" y="54"/><use href="#top" x="140" y="56"/><use href="#gat" x="158" y="60"/>
  <!-- 가운데: 서로 샅바를 잡고 맞붙은 두 씨름꾼 -->
  <g stroke="#2a2016" stroke-width="1" stroke-linejoin="round">
    <!-- 왼쪽 씨름꾼 -->
    <circle cx="86" cy="86" r="5.2" fill="#e8c9a2"/>
    <path d="M83 82C84 79 88 79 90 81" fill="none"/>
    <path d="M80 92C82 88 90 88 96 92L104 104L98 112L88 106Z" fill="#f4ecd9"/>
    <path d="M88 106L82 124L76 140L82 141L90 126L96 116Z" fill="#f4ecd9"/>
    <path d="M98 112L102 128L100 142L106 142L108 126L104 108Z" fill="#f4ecd9"/>
    <!-- 오른쪽 씨름꾼 -->
    <circle cx="114" cy="88" r="5.2" fill="#d9b48a"/>
    <path d="M120 94C118 90 110 90 104 94L98 104L102 112L112 108Z" fill="#ece3cd"/>
    <path d="M112 108L120 124L126 140L120 141L112 126L104 116Z" fill="#ece3cd"/>
    <!-- 맞잡은 팔 -->
    <path d="M92 96C98 100 104 104 108 102M108 98C102 102 96 104 92 102" fill="none" stroke-width="1.6"/>
    <path d="M94 108H108" stroke="#7a2f20" stroke-width="2.2"/>
  </g>
  <!-- 오른쪽 아래: 엿장수 소년 -->
  <g stroke="#2a2016" stroke-width=".9">
    <circle cx="160" cy="132" r="4.4" fill="#e8c9a2"/>
    <path d="M154 150C154 142 156 138 160 138C164 138 166 142 166 150Z" fill="#c9d6c4"/>
    <path d="M150 140H170V146H150Z" fill="#c49a5c"/>
    <g fill="#e0b04a" stroke-width=".5"><circle cx="154" cy="140" r="1.4"/><circle cx="158" cy="140" r="1.4"/><circle cx="162" cy="140" r="1.4"/><circle cx="166" cy="140" r="1.4"/></g>
  </g>
  <!-- 아래쪽 구경꾼 무리 -->
  <use href="#top" x="36" y="146"/><use href="#gat" x="54" y="150"/><use href="#gat" x="72" y="154"/><use href="#top" x="90" y="156"/><use href="#gat" x="110" y="156"/><use href="#top" x="128" y="154"/>
  <use href="#gat" x="30" y="122"/><use href="#top" x="44" y="108"/>
  <!-- 낙관 -->
  <rect x="166" y="24" width="10" height="10" fill="#b33a26" opacity=".85"/>
  <path d="M168 27h6M171 26v6M168 31h6" stroke="#f3e2c4" stroke-width=".8"/>
</svg>
