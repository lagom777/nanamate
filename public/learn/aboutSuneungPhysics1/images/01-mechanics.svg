<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0, 212, 255, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#1e293b" stroke="#00d4ff" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#00d4ff"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 물리학 핵심요약</text>
    <text x="145" y="20" fill="#00d4ff" font-size="12" font-weight="800">PART 01</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">고전역학 — 운동과 힘</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Newton's Laws, Kinematics &amp; Momentum</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#00d4ff" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#00d4ff" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#00d4ff" fill-opacity="0.2" stroke="#00d4ff" stroke-width="1"/>
          <text x="83" y="34" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">등가속도 운동 공식</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">등가속도 직선 운동 3대 공식</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="700">등가속도 운동 핵심 3공식</text>
                  <text x="12" y="47" fill="#ffffff" font-size="12" font-family="monospace">v = v₀ + at</text>
                  <text x="12" y="68" fill="#ffffff" font-size="12" font-family="monospace">s = v₀t + ½ at²</text>
                  <text x="12" y="87" fill="#fcd34d" font-size="12" font-family="monospace" font-weight="700">2as = v² - v₀² (시간 t 없을 때!)</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="124" fill="#34d399" font-size="12" font-weight="700">v-t 그래프 해석 (수능 킬러 도구)</text>
                  <text x="12" y="146" fill="#cbd5e1" font-size="11.5">기울기 = <tspan fill="#38bdf8" font-weight="700">가속도 a</tspan>  /  면적 = <tspan fill="#34d399" font-weight="700">이동거리 s</tspan></text>
                  <text x="12" y="168" fill="#cbd5e1" font-size="11.5">평균속도: v_avg = (v₀ + v) / 2 (등가속도 시)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#00d4ff" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#00d4ff" fill-opacity="0.2" stroke="#00d4ff" stroke-width="1"/>
          <text x="83" y="34" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">뉴턴 운동 법칙</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">F=ma 와 힘의 상호작용</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#00d4ff" font-size="12" font-weight="700">뉴턴 3대 운동 법칙</text>
                  <text x="12" y="45" fill="#e2e8f0" font-size="11">1법칙(관성): ∑F = 0 ⟹ v = 일정 (정지 or 등속)</text>
                  <text x="12" y="65" fill="#fef08a" font-size="12" font-weight="800" font-family="monospace">2법칙(가속도): F = ma  (a = F / m)</text>
                  <text x="12" y="85" fill="#e2e8f0" font-size="11">3법칙(작용·반작용): F_AB = - F_BA (동일 작용선)</text>

                  <rect x="0" y="105" width="280" height="87" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="128" fill="#f59e0b" font-size="12" font-weight="700">도르래 &amp; 연결된 물체 해법</text>
                  <text x="12" y="150" fill="#cbd5e1" font-size="11.5">전체 질량(m₁+m₂)으로 묶어 계의 a 먼저 계산</text>
                  <text x="12" y="170" fill="#e2e8f0" font-size="11">장력 T: 각 물체의 알짜힘 방정식에서 산출</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#00d4ff" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#00d4ff" fill-opacity="0.2" stroke="#00d4ff" stroke-width="1"/>
          <text x="83" y="34" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">운동량과 충격량</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">운동량 보존 법칙 &amp; 충격력</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#1e293b" stroke="#00d4ff" stroke-width="1.2"/>
                  <text x="12" y="24" fill="#7dd3fc" font-size="12" font-weight="700">충격량 I 와 운동량의 변화량 Δp</text>
                  <text x="12" y="48" fill="#ffffff" font-size="13" font-family="monospace" font-weight="700">I = F · Δt = Δp = m v - m v₀</text>
                  <text x="12" y="72" fill="#cbd5e1" font-size="11">F-t 그래프 면적 = 충격량 I</text>
                  <text x="12" y="86" fill="#fcd34d" font-size="10.5">충돌 시간 Δt 늘리면 평균 충격력 F 감소 (에어백)</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="126" fill="#f43f5e" font-size="12" font-weight="700">⚡ 운동량 보존 법칙 (외력=0 충돌)</text>
                  <text x="12" y="148" fill="#fca5a5" font-size="12" font-family="monospace" font-weight="700">m₁v₁ + m₂v₂ = m₁v₁' + m₂v₂'</text>
                  <text x="12" y="170" fill="#cbd5e1" font-size="11">완전 비탄성 충돌(합체): v' = (m₁v₁+m₂v₂)/(m₁+m₂)</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="123" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="101.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#등가속도운동3공식</text>
        
        <rect x="175" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="231.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#v-t그래프면적</text>
        
        <rect x="299" y="565" width="68" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="333.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#F=ma</text>
        
        <rect x="379" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="418.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#작용반작용</text>
        
        <rect x="470" y="565" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="542.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#충격량I=FΔt=Δp</text>
        
        <rect x="627" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="677.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#운동량보존법칙</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Physics Core Summary</text>
</svg>