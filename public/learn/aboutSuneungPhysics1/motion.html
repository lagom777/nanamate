<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>물리학Ⅰ 모션 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#09131F;--bg2:#0E1B2A;--line:#1F3349;--grid:rgba(130,170,210,.075);
  --text:#E6EDF5;--muted:#91A5BA;--dim:#5E738B;
  --u1:#F4B544;--u2:#4FD1E8;--u3:#FF7A8A;--acc:var(--u1);
  --fd:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --fb:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs:"Source Serif 4",Georgia,"Times New Roman",serif;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--fb);font-size:15px;line-height:1.6;padding-inline:clamp(16px,3vw,40px);padding-block:22px 56px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand h1{font-family:var(--fd);font-weight:400;font-size:clamp(28px,3.6vw,40px);line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand h1 span{color:var(--acc);transition:color .5s}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.units{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--fm);font-size:12px;letter-spacing:.02em;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:transparent;cursor:pointer;transition:all .3s}
.chip:hover{border-color:var(--c);color:var(--c)}
.chip[aria-current="true"]{color:var(--bg);background:var(--c);border-color:var(--c)}

.player{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg2)}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/calc(100%/32) calc(100%/18),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/calc(100%/32) calc(100%/18),
    radial-gradient(120% 100% at 25% 15%,#132740 0%,#0A1522 70%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .tag{position:absolute;left:14px;top:12px;font-family:var(--fm);font-size:11px;letter-spacing:.08em;color:var(--dim);pointer-events:none}

.panel{position:relative;border-left:1px solid var(--line);min-height:0}
.panel-in{position:absolute;inset:0;overflow:auto;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.06em;color:var(--acc);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow b{font-weight:500;border:1px solid currentColor;border-radius:4px;padding:0 6px}
.panel h2{font-family:var(--fd);font-weight:400;font-size:clamp(24px,2.3vw,31px);line-height:1.15;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:14px}
.fx-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.fx{display:flex;flex-direction:column;gap:1px;padding:9px 0;border-bottom:1px dashed var(--line)}
.fx .f{font-family:var(--fs);font-style:normal;font-size:20px;line-height:1.35;color:var(--text)}
.fx .f.word{font-family:var(--fb);font-size:15px;font-weight:600}
.fx .f i{font-style:italic;font-weight:500}
.fx .f sub,.fx .f sup{font-size:.62em;line-height:0}
.fx .f .u{font-family:var(--fb);font-size:.8em;color:var(--muted)}
.fx .n{font-size:12.5px;color:var(--muted)}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pts li{position:relative;padding-left:16px;font-size:14px;line-height:1.55}
.pts li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--acc)}
.pts li em{font-style:normal;color:var(--acc);font-weight:600}
.enter>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}
.enter>*:nth-child(4){animation-delay:.16s}.enter>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.bar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--acc)}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn svg{width:16px;height:16px;fill:currentColor}
.count{font-family:var(--fm);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px}
.tl{flex:1 1 320px;display:flex;gap:3px;align-items:center;min-width:0}
.seg{flex:1;height:22px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center}
.seg i{display:block;width:100%;height:5px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,transparent);overflow:hidden;transition:height .2s}
.seg i b{display:block;height:100%;width:0;background:var(--c)}
.seg:hover i,.seg[aria-current="true"] i{height:9px}
.seg.done i b{width:100%;opacity:.55}

.sum{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.sum-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.sum-head h2{font-family:var(--fd);font-weight:400;font-size:26px;margin:0}
.sum-head p{margin:0;color:var(--muted);font-size:13px}
.sum-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--bg2);display:flex;flex-direction:column;gap:4px}
.col h3{margin:0 0 6px;font-family:var(--fd);font-weight:400;font-size:20px;color:var(--c);display:flex;gap:8px;align-items:baseline}
.col h3 small{font-family:var(--fm);font-size:11px;color:var(--dim);letter-spacing:.05em}
.item{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.item button{all:unset;cursor:pointer;font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.item button:hover{color:var(--c)}
.item button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.item button span{font-family:var(--fm);font-size:11px;color:var(--dim);font-weight:400}
.item .fs{font-family:var(--fs);font-size:15.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}
.item .fs i{font-style:italic;color:var(--text)}
.item .fs sub,.item .fs sup{font-size:.62em;line-height:0}
.item .fs .u{font-family:var(--fb);font-size:.8em}
.item .fs .word{font-family:var(--fb);font-size:13px}
.brand .back{color:var(--acc);text-decoration:none}.brand .back:hover{text-decoration:underline}
.btn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.btn.sp{width:auto;min-width:38px;padding:0 9px;font-family:var(--fm);font-size:12px}
.bigbar{display:none}
.stage.big{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:60;aspect-ratio:auto;max-width:none;container-type:size}
.stage.big canvas{inset:auto;left:50%;top:50%;width:min(100cqw,177.78cqh);height:min(56.25cqw,100cqh);transform:translate(-50%,-50%)}
.stage.big .bigbar{display:flex;gap:8px;position:absolute;right:14px;bottom:14px}
.stage.big .bigbar .btn{background:rgba(10,21,34,.82)}
@media (orientation:portrait){.stage.big{width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}}

/* 장 노트에 끼워 넣을 때(?embed): 무대와 재생 막대만 */
.embed body{padding:0;background:transparent}
.embed .top,.embed .sum,.embed footer,.embed .panel,.embed #b-big,.embed #b-speed{display:none}
.embed .wrap{max-width:none;gap:0}
.embed .player{grid-template-columns:1fr;border-radius:12px}
.embed .bar{flex-wrap:nowrap;gap:6px;padding:8px 10px}
.embed .tl{flex:1 1 60px}
.embed .count{min-width:0}

footer{color:var(--dim);font-size:12px;font-family:var(--fm)}

@media (max-width:900px){
  .player{grid-template-columns:1fr}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .panel-in{position:static;padding:18px 18px 20px}
  .sum-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.enter>*{animation:none}}
</style>
<style>body{margin:0}</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>물리학Ⅰ <span>모션 노트</span></h1>
      <p><a class="back" href="index.html">← 수능 물리학Ⅰ 노트</a> · <a class="back" href="practice.html">📝 기출 풀어보기</a> · 23개 핵심 개념을 움직이는 그림으로</p>
    </div>
    <nav class="units" id="units" aria-label="단원"></nav>
  </header>

  <section class="player" aria-label="개념 플레이어">
    <div class="stage">
      <canvas id="cv" role="img" aria-label="개념 애니메이션"></canvas>
      <div class="bigbar">
        <button class="btn" id="g-prev" aria-label="이전 개념"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
        <button class="btn" id="g-next" aria-label="다음 개념"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
        <button class="btn" id="g-close" aria-label="크게 보기 닫기"><svg viewBox="0 0 16 16"><path d="M3.4 2 8 6.6 12.6 2 14 3.4 9.4 8l4.6 4.6-1.4 1.4L8 9.4 3.4 14 2 12.6 6.6 8 2 3.4z"/></svg></button>
      </div>
    </div>
    <div class="panel"><div class="panel-in" id="panel" aria-live="polite">
      <div class="eyebrow" id="p-eye"></div>
      <h2 id="p-title"></h2>
      <p class="lede" id="p-sub"></p>
      <div class="fx-list" id="p-fx"></div>
      <ul class="pts" id="p-pts"></ul>
    </div></div>
    <div class="bar">
      <button class="btn" id="b-prev" aria-label="이전 개념"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button class="btn main" id="b-play" aria-label="일시정지"><svg viewBox="0 0 16 16"><path id="play-ico" d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
      <button class="btn" id="b-next" aria-label="다음 개념"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
      <button class="btn" id="b-loop" aria-pressed="false" aria-label="이 장면 반복" title="이 장면 반복 (L)"><svg viewBox="0 0 16 16"><path d="M3 6V5a2 2 0 0 1 2-2h6V1l3 3-3 3V5H5v1zM13 10v1a2 2 0 0 1-2 2H5v2l-3-3 3-3v2h6v-1z"/></svg></button>
      <button class="btn sp" id="b-speed" aria-pressed="false" aria-label="느리게 (0.5배속)" title="느리게 (S)">½×</button>
      <button class="btn" id="b-big" aria-pressed="false" aria-label="크게 보기" title="크게 보기 (F)"><svg viewBox="0 0 16 16"><path d="M2 2h5v2H4v3H2zM9 2h5v5h-2V4H9zM2 9h2v3h3v2H2zM12 9h2v5H9v-2h3z"/></svg></button>
      <span class="count" id="count">01 / 24</span>
      <div class="tl" id="tl"></div>
    </div>
  </section>

  <section class="sum" aria-label="한눈에 정리">
    <div class="sum-head">
      <h2>한눈에 정리</h2>
      <p>개념 이름을 누르면 위 플레이어가 그 장면으로 이동합니다 · 키보드 ← → 이동, Space 재생/정지, L 반복, S 느리게, F 크게 보기</p>
    </div>
    <div class="sum-grid" id="sum"></div>
  </section>
  <footer>2015 개정 교육과정 물리학Ⅰ 범위 기준 · 그림 속 수치는 개념 설명용 예시값</footer>
</div>

<script>
/* ───────── 공통 도구 ───────── */
const W=960,H=540,TAU=Math.PI*2;
const C={u1:'#F4B544',u2:'#4FD1E8',u3:'#FF7A8A',text:'#E6EDF5',muted:'#91A5BA',dim:'#5E738B',line:'#27405C',panel:'#0E1B2A',
  el:'#6EA8FF',pos:'#FF6B6B',neu:'#AAB6C4',hot:'#FF9A4D',green:'#7BE07F'};
const SANS='"IBM Plex Sans KR",system-ui,sans-serif',MONO='"IBM Plex Mono",Menlo,monospace',SERIF='"Source Serif 4",Georgia,serif',DISP='"Black Han Sans","IBM Plex Sans KR",sans-serif';
const UNITS=[{k:'Ⅰ',name:'역학과 에너지',c:C.u1},{k:'Ⅱ',name:'물질과 전자기장',c:C.u2},{k:'Ⅲ',name:'파동과 정보통신',c:C.u3}];
const S=[];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>{k=clamp(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

function fm(s){
  return s.split('`').map((p,i)=>i%2?`<span class="u">${p}</span>`:
    p.replace(/(sin|max|eV)|([A-Za-zθλΦ]+)|_\{([^}]*)\}|_(\S)|\^\{([^}]*)\}|\^(\S)/g,(m,up,w,b1,b2,p1,p2)=>{
      if(up)return up;
      if(w)return `<i>${w}</i>`;
      if(b1!=null||b2!=null)return `<sub>${fm(b1??b2)}</sub>`;
      return `<sup>${fm(p1??p2)}</sup>`;
    })).join('');
}
function T(c,s,x,y,o={}){c.save();c.font=`${o.it?'italic ':''}${o.w||500} ${o.size||18}px ${o.font||SANS}`;c.fillStyle=o.color||C.text;
  c.textAlign=o.align||'left';c.textBaseline=o.base||'middle';if(o.alpha!=null)c.globalAlpha*=o.alpha;c.fillText(s,x,y);c.restore();}
function arrow(c,x1,y1,x2,y2,col,w=3,hd=11){const L=Math.hypot(x2-x1,y2-y1);if(L<2)return;const a=Math.atan2(y2-y1,x2-x1);hd=Math.min(hd,L*.6);
  c.save();c.strokeStyle=c.fillStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-Math.cos(a)*hd*.7,y2-Math.sin(a)*hd*.7);c.stroke();
  c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-hd*Math.cos(a-.42),y2-hd*Math.sin(a-.42));c.lineTo(x2-hd*Math.cos(a+.42),y2-hd*Math.sin(a+.42));c.closePath();c.fill();c.restore();}
function poly(c,pts,col,w=2,o={}){if(pts.length<2)return;c.save();c.strokeStyle=col;c.lineWidth=w;c.lineJoin=c.lineCap='round';if(o.dash)c.setLineDash(o.dash);
  if(o.alpha!=null)c.globalAlpha*=o.alpha;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(o.close)c.closePath();
  if(o.fill){c.fillStyle=o.fill;c.fill();}if(col)c.stroke();c.restore();}
function dot(c,x,y,r,fill,o={}){c.save();if(o.glow){c.shadowColor=o.gc||fill;c.shadowBlur=o.glow;}if(o.alpha!=null)c.globalAlpha*=o.alpha;
  c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);if(fill){c.fillStyle=fill;c.fill();}if(o.stroke){c.strokeStyle=o.stroke;c.lineWidth=o.lw||2;if(o.dash)c.setLineDash(o.dash);c.stroke();}c.restore();}
function box(c,x,y,w,h,r,fill,stroke,lw=2,o={}){c.save();if(o.alpha!=null)c.globalAlpha*=o.alpha;if(o.glow){c.shadowColor=o.gc||fill||stroke;c.shadowBlur=o.glow;}
  c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke();}c.restore();}
function axes(c,x0,y0,w,h,xl,yl,col=C.dim){arrow(c,x0,y0,x0+w,y0,col,1.5,8);arrow(c,x0,y0,x0,y0-h,col,1.5,8);
  T(c,xl,x0+w,y0+17,{size:16,color:C.muted,font:SERIF,it:true,align:'right'});T(c,yl,x0+9,y0-h+4,{size:16,color:C.muted,font:SERIF,it:true});}
function wavy(c,x1,y1,x2,y2,col,lam=16,amp=6,ph=0,w=2.5){const L=Math.hypot(x2-x1,y2-y1);if(L<14)return;const a=Math.atan2(y2-y1,x2-x1);
  c.save();c.translate(x1,y1);c.rotate(a);c.strokeStyle=c.fillStyle=col;c.lineWidth=w;c.beginPath();
  for(let s=0;s<=L-10;s+=1.5){const y=Math.sin(s/lam*TAU-ph)*amp*Math.min(1,s/12,(L-10-s)/12);s?c.lineTo(s,y):c.moveTo(s,y);}c.stroke();
  c.beginPath();c.moveTo(L,0);c.lineTo(L-12,-6);c.lineTo(L-12,6);c.closePath();c.fill();c.restore();}
function wl2rgb(l){if(l<380)return '#A58CFF';if(l>780)return '#B4453A';let r=0,g=0,b=0;
  if(l<440){r=-(l-440)/60;b=1}else if(l<490){g=(l-440)/50;b=1}else if(l<510){g=1;b=-(l-510)/20}else if(l<580){r=(l-510)/70;g=1}else if(l<645){r=1;g=-(l-645)/65}else{r=1}
  const f=l<420?.35+.65*(l-380)/40:l>700?.35+.65*(780-l)/80:1;const q=v=>Math.round(255*Math.pow(v*f,.8));return `rgb(${q(r)},${q(g)},${q(b)})`;}
function label(c,s,x,y,col,o={}){T(c,s,x,y,{size:o.size||15,color:col||C.muted,font:o.font||MONO,align:o.align||'center',w:o.w||500,alpha:o.alpha});}

/* ───────── 0. 인트로 ───────── */
S.push({u:-1,ch:'시작',title:'수능 물리학Ⅰ, 움직이며 정리하기',
  sub:'세 단원, 스물세 개 개념. 각 장면은 수능에 그대로 나오는 그림과 그래프를 움직여서 보여 줍니다.',
  fx:[{w:1,f:'Ⅰ 역학과 에너지',n:'힘과 운동 · 에너지와 열 · 시간과 공간'},
      {w:1,f:'Ⅱ 물질과 전자기장',n:'물질의 구조와 성질 · 물질의 자기적 성질'},
      {w:1,f:'Ⅲ 파동과 정보통신',n:'파동의 성질과 활용 · 빛과 물질의 이중성'}],
  pts:['장면마다 <em>그래프의 기울기와 넓이</em>, 보존되는 양, 방향 규칙을 먼저 보세요. 수능 문항 대부분이 이 셋을 묻습니다.',
       '재생 중에는 약 15초마다 다음 개념으로 넘어갑니다. 아래 막대를 눌러 원하는 개념으로 바로 이동할 수 있어요.',
       '페이지 아래 <em>한눈에 정리</em>에 모든 공식이 단원별로 모여 있습니다.'],
  dur:14,still:4,
  draw(c,t){
    label(c,'3 UNITS · 23 CONCEPTS',480,52,C.dim,{size:14});

function M(c,s,x,y,o={}){ // 캔버스용 수식: _아래첨자 ^위첨자
  const size=o.size||18,parts=[];let i=0;
  while(i<s.length){const ch=s[i];
    if((ch==='_'||ch==='^')&&i+1<s.length){let txt;if(s[i+1]==='{'){const j=s.indexOf('}',i);txt=s.slice(i+2,j);i=j+1}else{txt=s[i+1];i+=2}parts.push({t:txt,k:ch});}
    else{let j=i;while(j<s.length&&s[j]!=='_'&&s[j]!=='^')j++;parts.push({t:s.slice(i,j),k:''});i=j;}}
  c.save();c.fillStyle=o.color||C.text;c.textBaseline='middle';if(o.alpha!=null)c.globalAlpha*=o.alpha;
  const fnt=k=>`italic 500 ${k?size*.64:size}px ${SERIF}`;let w=0;
  parts.forEach(p=>{c.font=fnt(p.k);p.w=c.measureText(p.t).width;w+=p.w;});
  let cx=o.align==='center'?x-w/2:o.align==='right'?x-w:x;
  parts.forEach(p=>{c.font=fnt(p.k);c.fillText(p.t,cx,y+(p.k==='_'?size*.3:p.k==='^'?-size*.36:0));cx+=p.w;});
  c.restore();return w;}

/* ───────── Ⅰ-1 등가속도 직선 운동 ───────── */
S.push({u:0,ch:'힘과 운동',title:'등가속도 직선 운동',file:'01-forces.html',

    for(let k=0;k<=5&&k<=tau+1e-6;k++){const x=X0+s(k)*px;dot(c,x,TY-12,11,null,{stroke:C.u1,lw:1.5,alpha:.45});label(c,k+'s',x,TY-38,C.dim,{size:11});
      if(k>0){const xa=X0+s(k-1)*px;poly(c,[[xa+4,TY+46],[x-4,TY+46]],C.u1,2,{alpha:.7});label(c,(s(k)-s(k-1))+' m',(xa+x)/2,TY+62,C.u1,{size:13});}}
    if(tau>=2.2)label(c,'구간 변위가 2 m씩 증가  →  aT² 일정',480,TY+92,C.text,{size:14,alpha:seg(tau,2.2,2.8)});
    const bx=X0+s(tau)*px;dot(c,bx,TY-12,11,C.u1,{glow:20});arrow(c,bx+14,TY-12,bx+14+v*6,TY-12,C.text,3,10);

    const Q=(q)=>[g2.x+q*g2.tx,g2.y-s(q)*g2.sy],pts=[];for(let q=0;q<=tau;q+=.05)pts.push(Q(q));pts.push(Q(tau));
    poly(c,pts,C.u1,3);const [qx,qy]=Q(tau),sl=v*g2.sy/g2.tx;
    poly(c,[[qx-50,qy+50*sl],[qx+50,qy-50*sl]],C.text,1.5,{dash:[5,4]});dot(c,qx,qy,5,C.u1);

  pts:['<em>관성 법칙</em>: 알짜힘이 0이면 정지해 있거나 등속 직선 운동을 계속합니다.','실의 장력은 같은 크기 T로 A는 운동 방향으로, B는 운동 반대쪽(위)으로 당깁니다. 그래서 전체를 한 덩어리로 볼 때는 서로 상쇄됩니다.','<em>작용 반작용</em>은 서로 다른 두 물체에, <em>힘의 평형</em>은 한 물체에 작용합니다.','그림에서 A의 중력과 수직 항력은 힘의 평형, 실이 A를 당기는 힘과 A가 실을 당기는 힘은 작용 반작용입니다.'],

S.push({u:0,ch:'힘과 운동',title:'운동량과 충격량',file:'01-forces.html',

  fx:[{f:'p = mv',n:'운동량 · 방향이 있는 양'},{f:'I = FΔt = Δp',n:'충격량 = 운동량의 변화량'},{f:"m_Av_A + m_Bv_B = m_Av_A' + m_Bv_B'",n:'운동량 보존 (외력이 없을 때)'}],
  pts:['<em>F–t 그래프 아래 넓이</em>가 충격량입니다.','충격량이 같다면 충돌 시간이 길수록 평균 힘이 작습니다. 에어백, 착지할 때 무릎을 굽히는 동작이 이 원리입니다.','충돌하는 동안 두 물체가 받는 충격량은 크기가 같고 방향이 반대입니다.','그림은 탄성 충돌이라 운동 에너지도 9 J 그대로입니다. 같은 충돌에서 두 수레가 붙어 버리면(완전 비탄성) 둘 다 2 m/s, 운동 에너지는 9 J → 6 J로 줄지만 운동량 6은 그대로입니다.','운동량 보존 문제는 부호(방향)를 먼저 정하고 식을 세웁니다.'],

    const near=Math.abs(tau-tc);if(near<.3){const k=1-near/.3;dot(c,470,TY-42,26*k+6,'rgba(255,255,255,.12)',{alpha:k});

    label(c,'운동 에너지 9 J → 1 + 8 = 9 J (탄성 충돌)',B0,BY+178,C.muted,{size:15,align:'left'});

  fx:[{f:'E = hf',n:'광자 한 개의 에너지'},{f:'E_{k,max} = hf − W',n:'방출된 전자의 최대 운동 에너지'},{f:'W = hf_0',n:'일함수 · f₀: 문턱 진동수'}],
  pts:['f < f₀이면 빛의 세기와 상관없이 광전자가 <em>나오지 않습니다</em>.','f > f₀이면 빛을 비추는 즉시 방출됩니다. <em>진동수가 클수록</em> 최대 운동 에너지가 크고, <em>세기가 클수록</em> 광전자 수가 많습니다.','광전 효과는 빛의 <em>입자성</em>(광자)을 보여 줍니다.','활용: 디지털카메라의 <em>전하 결합 소자(CCD)</em>, 광센서, 태양 전지'],
  dur:16,still:5,
  draw(c,t){
    const cur=PE[Math.floor(t/3.6)%4],f0=5,LX=130,LY=90;
    box(c,70,390,400,34,4,'#46566A',C.muted,1.5);label(c,'금속판 (일함수 W = hf₀)',270,444,C.muted,{size:12});
    box(c,LX-34,LY-22,68,44,8,'#1A2C42',C.muted,1.5);dot(c,LX+34,LY,8,wl2rgb(cur[2]),{glow:20});
    // 색마다 3.6초: 앞 1.8초는 광자 0.225초마다(세기 ×1), 뒤 1.8초는 0.075초마다(세기 ×3). 칸 i 하나가 0.075초, 48칸이 한 색.
    const DT=.075,strong=(t%3.6)>=1.8;
    for(let i=Math.max(0,Math.floor((t-2.4)/DT));i<=Math.floor(t/DT);i++){if(i%48<24&&i%3)continue;const tb=i*DT,age=t-tb,sp=PE[Math.floor(i/48)%4],col=wl2rgb(sp[2]);
      const tx=180+rnd(i)*260,ty=388,ax=LX+40,ay=LY+10,fl=.7;
      if(age<fl){const q=age/fl,x=lerp(ax,tx,q),y=lerp(ay,ty,q),dx=(tx-ax),dy=(ty-ay),L=Math.hypot(dx,dy);wavy(c,x-dx/L*34,y-dy/L*34,x,y,col,Math.max(6,sp[2]/45),5,t*20,2);}
      else if(sp[1]>f0&&age<fl+1.6){const q=age-fl,ek=.414*(sp[1]-f0),v=120+300*Math.sqrt(ek),ang=-Math.PI/2+(rnd(i+5)-.5)*1.2;
        const x=tx+Math.cos(ang)*v*q,y=ty+Math.sin(ang)*v*q;if(y>30)dot(c,x,y,5,C.el,{glow:8});}}
    const emit=cur[1]>f0;
    T(c,emit?'전자 방출':'방출 없음',270,500,{font:DISP,size:24,align:'center',color:emit?C.el:C.muted,w:400});
    label(c,`${cur[0]}  f = ${cur[1]}×10¹⁴ Hz`,LX+60,LY-40,wl2rgb(cur[2]),{size:14,align:'left'});
    label(c,strong?'빛의 세기 ×3':'빛의 세기 ×1',LX+60,LY-14,strong?C.text:C.muted,{size:15,align:'left'});
    if(strong)label(c,emit?'세기 3배 → 전자 수만 3배, 속력은 그대로':'세기 3배여도 방출 없음',270,470,C.text,{size:15});
    // 그래프
    const g={x:580,y:460,w:330,h:280},fx=f=>g.x+f*34,ey=e=>g.y-e*150;
    axes(c,g.x,g.y,g.w,g.h,'f','');M(c,'E_k',g.x+9,g.y-g.h+4,{size:16,color:C.muted});label(c,'최대 운동 에너지 (eV)',g.x+10,g.y-g.h-14,C.muted,{size:12,align:'left'});
    poly(c,[[fx(f0),ey(0)],[fx(9.2),ey(.414*4.2)]],C.u3,3);
    poly(c,[[fx(f0),g.y-4],[fx(f0),g.y+4]],C.text,2);M(c,'f_0',fx(f0),g.y+20,{size:17,align:'center'});
    label(c,'기울기 = h (금속 종류와 무관)',g.x+20,g.y-g.h+40,C.muted,{size:13,align:'left'});
    PE.forEach(p=>{const e=Math.max(0,.414*(p[1]-f0)),on=p===cur;dot(c,fx(p[1]),ey(e),on?8:4,wl2rgb(p[2]),{glow:on?14:0,alpha:on?1:.5});});
    if(emit)label(c,`Ek,max = ${(.414*(cur[1]-f0)).toFixed(2)} eV`,fx(cur[1])-14,ey(.414*(cur[1]-f0))-24,C.text,{size:13,align:'right'});
    else label(c,'f < f₀ : 0',fx(cur[1]),g.y-22,C.muted,{size:12});
  }});

/* ───────── Ⅲ-6 물질파 ───────── */
const MW={hits:null};
S.push({u:2,ch:'빛과 물질의 이중성',title:'물질파와 전자 현미경',file:'07-duality.html',
  sub:'전자를 하나씩 이중 슬릿으로 보내도 스크린에는 점차 간섭 무늬가 쌓입니다. 입자인 전자도 파동의 성질을 가진다는 증거입니다.',
  fx:[{f:'λ = h/p = h/mv',n:'드브로이 파장 (물질파)'},{f:'p = √(2mE_k)',n:'운동 에너지로 운동량 구하기'}],
  pts:['빛과 물질 모두 <em>파동–입자 이중성</em>을 가집니다. 전자 회절(데이비슨·거머 실험)이 물질파의 증거입니다.','운동량이 클수록 물질파 파장이 짧습니다.','<em>전자 현미경</em>: 전자의 파장이 가시광선보다 훨씬 짧아 분해능이 높습니다. 전자의 속력을 키우면 파장이 짧아져 더 선명해집니다.','자기렌즈로 전자선을 모읍니다. 투과 전자 현미경(TEM)은 얇은 시료의 내부를, 주사 전자 현미경(SEM)은 표면의 입체 모습을 봅니다.'],
  dur:16,still:9,
  draw(c,t){
    if(!MW.hits){MW.hits=[];let s=1;while(MW.hits.length<700){const y=(rnd(s++)-.5)*2,I=Math.cos(y*9.5)**2*Math.exp(-y*y*1.6);if(rnd(s++)<I)MW.hits.push(y);}}
    const GX=90,GY=270,BX=380,SX=820,sy=[246,294],N=Math.min(MW.hits.length,Math.floor(t/.022));
    box(c,GX-50,GY-22,60,44,6,'#1A2C42',C.muted,1.5);label(c,'전자총',GX-20,GY+38,C.dim,{size:12});
    poly(c,[[BX,60],[BX,sy[0]-9]],C.muted,6);poly(c,[[BX,sy[0]+9],[BX,sy[1]-9]],C.muted,6);poly(c,[[BX,sy[1]+9],[BX,480]],C.muted,6);
    for(let k=0;k<5;k++){const r=((t*90)+k*44)%220;sy.forEach(y=>{c.save();c.beginPath();c.arc(BX,y,r,-1.2,1.2);c.strokeStyle=C.u3;c.globalAlpha=.25*(1-r/220);c.lineWidth=1.5;c.stroke();c.restore();});}
    box(c,SX-4,60,8,420,3,'#1A2C42',C.line,1);
    // 날아가는 전자는 슬릿판 앞에서 사라진다(파동으로 두 슬릿을 함께 지남). 어느 슬릿으로 갔는지는 그리지 않고, 스크린에 점 하나로만 찍힌다.
    for(let j=N;j<N+21;j++){if(j%3)continue;const age=t-(j*.022-.45);if(age<0||age>.3)continue;const u=age/.3;
      dot(c,lerp(GX+10,BX-16,u),GY,3.5,C.el,{glow:8,alpha:1-seg(u,.6,1)});}
    if(N>0&&N<MW.hits.length)dot(c,SX,GY+MW.hits[N-1]*190,5,'#fff',{glow:12,alpha:.85});
    label(c,'두 슬릿을 함께 지나며 파동처럼 퍼짐',BX+14,40,C.u3,{size:13,align:'left'});
    const bins=new Array(42).fill(0);
    for(let j=0;j<N;j++){const y=GY+MW.hits[j]*190;dot(c,SX+(rnd(j+3000)-.5)*6,y,1.8,'#BFD6FF');bins[clamp(Math.floor((y-60)/10),0,41)]++;}
    const mx=Math.max(8,...bins);bins.forEach((b,i)=>box(c,SX+14,60+i*10+1,b/mx*90,8,2,C.u3,null,0,{alpha:.8}));
    label(c,'도착한 전자 '+N+'개',SX+14,500,C.muted,{size:12,align:'left'});
    M(c,'λ = h / mv',60,60,{size:28,color:C.u3});
    label(c,'전자를 하나씩 보내도 간섭 무늬가 쌓인다',60,470,C.text,{size:14,align:'left'});label(c,'→ 전자의 파동성',60,496,C.u3,{size:14,align:'left'});
  }});

/* ───────── 플레이어 ───────── */
const Q=new URLSearchParams(location.search); // ?embed&only=5,6,7 — 장 노트 안에 그 장 장면만
if(Q.has('embed')){document.documentElement.classList.add('embed');const only=(Q.get('only')||'').split(',').filter(Boolean).map(Number).filter(i=>Number.isInteger(i)&&S[i]);
  if(only.length){const keep=only.map(i=>S[i]);S.length=0;S.push(...keep);}}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let idx=0,t=0,playing=!reduce,last=null;
function resize(){const d=Math.min(2,devicePixelRatio||1);cv.width=Math.max(1,Math.round(cv.clientWidth*d));cv.height=Math.max(1,Math.round(cv.clientHeight*d));}
new ResizeObserver(resize).observe(cv);resize();
const uc=s=>s.u<0?C.u1:UNITS[s.u].c;
const cnt=[0,0,0];S.forEach(s=>{if(s.u>=0)s.no=++cnt[s.u];});
const fxHTML=x=>x.w?`<span class="f word">${x.f}</span>`:`<span class="f">${fm(x.f)}</span>`;

const tl=$('tl');
S.forEach((s,i)=>{const b=document.createElement('button');b.className='seg';b.style.setProperty('--c',uc(s));b.title=`${i+1}. ${s.title}`;
  b.setAttribute('aria-label',`${i+1}번째 개념: ${s.title}`);b.innerHTML='<i><b></b></i>';b.onclick=()=>go(i);tl.appendChild(b);});
UNITS.forEach((u,k)=>{const b=document.createElement('button');b.className='chip';b.dataset.u=k;b.style.setProperty('--c',u.c);b.textContent=`${u.k} ${u.name}`;
  b.onclick=()=>go(S.findIndex(s=>s.u===k));$('units').appendChild(b);});

function render(){
  const s=S[idx];document.documentElement.style.setProperty('--acc',uc(s));
  $('p-eye').innerHTML=s.u<0?'<b>INTRO</b> 물리학Ⅰ 전체 지도':`<b>${UNITS[s.u].k}-${s.no}</b> ${UNITS[s.u].name} · ${s.ch}`;
  $('p-title').textContent=s.title;$('p-sub').textContent=s.sub;
  $('p-fx').innerHTML=s.fx.map(x=>`<div class="fx">${fxHTML(x)}<span class="n">${x.n}</span></div>`).join('');
  $('p-pts').innerHTML=s.pts.map(p=>`<li>${p}</li>`).join('');
  const pn=$('panel');pn.classList.remove('enter');void pn.offsetWidth;pn.classList.add('enter');pn.scrollTop=0;
  $('count').textContent=String(idx+1).padStart(2,'0')+' / '+S.length;
  [...tl.children].forEach((b,i)=>{b.classList.toggle('done',i<idx);b.setAttribute('aria-current',i===idx);b.querySelector('b').style.width='';});
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-current',+b.dataset.u===s.u));
  cv.setAttribute('aria-label',s.title+' 애니메이션');
  try{history.replaceState(null,'','#s'+idx)}catch(e){}
}
function go(i,start){idx=(i+S.length)%S.length;t=start??(playing?0:(S[idx].still??2));render();}
function setPlay(p){playing=p;$('b-play').setAttribute('aria-label',p?'일시정지':'재생');$('play-ico').setAttribute('d',p?'M4 2h3v12H4zM9 2h3v12H9z':'M4 2v12l10-6z');}
$('b-play').onclick=()=>setPlay(!playing);$('b-prev').onclick=()=>go(idx-1);$('b-next').onclick=()=>go(idx+1);cv.onclick=()=>setPlay(!playing);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight')go(idx+1);else if(e.key==='ArrowLeft')go(idx-1);
  else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();setPlay(!playing);}
  else if(e.key==='l'||e.key==='L')setLoop(!loop);else if(e.key==='s'||e.key==='S')setSpeed(speed===1?.5:1);
  else if(e.key==='f'||e.key==='F')setBig(!stage.classList.contains('big'));else if(e.key==='Escape')setBig(false);});
let loop=false,speed=1;const stage=document.querySelector('.stage');
function setLoop(v){loop=v;$('b-loop').setAttribute('aria-pressed',v);}
function setSpeed(v){speed=v;$('b-speed').setAttribute('aria-pressed',v!==1);}
function setBig(v){stage.classList.toggle('big',v);$('b-big').setAttribute('aria-pressed',v);document.body.style.overflow=v?'hidden':'';resize();}
$('b-loop').onclick=()=>setLoop(!loop);$('b-speed').onclick=()=>setSpeed(speed===1?.5:1);$('b-big').onclick=()=>setBig(!stage.classList.contains('big'));
$('g-prev').onclick=()=>go(idx-1);$('g-next').onclick=()=>go(idx+1);$('g-close').onclick=()=>setBig(false);

UNITS.forEach((u,k)=>{const col=document.createElement('div');col.className='col';col.style.setProperty('--c',u.c);
  col.innerHTML=`<h3>${u.k} ${u.name}<small>${cnt[k]} CONCEPTS</small></h3>`+S.map((s,i)=>s.u!==k?'':
    `<div class="item"><button data-i="${i}">${s.title}<span>${u.k}-${s.no}</span></button><div class="fs">${s.fx.map(x=>x.w?`<span class="word">${x.f}</span>`:`<span>${fm(x.f)}</span>`).join('')}</div></div>`).join('');
  $('sum').appendChild(col);});
$('sum').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;go(+b.dataset.i);
  document.querySelector('.player').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});});

function frame(now){
  const dt=last==null?0:Math.min(.05,(now-last)/1000);last=now;
  if(playing){t+=dt*speed;if(t>=S[idx].dur){if(loop)t=0;else go(idx+1);}}
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.clearRect(0,0,W,H);
  try{S[idx].draw(ctx,t);}catch(err){console.error(err);}
  const b=tl.children[idx].querySelector('b');b.style.width=(clamp(t/S[idx].dur)*100)+'%';
  requestAnimationFrame(frame);
}
const hm=location.hash.match(/^#s(\d+)$/);setPlay(playing);go(hm?Math.min(+hm[1],S.length-1):0,S[hm?Math.min(+hm[1],S.length-1):0].still);
requestAnimationFrame(frame);
</script>
