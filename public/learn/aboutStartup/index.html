<div class="scene-3d" id="intro-scene"></div><span class="interact-hint">🚀 인터랙티브 3D 시각화</span>
<h2>소개</h2><p>이 사이트에서는 창업의 핵심 개념을 9개 챕터에 걸쳐 3D 인터랙티브로 학습합니다.</p></main></div>
<script>
(function(){
  const c=document.getElementById('intro-scene');if(!c)return;const s=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(50,c.clientWidth/c.clientHeight,0.1,1000);cam.position.set(0,0,7);cam.lookAt(0,0,0);
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setSize(c.clientWidth,c.clientHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));c.appendChild(r.domElement);
  const C=16486972;const body=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.6,16),new THREE.MeshBasicMaterial({color:C}));s.add(body);const nose=new THREE.Mesh(new THREE.ConeGeometry(0.4,0.8,16),new THREE.MeshBasicMaterial({color:C}));nose.position.y=1.2;s.add(nose);const tr=[];for(let i=0;i<24;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.08+Math.random()*0.08,6,6),new THREE.MeshBasicMaterial({color:0xffaa33,transparent:true,opacity:0.7}));m.position.set((Math.random()-0.5)*0.4,-1-Math.random()*2,(Math.random()-0.5)*0.4);s.add(m);tr.push(m);}
  let md=false,px=0,py=0;c.addEventListener('mousedown',e=>{md=true;px=e.clientX;py=e.clientY;});window.addEventListener('mouseup',()=>md=false);c.addEventListener('mousemove',e=>{if(md){s.rotation.y+=(e.clientX-px)*0.005;s.rotation.x+=(e.clientY-py)*0.005;px=e.clientX;py=e.clientY;}});
  let T=0;function a(){requestAnimationFrame(a);T+=0.016;tr.forEach(p=>{p.position.y-=0.06;if(p.position.y<-3)p.position.y=-1;});s.rotation.y+=0.01;r.render(s,cam);}a();
  window.addEventListener('resize',()=>{cam.aspect=c.clientWidth/c.clientHeight;cam.updateProjectionMatrix();r.setSize(c.clientWidth,c.clientHeight);});
})();
</script>
