<svg xmlns="http://www.w3.org/2000/svg" data-n="3" data-t="1" data-c="#7c3aed" viewBox="0 0 560 300" role="img" aria-label="줄에 매달아 공중에 걸고, 진행하던 일도 잠시 중단한다">
<defs>
<linearGradient id="suspend_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1ecff"/><stop offset="1" stop-color="#ddd3f7"/></linearGradient>
<linearGradient id="suspend_floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b6e0"/><stop offset="1" stop-color="#a28fc4"/></linearGradient>
<radialGradient id="suspend_ball" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffb8a0"/><stop offset="1" stop-color="#e5483a"/></radialGradient>
<clipPath id="suspend_clip"><rect width="560" height="300" rx="14"/></clipPath>
</defs>
<g clip-path="url(#suspend_clip)">
<rect width="560" height="300" fill="url(#suspend_bg)"/>
<rect x="0" y="250" width="560" height="50" fill="url(#suspend_floor)"/><path d="M0 250H560" stroke="#7d6aa6" stroke-width="3"/>
<rect x="100" y="30" width="360" height="14" rx="6" fill="#6b7280"/>
<g class="vs" data-s="1" data-e="1"><g transform="translate(280 246)"><ellipse cx="0" cy="4" rx="40" ry="6" fill="#000" fill-opacity=".2"/><circle cx="0" cy="-34" r="34" fill="url(#suspend_ball)"/><circle cx="-12" cy="-46" r="9" fill="#fff" fill-opacity=".5"/></g></g>
<g class="mv" data-s="2" style="--from:translateY(180px);--d:1.1s;--ease:cubic-bezier(.4,0,.3,1)"><g transform="translate(280 130)"><path d="M0 -86V-34" stroke="#374151" stroke-width="3.4"/><circle cx="0" cy="0" r="34" fill="url(#suspend_ball)"/><circle cx="-12" cy="-12" r="9" fill="#fff" fill-opacity=".5"/><rect x="-6" y="-42" width="12" height="10" rx="3" fill="#6b7280"/></g></g>
<g class="vs" data-s="2" data-e="2" style="--dl:.3s"><g class="a-bob" style="animation-duration:.6s"><g fill="#fff" fill-opacity=".8"><circle cx="280" cy="206" r="4"/></g></g></g>
<g class="vs up" data-s="3"><g transform="translate(120 130)"><circle r="46" fill="#fff" stroke="#6b7280" stroke-width="5"/><rect x="-14" y="-24" width="10" height="48" rx="3" fill="#7c3aed"/><rect x="4" y="-24" width="10" height="48" rx="3" fill="#7c3aed"/></g><g transform="translate(440 130)"><circle r="46" fill="#fff" stroke="#6b7280" stroke-width="5"/><path d="M-12 -22L-12 22L22 0Z" fill="#cbd5e1"/><path d="M-30 -30L30 30" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/></g></g>
</g></svg>
