<svg xmlns="http://www.w3.org/2000/svg" data-n="3" data-t="1" data-c="#7c3aed" viewBox="0 0 560 300" role="img" aria-label="해가 지평선으로 기울며 하늘이 어두워지고 달이 떠오른다">
<defs>
<linearGradient id="dusk_day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#e8f7ff"/></linearGradient>
<linearGradient id="dusk_mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a6ad6"/><stop offset=".6" stop-color="#f08aa0"/><stop offset="1" stop-color="#ffc27a"/></linearGradient>
<linearGradient id="dusk_night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f4a"/><stop offset=".7" stop-color="#4a3a8a"/><stop offset="1" stop-color="#b0507a"/></linearGradient>
<radialGradient id="dusk_sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3a8"/><stop offset="1" stop-color="#ffb347"/></radialGradient>
<clipPath id="dusk_clip"><rect width="560" height="300" rx="14"/></clipPath>
</defs>
<g clip-path="url(#dusk_clip)">
<rect width="560" height="300" fill="url(#dusk_day)"/>
<g class="vs" data-s="2"><rect width="560" height="300" fill="url(#dusk_mid)"/></g>
