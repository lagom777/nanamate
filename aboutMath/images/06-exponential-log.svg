<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(236, 72, 153, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#ec4899"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 수학 핵심요약</text>
    <text x="135" y="20" fill="#ec4899" font-size="12" font-weight="800">PART 06</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">지수와 로그</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Exponents, Logarithmic Properties &amp; Graphs</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#ec4899" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
          <text x="83" y="34" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">지수의 확장</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">거듭제곱근과 지수법칙</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="90" rx="8" fill="#0f172a" stroke="#db2777" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#f472b6" font-size="12" font-weight="700">지수의 확장 단계</text>
                  <text x="12" y="46" fill="#e2e8f0" font-size="11.5">a⁰ = 1  ,  a⁻ⁿ = 1 / aⁿ (정수 확장, a≠0)</text>
                  <text x="12" y="66" fill="#e2e8f0" font-size="11.5">a^(m/n) = ⁿ√(aᵐ) (유리수 확장, a&gt;0)</text>
                  <text x="12" y="84" fill="#94a3b8" font-size="10.5">실수 지수: 지수법칙 그대로 성립 (aˣ·aʸ = aˣ⁺ʸ)</text>

                  <rect x="0" y="100" width="280" height="92" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="124" fill="#f59e0b" font-size="12" font-weight="700">⚡ a의 n제곱근 중 실수의 개수</text>
                  <text x="12" y="145" fill="#cbd5e1" font-size="11">n이 홀수: a 부호 상관없이 <tspan fill="#34d399" font-weight="700">무조건 1개</tspan> (ⁿ√a)</text>
                  <text x="12" y="165" fill="#cbd5e1" font-size="11">n이 짝수: a &gt; 0 이면 <tspan fill="#38bdf8" font-weight="700">2개</tspan> (±ⁿ√a)</text>
                  <text x="12" y="182" fill="#cbd5e1" font-size="11">         a = 0 이면 1개, a &lt; 0 이면 0개</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
          <text x="83" y="34" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">로그의 핵심 성질</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">밑변환 공식과 로그 법칙</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="700">로그 정의: aˣ = N ⟺ x = logₐN</text>
                  <text x="12" y="45" fill="#fcd34d" font-size="11">밑조건: <tspan font-weight="700">a &gt; 0, a ≠ 1</tspan>  /  진수조건: <tspan font-weight="700">N &gt; 0</tspan></text>
                  <text x="12" y="66" fill="#e2e8f0" font-size="11.5">logₐ(xy) = logₐx + logₐy</text>
                  <text x="12" y="84" fill="#e2e8f0" font-size="11.5">logₐ(x/y) = logₐx - logₐy  ,  logₐ(xᵏ) = k logₐx</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
                  <text x="12" y="126" fill="#f472b6" font-size="12" font-weight="700">🔑 밑변환 공식 &amp; 특수 성질</text>
                  <text x="12" y="148" fill="#ffffff" font-size="12.5" font-family="monospace" font-weight="700">logₐb = (log_c b) / (log_c a)</text>
                  <text x="12" y="170" fill="#38bdf8" font-size="11.5">a^(log_c b) = b^(log_c a)  ,  logₐb = 1 / log_b a</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
          <text x="83" y="34" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">그래프와 역함수</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">지수함수와 로그함수의 대칭</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#34d399" font-size="12" font-weight="700">y = aˣ vs y = logₐx (y = x 대칭 역함수)</text>
                  <text x="12" y="47" fill="#cbd5e1" font-size="11.5">a &gt; 1: 둘 다 <tspan fill="#34d399" font-weight="700">단조 증가</tspan> (x증가시 y증가)</text>
                  <text x="12" y="67" fill="#cbd5e1" font-size="11.5">0 &lt; a &lt; 1: 둘 다 <tspan fill="#f43f5e" font-weight="700">단조 감소</tspan></text>
                  <text x="12" y="87" fill="#94a3b8" font-size="11">지수 점근선: x축(y=0) / 로그 점근선: y축(x=0)</text>

                  <rect x="0" y="105" width="280" height="87" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="128" fill="#f59e0b" font-size="12" font-weight="700">🎯 상용로그와 자릿수</text>
                  <text x="12" y="150" fill="#e2e8f0" font-size="11.5">log₁₀N = n + α (n: 정수, 0 ≤ α &lt; 1)</text>
                  <text x="12" y="170" fill="#cbd5e1" font-size="11">n ≥ 0 이면 N은 <tspan fill="#38bdf8" font-weight="700">(n+1) 자리 정수</tspan></text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="123" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="101.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#거듭제곱근실수개수</text>
        
        <rect x="175" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="225.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#밑조건진수조건</text>
        
        <rect x="288" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="327.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#밑변환공식</text>
        
        <rect x="379" y="565" width="123" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="440.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#지수로그역함수대칭</text>
        
        <rect x="514" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="553.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#점근선판정</text>
        
        <rect x="605" y="565" width="68" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="639.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#상용로그</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Math Core Summary</text>
</svg>