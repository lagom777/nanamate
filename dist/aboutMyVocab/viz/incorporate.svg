<svg xmlns="http://www.w3.org/2000/svg" data-n="3" data-t="1" data-c="#2563eb" viewBox="0 0 560 300" role="img" aria-label="흩어진 조각들이 하나의 큰 틀 안으로 합쳐져 통합된다">
