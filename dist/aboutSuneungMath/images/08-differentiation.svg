<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(239, 68, 68, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#ef4444"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 수학 핵심요약</text>
    <text x="135" y="20" fill="#ef4444" font-size="12" font-weight="800">PART 08</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">미분 — 도함수와 그래프</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Derivative, Extreme Values &amp; Polynomial Proportions</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#ef4444" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
          <text x="83" y="34" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">미분계수의 정의</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">순간변화율과 접선의 기울기</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="90" rx="8" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#f87171" font-size="12" font-weight="700">미분계수 f'(a) 의 정의식</text>
                  <text x="12" y="47" fill="#ffffff" font-size="11.5" font-family="monospace">f'(a) = lim[h→0] {f(a+h) - f(a)} / h</text>
                  <text x="12" y="68" fill="#ffffff" font-size="11.5" font-family="monospace">     = lim[x→a] {f(x) - f(a)} / (x - a)</text>
                  <text x="12" y="85" fill="#cbd5e1" font-size="10.5">기하학적 의미: 곡선 위 (a, f(a))에서의 접선 기울기</text>

                  <rect x="0" y="100" width="280" height="92" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="124" fill="#f59e0b" font-size="12" font-weight="700">미분법 기본 공식</text>
                  <text x="12" y="145" fill="#e2e8f0" font-size="11.5">(xⁿ)' = n xⁿ⁻¹</text>
                  <text x="12" y="165" fill="#e2e8f0" font-size="11.5">곱의 미분: (fg)' = f'g + fg'</text>
                  <text x="12" y="184" fill="#38bdf8" font-size="11.5">합성함수 미분: {f(g(x))}' = f'(g(x)) · g'(x)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
          <text x="83" y="34" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">함수의 증감과 극값</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">도함수 부호와 그래프 개형</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="700">📈 함수의 증가·감소 판정</text>
                  <text x="12" y="47" fill="#cbd5e1" font-size="11.5">f'(x) &gt; 0 ⟹ 그 구간에서 <tspan fill="#34d399" font-weight="700">증가</tspan></text>
                  <text x="12" y="67" fill="#cbd5e1" font-size="11.5">f'(x) &lt; 0 ⟹ 그 구간에서 <tspan fill="#f43f5e" font-weight="700">감소</tspan></text>
                  <text x="12" y="85" fill="#cbd5e1" font-size="11">f'(x) = 0 이고 부호 바뀌면 ⟶ <tspan fill="#f59e0b" font-weight="700">극값(극대/극소)</tspan></text>

                  <rect x="0" y="100" width="280" height="92" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
                  <text x="12" y="124" fill="#fca5a5" font-size="12" font-weight="700">접선의 방정식 공식</text>
                  <text x="12" y="146" fill="#fef08a" font-size="12.5" font-family="monospace" font-weight="700">y - f(t) = f'(t)(x - t)</text>
                  <text x="12" y="168" fill="#cbd5e1" font-size="11">곡선 밖의 점 (x₁, y₁)에서 그은 접선:</text>
                  <text x="12" y="184" fill="#94a3b8" font-size="10.5">접점 (t, f(t)) 두고 접선 세운 뒤 대입해 t 방정식 풀이</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
          <text x="83" y="34" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">수능 킬러 치트키</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">3차·4차함수 그래프 비율 관계</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#fcd34d" font-size="12" font-weight="700">⚡ 3차함수 극값·접선 비율 관계 (2:1)</text>
                  <text x="12" y="47" fill="#e2e8f0" font-size="11.5">극댓값에서 그은 접선과 다시 만나는 점:</text>
                  <text x="12" y="68" fill="#38bdf8" font-size="12" font-weight="700">극대점 : 변곡점 : 극소점 : 교점 = 1 : 1 : 1</text>
                  <text x="12" y="87" fill="#fde68a" font-size="11.5">⟶ 접점과 극점, 교점 사이 비율 = <tspan font-weight="800">2 : 1</tspan></text>

                  <rect x="0" y="105" width="280" height="87" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="128" fill="#a78bfa" font-size="12" font-weight="700">⚡ 4차함수 대칭형 비율 관계 (1:√2)</text>
                  <text x="12" y="150" fill="#cbd5e1" font-size="11">W자 대칭형 4차함수 극대-극소 높이차:</text>
                  <text x="12" y="168" fill="#ffffff" font-size="11.5" font-family="monospace">Δy = (a / 4) · l⁴</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="85.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#미분계수정의</text>
        
        <rect x="142" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="181.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#곱의미분법</text>
        
        <rect x="233" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="278.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#극대극소판정</text>
        
        <rect x="335" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="380.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#접선의방정식</text>
        
        <rect x="437" y="565" width="167" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="520.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#3차함수비율(2:1:1)</text>
        
        <rect x="616" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="666.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#4차함수W개형</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Math Core Summary</text>
</svg>