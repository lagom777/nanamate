<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(14, 165, 233, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#0ea5e9"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 수학 핵심요약</text>
    <text x="135" y="20" fill="#0ea5e9" font-size="12" font-weight="800">PART 02</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">대수 — 다항식과 방정식</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Algebra, Polynomials &amp; Quadratic Equations</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#0ea5e9" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1"/>
          <text x="83" y="34" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">곱셈 공식 &amp; 인수분해</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">다항식 연산 &amp; 나머지 정리</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="110" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="700">📌 필수 곱셈 공식</text>
                  <text x="12" y="47" fill="#f1f5f9" font-size="11.5" font-family="monospace">(a+b)³ = a³ + 3a²b + 3ab² + b³</text>
                  <text x="12" y="70" fill="#f1f5f9" font-size="11.5" font-family="monospace">a³ + b³ = (a+b)(a² - ab + b²)</text>
                  <text x="12" y="93" fill="#f1f5f9" font-size="11.5" font-family="monospace">a³ - b³ = (a-b)(a² + ab + b²)</text>
                  
                  <rect x="0" y="120" width="280" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="144" fill="#f59e0b" font-size="12" font-weight="700">🔑 나머지 정리 &amp; 인수 정리</text>
                  <text x="12" y="165" fill="#cbd5e1" font-size="11.5">P(x)를 (x - α)로 나눈 나머지: <tspan fill="#38bdf8" font-weight="700">R = P(α)</tspan></text>
                  <text x="12" y="182" fill="#94a3b8" font-size="11">P(α) = 0 이면 P(x)는 (x - α)를 인수로 가짐</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1"/>
          <text x="83" y="34" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">이차방정식과 판별식</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">근의 공식과 실근의 개수</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(20, 50)">
                  <text x="0" y="18" fill="#38bdf8" font-size="12" font-weight="700">근의 공식: x = (-b ± √(b² - 4ac)) / 2a</text>
                  
                  <!-- D > 0, D = 0, D < 0 sketches -->
                  <g transform="translate(10, 35)">
                    <!-- D > 0 -->
                    <line x1="0" y1="40" x2="70" y2="40" stroke="#64748b" stroke-width="1.5"/>
                    <path d="M 5,10 Q 35,65 65,10" fill="none" stroke="#22c55e" stroke-width="2"/>
                    <circle cx="17" cy="40" r="3" fill="#22c55e"/>
                    <circle cx="53" cy="40" r="3" fill="#22c55e"/>
                    <text x="35" y="75" fill="#86efac" font-size="10" font-weight="700" text-anchor="middle">D > 0 (2실근)</text>
                    
                    <!-- D = 0 -->
                    <line x1="95" y1="40" x2="165" y2="40" stroke="#64748b" stroke-width="1.5"/>
                    <path d="M 100,10 Q 130,40 160,10" fill="none" stroke="#f59e0b" stroke-width="2"/>
                    <circle cx="130" cy="40" r="3" fill="#f59e0b"/>
                    <text x="130" y="75" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">D = 0 (중근)</text>
                    
                    <!-- D < 0 -->
                    <line x1="190" y1="40" x2="260" y2="40" stroke="#64748b" stroke-width="1.5"/>
                    <path d="M 195,15 Q 225,25 255,15" fill="none" stroke="#ef4444" stroke-width="2"/>
                    <text x="225" y="75" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">D &lt; 0 (허근)</text>
                  </g>
                  
                  <rect x="0" y="130" width="275" height="60" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
                  <text x="12" y="152" fill="#e0f2fe" font-size="11.5" font-weight="700">근과 계수의 관계 (ax² + bx + c = 0):</text>
                  <text x="12" y="174" fill="#38bdf8" font-size="12" font-family="monospace">α + β = -b/a ,  αβ = c/a</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1"/>
          <text x="83" y="34" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">수능 킬러/실전 팁</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">이차부등식 &amp; 실근의 부호</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="88" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#f59e0b" font-size="12" font-weight="700">💡 항상 성립하는 이차부등식</text>
                  <text x="12" y="46" fill="#cbd5e1" font-size="11.5">모든 실수 x에 대해 ax² + bx + c &gt; 0 성립 조건:</text>
                  <text x="12" y="68" fill="#38bdf8" font-size="12" font-weight="700" font-family="monospace">① a &gt; 0 (아래로 볼록)   ② D &lt; 0 (떠있음)</text>

                  <rect x="0" y="98" width="280" height="92" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="122" fill="#a78bfa" font-size="12" font-weight="700">🎯 두 근의 분리 (함·축·판)</text>
                  <text x="12" y="144" fill="#cbd5e1" font-size="11.5">두 근이 모두 p보다 클 조건:</text>
                  <text x="12" y="164" fill="#e2e8f0" font-size="11" font-family="monospace">1. f(p) &gt; 0 (경곗값 함숫값)</text>
                  <text x="12" y="180" fill="#e2e8f0" font-size="11" font-family="monospace">2. 축 -b/(2a) &gt; p   3. D ≥ 0</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="85.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#인수분해공식</text>
        
        <rect x="142" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="181.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#나머지정리</text>
        
        <rect x="233" y="565" width="68" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="267.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#판별식D</text>
        
        <rect x="313" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="363.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#근과계수의관계</text>
        
        <rect x="426" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="465.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#이차부등식</text>
        
        <rect x="517" y="565" width="123" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="578.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#근의분리(함축판)</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Math Core Summary</text>
</svg>