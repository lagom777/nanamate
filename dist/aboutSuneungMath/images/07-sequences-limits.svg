<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(6, 182, 212, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#06b6d4"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 수학 핵심요약</text>
    <text x="135" y="20" fill="#06b6d4" font-size="12" font-weight="800">PART 07</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">수열과 극한</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Sequences, Series &amp; Mathematical Induction</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#06b6d4" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
          <text x="83" y="34" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle">등차·등비수열</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">일반항과 합의 공식</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="90" rx="8" fill="#0f172a" stroke="#0891b2" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#22d3ee" font-size="12" font-weight="700">등차수열 (공차 d)</text>
                  <text x="12" y="46" fill="#ffffff" font-size="12" font-family="monospace">aₙ = a₁ + (n - 1)d</text>
                  <text x="12" y="66" fill="#ffffff" font-size="12" font-family="monospace">Sₙ = n(2a₁ + (n-1)d) / 2</text>
                  <text x="12" y="83" fill="#94a3b8" font-size="10.5">등차중항: 2b = a + c (가운데 항의 2배)</text>

                  <rect x="0" y="100" width="280" height="92" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="124" fill="#f59e0b" font-size="12" font-weight="700">등비수열 (공비 r)</text>
                  <text x="12" y="146" fill="#ffffff" font-size="12" font-family="monospace">aₙ = a₁ · rⁿ⁻¹</text>
                  <text x="12" y="166" fill="#ffffff" font-size="12" font-family="monospace">Sₙ = a(1 - rⁿ) / (1 - r) (r ≠ 1)</text>
                  <text x="12" y="184" fill="#94a3b8" font-size="10.5">등비중항: b² = ac</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
          <text x="83" y="34" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle">시그마(∑)의 공식</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">자연수의 거듭제곱의 합</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="110" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
                  <text x="12" y="24" fill="#67e8f9" font-size="12" font-weight="700">자연수 거듭제곱 합 3대 공식</text>
                  <text x="12" y="47" fill="#ffffff" font-size="11.5" font-family="monospace">∑ k = n(n + 1) / 2</text>
                  <text x="12" y="71" fill="#ffffff" font-size="11.5" font-family="monospace">∑ k² = n(n + 1)(2n + 1) / 6</text>
                  <text x="12" y="95" fill="#ffffff" font-size="11.5" font-family="monospace">∑ k³ = { n(n + 1) / 2 }²</text>

                  <rect x="0" y="120" width="280" height="72" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="144" fill="#34d399" font-size="12" font-weight="700">부분분수 분해 (소거형 망원급수)</text>
                  <text x="12" y="167" fill="#fde68a" font-size="12" font-family="monospace">1/(AB) = 1/(B-A) · (1/A - 1/B)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
          <text x="83" y="34" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle">수열의 극한 &amp; 급수</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">무한등비급수와 수렴 조건</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="700">🎯 수열의 극한 기본 성질</text>
                  <text x="12" y="45" fill="#cbd5e1" font-size="11">무한대/무한대 꼴: 최고차항 계수비로 수렴</text>
                  <text x="12" y="65" fill="#cbd5e1" font-size="11">무한대 - 무한대 (루트): 유리화 후 극한 계산</text>
                  <text x="12" y="84" fill="#fcd34d" font-size="11">샌드위치 정리 (조임정리): an ≤ bn ≤ cn</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
                  <text x="12" y="126" fill="#fda4af" font-size="12" font-weight="700">⚡ 무한등비급수의 수렴 (수능 단골)</text>
                  <text x="12" y="148" fill="#cbd5e1" font-size="11">수렴 조건: <tspan fill="#f43f5e" font-weight="800">-1 &lt; r &lt; 1</tspan> (|r| &lt; 1)</text>
                  <text x="12" y="172" fill="#ffffff" font-size="14" font-family="monospace" font-weight="800">S = a / (1 - r)</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="90.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#등차등비일반항</text>
        
        <rect x="153" y="565" width="134" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="220.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#시그마k·k²·k³</text>
        
        <rect x="299" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="349.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#부분분수망원합</text>
        
        <rect x="412" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="457.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#샌드위치정리</text>
        
        <rect x="514" y="565" width="167" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="597.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#무한등비급수a/(1-r)</text>
        
        <rect x="693" y="565" width="57" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="721.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#귀납법</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Math Core Summary</text>
</svg>