<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(168, 85, 247, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#a855f7"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 물리학 핵심요약</text>
    <text x="145" y="20" fill="#a855f7" font-size="12" font-weight="800">PART 08</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">양자물리 — 광전효과와 물질파</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Photoelectric Effect, Wave-Particle Duality &amp; Energy Levels</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#a855f7" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
          <text x="83" y="34" fill="#d8b4fe" font-size="11" font-weight="700" text-anchor="middle">광전효과</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">빛의 입자성: 광양자설</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#0f172a" stroke="#7e22ce" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#c084fc" font-size="12" font-weight="700">광전효과와 광자 에너지</text>
                  <text x="12" y="47" fill="#ffffff" font-size="13" font-family="monospace" font-weight="800">E = h · f = h · c / λ</text>
                  <text x="12" y="69" fill="#fde047" font-size="12" font-family="monospace">E_k(최대) = h f - W = h f - h f₀</text>
                  <text x="12" y="86" fill="#cbd5e1" font-size="10.5">W: 금속의 일함수  /  f₀: 문턱 진동수 (한계 진동수)</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="126" fill="#38bdf8" font-size="12" font-weight="700">광전효과의 핵심 성질 (수능 빈출)</text>
                  <text x="12" y="148" fill="#cbd5e1" font-size="11">1. f &lt; f₀ 이면 빛의 세기가 아무리 세도 전자 방출 0</text>
                  <text x="12" y="168" fill="#cbd5e1" font-size="11">2. 빛의 세기 비례 ⟶ <tspan fill="#38bdf8" font-weight="700">광전자 수 증가</tspan> (전자의 E_k는 불변!)</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
          <text x="83" y="34" fill="#d8b4fe" font-size="11" font-weight="700" text-anchor="middle">물질파 (드브로이)</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">입자의 파동성: λ = h / p</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="92" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
                  <text x="12" y="24" fill="#d8b4fe" font-size="12" font-weight="700">드브로이 물질파 파장 공식</text>
                  <text x="12" y="48" fill="#ffffff" font-size="14" font-family="monospace" font-weight="800">λ = h / p = h / (m · v)</text>
                  <text x="12" y="70" fill="#cbd5e1" font-size="11">질량 m 작고 속도 v 느릴수록 ⟶ 파장 λ 길어져 파동성 뚜렷</text>
                  <text x="12" y="86" fill="#38bdf8" font-size="10.5">전자현미경: 전자의 물질파 파장이 가시광선보다 10만배 짧아 해상도 극대화</text>

                  <rect x="0" y="102" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="126" fill="#34d399" font-size="12" font-weight="700">전자 회절 실험 (데이비슨-거머)</text>
                  <text x="12" y="148" fill="#cbd5e1" font-size="11">니켈 결정에 전자선을 쐈을 때 간섭·회절 무늬 발견</text>
                  <text x="12" y="168" fill="#ffffff" font-size="11.5" font-weight="700">⟹ 전자가 파동성을 지닌다는 직접적 증거</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
          <text x="83" y="34" fill="#d8b4fe" font-size="11" font-weight="700" text-anchor="middle">보어 원자 모형</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">에너지 준위 양자화와 스펙트럼</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#fcd34d" font-size="12" font-weight="700">수소 원자의 불연속적 에너지 준위</text>
                  <text x="12" y="48" fill="#ffffff" font-size="12.5" font-family="monospace">E_n = - 13.6 eV / n² (n = 1, 2, 3…)</text>
                  <text x="12" y="70" fill="#cbd5e1" font-size="11">전이 시 방출/흡수 광자: <tspan fill="#fde047" font-weight="700">h f = |E_m - E_n|</tspan></text>
                  <text x="12" y="87" fill="#94a3b8" font-size="10.5">라이먼계열(n=1 자외선), 발머(n=2 가시광선), 파셴(n=3 적외선)</text>

                  <rect x="0" y="105" width="280" height="87" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="128" fill="#f43f5e" font-size="12" font-weight="700">에너지 띠 이론과 반도체</text>
                  <text x="12" y="150" fill="#cbd5e1" font-size="11">원자가띠와 전도띠 사이 <tspan fill="#fca5a5" font-weight="700">띠 간격(Band Gap)</tspan></text>
                  <text x="12" y="168" fill="#e2e8f0" font-size="11">도체(간격0) &lt; 반도체(~1eV) &lt; 절연체(간격 큼)</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="96.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#광전효과E=hf</text>
        
        <rect x="164" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="220.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#일함수W=hf₀</text>
        
        <rect x="288" y="565" width="79" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="327.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#빛의입자성</text>
        
        <rect x="379" y="565" width="167" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="462.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#드브로이물질파λ=h/mv</text>
        
        <rect x="558" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="614.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#수소원자스펙트럼</text>
        
        <rect x="682" y="565" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="727.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#에너지띠이론</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Physics Core Summary</text>
</svg>