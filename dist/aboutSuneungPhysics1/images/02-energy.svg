<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0e1a; font-family:'IBM Plex Sans KR', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0e1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    
    <linearGradient id="card-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(255, 107, 53, 0.4)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 32)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#1e293b" stroke="#ff6b35" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#ff6b35"/>
    <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5">수능 물리학 핵심요약</text>
    <text x="145" y="20" fill="#ff6b35" font-size="12" font-weight="800">PART 02</text>
    
    <!-- Main Titles -->
    <text x="0" y="68" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">일과 역학적 에너지</text>
    <text x="0" y="94" fill="#94a3b8" font-size="14" font-weight="500">Work, Kinetic &amp; Potential Energy Conservation</text>

    <!-- Right Side Indicator -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NANAMATE EDUTECH</text>
      <text x="90" y="47" fill="#ff6b35" font-size="13" font-weight="800" text-anchor="middle">한눈에 보는 핵심 맵</text>
    </g>
  </g>

  <!-- 3 Summary Cards -->
  
        <!-- Card 1 -->
        <g transform="translate(40, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ff6b35" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-0)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ff6b35" fill-opacity="0.2" stroke="#ff6b35" stroke-width="1"/>
          <text x="83" y="34" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">일과 일-에너지 정리</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">알짜힘이 한 일과 운동에너지</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="90" rx="8" fill="#0f172a" stroke="#ea580c" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#fb923c" font-size="12" font-weight="700">일의 정의: W = F · s · cosθ</text>
                  <text x="12" y="46" fill="#cbd5e1" font-size="11.5">θ = 90° 이면 W = 0 (구심력, 수직항력의 일은 0)</text>
                  <text x="12" y="66" fill="#fde047" font-size="12" font-weight="700">일-에너지 정리 (Work-Energy Theorem):</text>
                  <text x="12" y="85" fill="#ffffff" font-size="12.5" font-family="monospace">W_net = ΔE_k = ½mv² - ½mv₀²</text>

                  <rect x="0" y="100" width="280" height="92" rx="8" fill="#0f172a" stroke="#334155"/>
                  <text x="12" y="124" fill="#38bdf8" font-size="12" font-weight="700">F-s 그래프 (힘-거리 그래프)</text>
                  <text x="12" y="146" fill="#cbd5e1" font-size="11.5">그래프 아래 면적 = <tspan fill="#38bdf8" font-weight="700">한 일 W</tspan></text>
                  <text x="12" y="166" fill="#cbd5e1" font-size="11.5">탄성력 F = kx 의 면적 = 탄성위치에너지 ½kx²</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(420, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ff6b35" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-1)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ff6b35" fill-opacity="0.2" stroke="#ff6b35" stroke-width="1"/>
          <text x="83" y="34" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">퍼텐셜 에너지</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">중력 &amp; 탄성력 퍼텐셜 에너지</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="24" fill="#34d399" font-size="12" font-weight="700">중력 퍼텐셜 에너지 (E_p)</text>
                  <text x="12" y="48" fill="#ffffff" font-size="13" font-family="monospace" font-weight="700">E_p = m g h</text>
                  <text x="12" y="70" fill="#94a3b8" font-size="11">기준면 설정에 따라 값 달라짐, ΔE_p가 물리적 본질</text>

                  <rect x="0" y="100" width="280" height="92" rx="8" fill="#1e293b" stroke="#ff6b35" stroke-width="1.2"/>
                  <text x="12" y="124" fill="#fdba74" font-size="12" font-weight="700">탄성 퍼텐셜 에너지 (용수철 상수 k)</text>
                  <text x="12" y="148" fill="#ffffff" font-size="13" font-family="monospace" font-weight="700">E_p = ½ k x²</text>
                  <text x="12" y="172" fill="#cbd5e1" font-size="11">용수철의 변위 x는 원래 길이로부터 늘어난(줄어든) 길이</text>
                </g>
                
          </g>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(800, 160)">
          <!-- Card Background &amp; Glow -->
          <rect x="0" y="0" width="360" height="375" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ff6b35" stroke-width="1.2" filter="url(#card-shadow)"/>
          <rect x="0" y="0" width="360" height="375" rx="16" fill="url(#card-grad-2)" fill-opacity="0.3"/>
          
          <!-- Card Header Badge -->
          <rect x="18" y="18" width="130" height="24" rx="12" fill="#ff6b35" fill-opacity="0.2" stroke="#ff6b35" stroke-width="1"/>
          <text x="83" y="34" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">수능 킬러 단골</text>
          
          <!-- Card Title -->
          <text x="18" y="62" fill="#f8fafc" font-size="16" font-weight="700">역학적 에너지 보존 법칙</text>
          <line x1="18" y1="74" x2="342" y2="74" stroke="#334155" stroke-width="1"/>
          
          <!-- Card Content Body -->
          <g transform="translate(0, 30)">
            
                <g transform="translate(18, 50)">
                  <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e293b" stroke="#ff6b35" stroke-width="1.5"/>
                  <text x="12" y="24" fill="#fb923c" font-size="12" font-weight="700">⚡ 역학적 에너지 보존 (보존력만 작용 시)</text>
                  <text x="12" y="47" fill="#ffffff" font-size="12" font-family="monospace" font-weight="800">E = E_k + E_p = ½mv² + mgh + ½kx² = 일정</text>
                  <text x="12" y="70" fill="#cbd5e1" font-size="11">감소한 위치에너지 = 증가한 운동에너지 (ΔE_k = -ΔE_p)</text>

                  <rect x="0" y="105" width="280" height="87" rx="8" fill="#1e293b" stroke="#334155"/>
                  <text x="12" y="128" fill="#f43f5e" font-size="12" font-weight="700">마찰·공기저항 있는 경우 (비보존력)</text>
                  <text x="12" y="150" fill="#e2e8f0" font-size="11.5">역학적 에너지 감소량 = <tspan fill="#f43f5e" font-weight="700">발생한 열에너지 Q</tspan></text>
                  <text x="12" y="168" fill="#cbd5e1" font-size="11">W_friction = - f · s = E_after - E_before</text>
                </g>
                
          </g>
        </g>
        

  <!-- Bottom Tag Bar -->
  <g transform="translate(0, 45)">
    
        <rect x="40" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="90.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#일-에너지정리</text>
        
        <rect x="153" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="209.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#W=Fscosθ</text>
        
        <rect x="277" y="565" width="101" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="327.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#중력위치mgh</text>
        
        <rect x="390" y="565" width="123" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="451.5" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#용수철탄성½kx²</text>
        
        <rect x="525" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="581.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#역학적에너지보존</text>
        
        <rect x="649" y="565" width="112" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="705.0" y="583" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">#마찰손실열에너지</text>
        
  </g>

  <!-- Footer Watermark -->
  <text x="1160" y="650" fill="#475569" font-size="11" font-weight="500" text-anchor="end">nanamate.study · High School Physics Core Summary</text>
</svg>