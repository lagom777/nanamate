<main><header class="paper-header"><h1><em>사회학</em></h1><p class="authors">Vol. 18 · May 2026</p></header>
<div class="scene-3d" id="intro-scene"></div><span class="interact-hint">👥 인터랙티브 3D 시각화</span>
<h2>소개</h2><p>이 사이트에서는 사회학의 핵심 개념을 9개 챕터에 걸쳐 3D 인터랙티브로 학습합니다.</p></main></div>
<script>
(function(){
  const c=document.getElementById('intro-scene');if(!c)return;const s=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(50,c.clientWidth/c.clientHeight,0.1,1000);cam.position.set(0,0,8);cam.lookAt(0,0,0);
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setSize(c.clientWidth,c.clientHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));c.appendChild(r.domElement);
  const C=10980346;const nodes=[];for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,12),new THREE.MeshBasicMaterial({color:C}));m.position.set((Math.random()-0.5)*6,(Math.random()-0.5)*4,(Math.random()-0.5)*4);s.add(m);nodes.push(m);}for(let i=0;i<18;i++){const A=nodes[Math.floor(Math.random()*nodes.length)],B=nodes[Math.floor(Math.random()*nodes.length)];s.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([A.position,B.position]),new THREE.LineBasicMaterial({color:C,transparent:true,opacity:0.25})));}
  let md=false,px=0,py=0;c.addEventListener('mousedown',e=>{md=true;px=e.clientX;py=e.clientY;});window.addEventListener('mouseup',()=>md=false);c.addEventListener('mousemove',e=>{if(md){s.rotation.y+=(e.clientX-px)*0.005;s.rotation.x+=(e.clientY-py)*0.005;px=e.clientX;py=e.clientY;}});
  let T=0;function a(){requestAnimationFrame(a);T+=0.016;s.rotation.y+=0.003;r.render(s,cam);}a();
  window.addEventListener('resize',()=>{cam.aspect=c.clientWidth/c.clientHeight;cam.updateProjectionMatrix();r.setSize(c.clientWidth,c.clientHeight);});
})();
</script>
